function parseTag(inner) {

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));

// amber cue with duration, sound and last words; directions a pale cue; straps
// (lower thirds) are for the gallery, not the presenter, so they're left out.
function textHtml(chunk) {
  return esc(chunk).replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
}
function scriptHtml(script) {
  const text = String(script ?? '').replace(/\r\n?/g, '\n');

  let out = '', last = 0;
  for (const m of text.matchAll(TAG_RE)) {
    out += textHtml(text.slice(last, m.index));

    const tag = parseTag(m[1]);
    if (tag.kind === 'clip') {
      const bits = ['Clip', tag.duration, tag.title, tag.sound].filter(Boolean).map(esc).join(' · ');
      out += `<span class="pill clip">▶ ${bits}${tag.lastWords ? `<span class="lw">LW: ${esc(tag.lastWords)}</span>` : ''}</span>`;
    } else if (tag.kind === 'instructions' && tag.text) {

  return out.replace(/(<br>\s*)+(<span class="pill)/g, '$2').replace(/(<\/span>)(\s*<br>)+/g, '$1').replace(/^(\s*<br>)+|(<br>\s*)+$/g, '');

const LS = { room: 'moiradesk_mobile_room', prefs: 'moiradesk_mobile_prompt_prefs' };

const prefs = { speed: 35, fontSize: 32, keepAwake: true };

  const saved = JSON.parse(lsGet(LS.prefs));
  for (const [key, min, max] of [['speed', 5, 150], ['fontSize', 20, 64]]) {
    if (typeof saved?.[key] === 'number' && Number.isFinite(saved[key])) prefs[key] = Math.max(min, Math.min(max, saved[key]));

const savePrefs = () => lsSet(LS.prefs, JSON.stringify(prefs));

const app = document.getElementById('app');
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let epoch = 0, channel = null, refreshTimer = null, refreshRunning = null, refreshAgain = false;
// live: null while subscribing, then whether realtime is currently delivering.

function updateWakeStatus() {
  for (const el of document.querySelectorAll('[data-wake-status]')) { el.textContent = wakeLabels[wakeState]; el.dataset.wakeState = wakeState; }

}

  await request;

function promptIds() {
  const end = state.order.indexOf('marker-line');

}
const readableIds = () => promptIds().filter(id => state.stories[id].type !== 'segment');

}

}

    <div class="brand">Moira:Desk / On the move</div><h1>Your bulletin.<br>Ready to read.</h1>

    <form id="join-form"><label for="code">Newsroom code</label><input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="80" required aria-describedby="join-error" placeholder="Enter code">

  app.innerHTML = `<main class="card"><div><div class="brand">Moira:Desk</div><h1>Unable to load</h1><p role="alert">${esc(message)}</p><button data-act="retry">Try again</button> <button data-act="change-room">Enter a code</button></div></main>`;

async function loadRooms() {
  const { data, error } = await supabase.rpc('my_newsrooms');

}

async function join(code) {
  // Only a join for the current screen blocks; an abandoned one finishes harmlessly.
  if (state.joining === epoch || !code.trim()) return;
  const token = epoch; state.joining = token;

async function snapshot(id) {

async function openRoom(id) {

// The shell is built once per room; script updates only replace #content so

    <main id="stage" tabindex="0" aria-label="Bulletin script"><div id="content"></div></main>

function renderScripts() {

function setPlaying(on) {
