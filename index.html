                    </div>
                    <div class="p-6">${renderJoinForm()}</div>
                </div>
            </div>`;
        }

        function renderTargetControl(totalDuration) {
            const target = state.meta.targetDuration;
            let inner;
            if (target == null) {
                inner = `<button type="button" data-action="edit-target" title="Set a target duration for this rundown"
                    class="text-xs font-medium px-2.5 py-1.5 rounded-lg border border-dashed bg-white text-slate-400 border-slate-300 hover:border-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fa-solid fa-bullseye mr-1.5"></i>Set target</button>`;
            } else {
                const delta = totalDuration - target;
                const absLabel = formatDuration(Math.abs(delta));
                let chipClasses, chipText;
                if (Math.abs(delta) <= 5) { chipClasses = 'bg-emerald-50 text-emerald-700 border-emerald-200'; chipText = 'On time'; }
                else if (delta < 0) { chipClasses = 'bg-amber-50 text-amber-700 border-amber-200'; chipText = '−' + absLabel + ' under'; }
                else { chipClasses = 'bg-red-50 text-red-700 border-red-200'; chipText = '+' + absLabel + ' over'; }
                inner = `
                    <button type="button" data-action="edit-target" title="Click to change target"
                        class="text-xs font-medium px-1.5 py-1 rounded text-slate-500 hover:text-slate-700 hover:bg-slate-100 transition-colors">Target ${formatDuration(target)}</button>
                    <span class="text-[11px] font-bold px-2 py-1 rounded-full border ${chipClasses}">${chipText}</span>`;
            }
            return `<span id="target-control" class="flex items-center gap-1">${inner}</span>`;
        }

        function renderCuezControls() {
            if (state.localMode) {
                return `<span class="text-xs text-slate-400 border border-dashed border-slate-300 rounded-lg px-2.5 py-1.5" title="Add your Supabase details to index.html to send to Cuez"><i class="fa-solid fa-tower-broadcast mr-1.5"></i>Cuez needs Supabase</span>`;
            }
            if (!state.meta.cuezPartUid) {
                return `<span class="text-xs text-slate-500 border border-dashed border-slate-300 rounded-lg px-3 py-2" title="Your tutor sets which Cuez episode and part this newsroom sends to"><i class="fa-solid fa-tower-broadcast mr-1.5"></i>No Cuez target yet: ask your tutor</span>`;
            }
            const pending = cuezPendingIds().length;
            const sending = cuezSendInProgress();
            const notMine = hasProducer() && !isProducer();
            const disabled = sending || !pending || notMine;
            const label = sending ? '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Sending…'
                : !pending ? '<i class="fa-solid fa-check mr-2"></i>All in Cuez'
                : notMine ? `<i class="fa-solid fa-crown mr-2"></i>Producer sends`
                : `<i class="fa-solid fa-paper-plane mr-2"></i>Send ${pending} to Cuez`;
            return `
                <div class="flex items-stretch rounded-lg shadow-sm overflow-hidden border ${disabled ? 'border-slate-300' : 'border-emerald-700'}">
                    <span class="bg-white text-slate-600 px-3 text-xs font-medium max-w-[14rem] truncate flex items-center" title="Sends to ${escapeHTML(cuezTargetLabel())}. Set by your tutor.">
                        <i class="fa-solid fa-tower-broadcast mr-1.5 text-blue-500"></i>${escapeHTML(cuezTargetLabel())}
                    </span>
                    <button data-action="send-to-cuez" ${disabled ? 'disabled' : ''} ${notMine && pending ? `title="Only the producer (${escapeHTML(state.meta.producerName || '')}) can send to Cuez"` : ''}
                        class="${disabled ? 'bg-slate-200 text-slate-500 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 text-white'} px-4 py-2.5 font-medium transition-colors whitespace-nowrap">${label}</button>
                </div>`;
        }

        function renderMain() {
            if (state.ui.needsJoin) return renderJoinScreen();
            if (!state.localMode && !state.currentBulletinId) {
                return state.connectionState === 'error' ? '' : `<div class="flex h-full items-center justify-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin mr-3"></i>Connecting…</div>`;
            }
            return renderViewBar() + (state.ui.view === 'conference' ? renderConference() : renderNewsroom());
        }

        // Conference / Running order switch, plus who the producer is.
        function renderViewBar() {
            const pitches = currentPitches();
            const open = pitches.filter(p => p.status === 'pitched').length;
            const stories = (state.meta.order || []).filter(id => id !== 'marker-line' && state.storiesMap[id]?.type !== 'segment').length;
            const tab = (view, icon, label, count) => {
                const on = state.ui.view === view;
                return `<button data-action="show-view" data-val="${view}" class="px-4 py-2 rounded-lg text-sm font-bold transition-colors ${on ? 'bg-white text-slate-800 shadow-sm border border-slate-200' : 'text-slate-500 hover:text-slate-800'}">
                    <i class="fa-solid ${icon} mr-2 ${on ? 'text-blue-500' : ''}"></i>${label}${count ? `<span class="ml-2 text-[11px] font-bold bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded-full">${count}</span>` : ''}</button>`;
            };
            let producer = '';
            if (!state.localMode) {
                if (isProducer()) {
                    producer = `<span class="flex items-center gap-2"><span class="text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300 px-3 py-1.5 rounded-full"><i class="fa-solid fa-crown mr-1.5"></i>You're producer</span>
                        <button data-action="release-producer" class="text-xs text-slate-500 hover:text-slate-800 underline">Step down</button></span>`;
                } else if (hasProducer()) {
                    producer = `<span class="text-xs font-bold bg-slate-100 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-full" title="The producer picks the stories and sends the bulletin to Cuez"><i class="fa-solid fa-crown mr-1.5 text-amber-500"></i>Producer: ${escapeHTML(state.meta.producerName || 'someone')}</span>`;
                } else {
                    producer = `<span class="flex items-center gap-2"><span class="text-xs text-slate-500">No producer yet</span>
                        <button data-action="claim-producer" ${state.ui.pitchBusy ? 'disabled' : ''} class="text-xs font-bold bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-full shadow-sm transition-colors" title="For whoever drew the queen"><i class="fa-solid fa-crown mr-1.5"></i>I'm the producer</button></span>`;
                }
            }
            return `<div class="${state.ui.view === 'conference' ? 'max-w-5xl' : 'max-w-7xl'} mx-auto px-4 md:px-6 pt-4 flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                    ${tab('conference', 'fa-comments', 'Conference', open)}
                    ${tab('rundown', 'fa-bars-staggered', 'Running order', stories)}
                </div>
                ${producer}
            </div>`;
        }

        function renderPitchCard(p, n) {
            const mine = canEditPitch(p);
            const producer = isProducer();
            const busy = state.ui.pitchBusy ? 'disabled' : '';
            if (state.ui.editingPitchId === p.id && mine) {
                const formats = state.meta.formats || DEFAULT_FORMATS;
                return `<div class="bg-white border-2 border-blue-300 rounded-xl p-3 space-y-2">
                    <div class="grid grid-cols-1 sm:grid-cols-6 gap-2">
                        <input id="pitch-edit-slug-${p.id}" data-preserve data-pitch-enter="save" data-id="${p.id}" value="${escapeHTML(p.slug)}" maxlength="80" class="sm:col-span-2 border rounded-lg px-3 py-2 font-bold uppercase outline-none focus:border-blue-500" placeholder="Slug">
                        <input id="pitch-edit-angle-${p.id}" data-preserve data-pitch-enter="save" data-id="${p.id}" value="${escapeHTML(p.angle)}" maxlength="500" spellcheck="true" lang="en-GB" class="sm:col-span-4 border rounded-lg px-3 py-2 outline-none focus:border-blue-500" placeholder="The angle, in a line">
                        <input id="pitch-edit-by-${p.id}" data-preserve data-pitch-enter="save" data-id="${p.id}" value="${escapeHTML(p.pitchedBy)}" maxlength="60" class="sm:col-span-4 border rounded-lg px-3 py-2 outline-none focus:border-blue-500" placeholder="Pitched by">
                        <div class="sm:col-span-2 flex gap-2 justify-end">
                            <button data-action="cancel-pitch-edit" class="px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 text-sm">Cancel</button>
                            <button data-action="save-pitch-edit" data-id="${p.id}" ${busy} class="btn-primary !py-2 text-sm">Save</button>
                        </div>
                    </div>
                </div>`;
            }
            const story = p.storyId ? state.storiesMap[p.storyId] : null;
            let actions = '';
            if (p.status === 'pitched') {
                actions = (producer ? `<button data-action="pick-pitch" data-id="${p.id}" ${busy} class="text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg transition-colors" title="Add to the running order"><i class="fa-solid fa-check mr-1"></i>Pick</button>
                    <button data-action="spike-pitch" data-id="${p.id}" ${busy} class="text-xs font-bold bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg transition-colors"><i class="fa-solid fa-ban mr-1"></i>Spike</button>` : '')
                    + (mine ? `<button data-action="edit-pitch" data-id="${p.id}" class="p-1.5 text-slate-400 hover:text-blue-600" title="Edit pitch"><i class="fa-solid fa-pen text-xs"></i></button>
                    <button data-action="delete-pitch" data-id="${p.id}" class="p-1.5 text-slate-400 hover:text-red-600" title="Remove pitch"><i class="fa-solid fa-trash text-xs"></i></button>` : '');
            } else if (p.status === 'picked') {
                const fmts = [...new Set([...(state.meta.formats || DEFAULT_FORMATS), story?.format].filter(Boolean))];
                actions = (story && producer ? `<label class="flex items-center gap-1.5 text-xs text-slate-500 mr-1" title="How will we cover it? Sets the format in the running order">Format
                        <select class="picked-format border border-slate-300 rounded-lg px-2 py-1 text-xs font-mono font-bold text-slate-700 bg-white outline-none focus:border-blue-500" data-id="${p.storyId}" ${busy}>
                            ${fmts.map(f => `<option value="${escapeHTML(f)}" ${f === story.format ? 'selected' : ''}>${escapeHTML(f)}</option>`).join('')}
                        </select></label>
                        <label class="flex items-center gap-1.5 text-xs text-slate-500" title="Assign a reporter; saves when you leave the field">Reporter
                            <input class="picked-reporter w-32 min-w-0 border border-slate-300 rounded-lg px-2 py-1 text-xs text-slate-700 bg-white outline-none focus:border-blue-500" data-id="${p.storyId}" list="conference-reporters" maxlength="60" autocomplete="off" placeholder="Unassigned" value="${escapeHTML(story.reporter)}" ${busy}>
                        </label>` : '')
                    + (story ? `<button data-action="open-picked" data-id="${p.storyId}" class="text-xs font-bold text-blue-600 hover:text-blue-800 px-2 py-1.5">In running order <i class="fa-solid fa-arrow-right ml-1"></i></button>`
                        : `<span class="text-xs text-slate-400 italic px-2">Dropped from the running order</span>`)
                    + (producer ? `<button data-action="unpick-pitch" data-id="${p.id}" ${busy} class="text-xs font-bold bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 px-3 py-1.5 rounded-lg transition-colors" title="Take it back out of the running order (only while nobody has written it)"><i class="fa-solid fa-xmark mr-1"></i>Drop</button>` : '');
            } else {
                actions = producer ? `<button data-action="spike-pitch" data-id="${p.id}" ${busy} class="text-xs text-slate-500 hover:text-slate-800 underline px-1">Why?</button>
                    <button data-action="unspike-pitch" data-id="${p.id}" ${busy} class="text-xs text-slate-500 hover:text-slate-800 underline px-1">Back in</button>` : '';
            }
            const tone = p.status === 'picked' ? 'border-emerald-200 bg-emerald-50/40' : p.status === 'spiked' ? 'border-slate-200 bg-slate-50 opacity-75' : 'border-slate-200 bg-white';
            return `<div class="border ${tone} rounded-xl p-3 flex gap-3 items-start" data-pitch-id="${p.id}">
                <div class="text-slate-400 font-mono text-sm w-6 text-right pt-0.5 shrink-0">${n}</div>
                <div class="flex-1 min-w-0 flex flex-col sm:flex-row sm:items-start gap-2">
                <div class="flex-1 min-w-0">
                    <div class="font-bold uppercase tracking-wide text-slate-800 ${p.status === 'spiked' ? 'line-through decoration-slate-400' : ''}">${escapeHTML(p.slug)}
                        ${story && !producer && story.format ? `<span class="ml-2 align-middle bg-slate-100 border px-1.5 py-0.5 rounded text-[10px] font-mono font-bold text-slate-600">${escapeHTML(story.format)}</span>` : ''}</div>
                    ${p.angle ? `<div class="text-sm text-slate-600 mt-0.5">${escapeHTML(p.angle)}</div>` : ''}
                    <div class="text-xs text-slate-400 mt-1">${p.pitchedBy ? `Pitched by ${escapeHTML(p.pitchedBy)}` : 'Pitched'}${p.status === 'spiked' && p.spikeReason ? ` · <span class="text-slate-600">Spiked: ${escapeHTML(p.spikeReason)}</span>` : p.status === 'spiked' ? ' · Spiked' : ''}</div>
                    ${story && !producer ? `<div class="text-xs text-blue-700 mt-1">Reporter: ${escapeHTML(story.reporter || 'Unassigned')}</div>` : ''}
                    ${p.epNote ? `<div class="mt-2 text-xs bg-amber-50 border border-amber-200 text-amber-900 rounded-lg px-2.5 py-1.5"><i class="fa-solid fa-chalkboard-user mr-1.5 text-amber-500"></i><b>EP:</b> ${escapeHTML(p.epNote)}</div>` : ''}
                </div>
                <div class="flex items-center gap-1 flex-wrap sm:justify-end shrink-0">${actions}</div>
                </div>
            </div>`;
        }

        function renderConference() {
            if (state.localMode) {
                return `<div class="max-w-3xl mx-auto p-6"><div class="bg-white border border-dashed border-slate-300 rounded-xl p-8 text-center text-slate-500">
                    <i class="fa-solid fa-comments text-3xl text-slate-300 mb-3"></i><p>News conference needs a Supabase connection, so the whole group can pitch together.</p></div></div>`;
            }
            const pitches = currentPitches();
            const pitched = pitches.filter(p => p.status === 'pitched');
            const picked = pitches.filter(p => p.status === 'picked').sort((a, b) => String(a.decidedAt).localeCompare(String(b.decidedAt)));
            const spiked = pitches.filter(p => p.status === 'spiked');
            const formats = state.meta.formats || DEFAULT_FORMATS;
            const started = state.meta.conferenceStartedAt ? new Date(state.meta.conferenceStartedAt) : null;
            const who = isProducer() ? 'You pick the stories: Pick adds one to the running order, Spike drops it (with a reason, if you give one).'
                : hasProducer() ? `Anyone can pitch. ${escapeHTML(state.meta.producerName || 'The producer')} picks the stories.`
                : 'Anyone can pitch. Whoever drew the queen should claim producer: they pick the stories.';
            const section = (title, list, empty, offset = 0) => `
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">${title} <span class="text-slate-400">${list.length}</span></h3>
                    <div class="space-y-2">${list.length ? list.map((p, i) => renderPitchCard(p, i + 1 + offset)).join('') : `<div class="text-sm text-slate-400 italic border border-dashed border-slate-200 rounded-xl px-4 py-3">${empty}</div>`}</div>
                </div>`;
            return `<div class="max-w-5xl mx-auto p-4 md:p-6 pb-24 space-y-6">
                <div>
                    <h2 class="text-3xl font-bold text-slate-800"><i class="fa-solid fa-comments mr-3 text-slate-400"></i>News conference</h2>
                    <p class="text-sm text-slate-500 mt-1">${started ? `Started ${started.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })} at ${started.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}. ` : ''}${who}</p>
                </div>
                <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4">
                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
                        <input id="pitch-new-slug" data-preserve data-pitch-enter="add" maxlength="80" autocomplete="off" class="sm:col-span-3 border rounded-lg px-3 py-2.5 font-bold uppercase outline-none focus:border-blue-500" placeholder="Slug">
                        <input id="pitch-new-angle" data-preserve data-pitch-enter="add" maxlength="500" autocomplete="off" spellcheck="true" lang="en-GB" class="sm:col-span-6 border rounded-lg px-3 py-2.5 outline-none focus:border-blue-500" placeholder="The angle, in a line">
                        <input id="pitch-new-by" data-preserve data-pitch-enter="add" maxlength="60" autocomplete="off" value="${isProducer() ? '' : escapeHTML(state.myName)}" class="sm:col-span-2 border rounded-lg px-3 py-2.5 outline-none focus:border-blue-500" placeholder="Pitched by">
                        <button data-action="add-pitch" ${state.ui.pitchBusy ? 'disabled' : ''} class="sm:col-span-1 btn-primary !py-2.5"><i class="fa-solid fa-plus"></i><span class="sm:hidden ml-2">Add pitch</span></button>
                    </div>
                </div>
                ${section('Pitched', pitched, 'No pitches yet. Add the first one above.')}
                ${section('Picked for the bulletin', picked, isProducer() ? 'Nothing picked yet.' : 'The producer hasn\'t picked anything yet.')}
                <datalist id="conference-reporters">${[...new Set([...pitches.map(p => p.pitchedBy), ...Object.values(state.storiesMap).flatMap(s => [s.reporter, s.presenter])].map(name => (name || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b)).map(name => `<option value="${escapeHTML(name)}"></option>`).join('')}</datalist>
                ${spiked.length ? section('Spiked', spiked, '') : ''}
                ${picked.length ? `<div class="text-right"><button data-action="show-view" data-val="rundown" class="text-sm font-bold text-blue-600 hover:text-blue-800">Go to the running order <i class="fa-solid fa-arrow-right ml-1"></i></button></div>` : ''}
            </div>`;
        }

        function renderNewsroom() {
            let totalDuration = 0;
            let isBelowLine = false;
            const order = state.meta.order || [];
            const live = new Set(cuezLiveIds());

            const rows = order.map((id, idx) => {
                if (id === 'marker-line') {
                    isBelowLine = true;
                    return `<tr class="bg-red-50 border-y-4 border-red-200 shadow-inner" data-story-id="${id}" draggable="true">
                        <td class="px-4 py-3 text-center text-red-400 cursor-grab active:cursor-grabbing w-10 bg-red-100 hover:text-red-500 transition-colors"><i class="fa-solid fa-grip-lines"></i></td>
                        <td colspan="9" class="px-4 py-3"><span class="text-sm font-black tracking-widest uppercase text-red-900"><i class="fa-solid fa-arrow-down text-red-500 mr-2"></i> End of programme</span>
                        <span class="ml-3 text-xs font-normal text-red-400 normal-case tracking-normal">Stories below the line aren't sent to Cuez</span></td>
                    </tr>`;
                }
                const story = state.storiesMap[id];
                if (!story) return '';

                if (story.type === 'segment') {
                    if (!isBelowLine) totalDuration += story.duration || 0;
                    return `<tr class="segment-row" data-story-id="${id}" draggable="true">
                        <td colspan="10">
                            <div class="segment-divider">
                                <div class="segment-label"><i class="fa-solid fa-scissors mr-2 opacity-40"></i>${escapeHTML(story.slug)}</div>
                                ${story.duration > 0 ? `<span class="segment-dur">${formatDuration(story.duration)}</span>` : ''}
                                <div class="segment-line"></div>
                                <div class="flex items-center gap-1 px-2">
                                    <button data-action="edit-story" data-id="${id}" class="p-1.5 text-indigo-300 hover:text-indigo-700 transition-colors" title="Edit segment"><i class="fa-solid fa-pen text-xs"></i></button>
                                    <button data-action="delete-story" data-id="${id}" class="p-1.5 text-indigo-300 hover:text-red-500 transition-colors" title="Delete segment"><i class="fa-solid fa-trash text-xs"></i></button>
                                </div>
                            </div>
                        </td>
                    </tr>`;
                }

                if (!isBelowLine && !story.isFloated) totalDuration += story.duration || 0;
                const locked = isLockedByOther(story);
                const blocked = lockState(story) === 'other';

                let rowClasses = 'border-b border-slate-200 transition-colors ';
                rowClasses += isBelowLine ? 'bg-slate-100 opacity-80 ' : 'bg-white hover:bg-slate-50 ';
                if (story.isFloated && !isBelowLine) rowClasses += 'opacity-50 ';

                return `<tr class="${rowClasses}" data-story-id="${id}" draggable="true">
                    <td class="px-3 py-1.5 text-center w-10 ${locked ? 'text-slate-200 cursor-not-allowed' : 'text-slate-400 cursor-grab active:cursor-grabbing hover:text-blue-500'}" title="${locked ? `Being edited by ${escapeHTML(story.lockedByName)}` : 'Drag to reorder'}">
                        <i class="row-drag-icon fa-solid fa-grip-vertical"></i>
                        ${!locked ? `<div class="row-reorder-btns">
                            <button data-action="move-story-up" data-id="${id}" class="text-slate-400 hover:text-blue-500 text-xs leading-none py-0.5 px-1" ${idx === 0 ? 'disabled' : ''}>▲</button>
                            <button data-action="move-story-down" data-id="${id}" class="text-slate-400 hover:text-blue-500 text-xs leading-none py-0.5 px-1" ${idx === order.length - 1 ? 'disabled' : ''}>▼</button>
                        </div>` : ''}
                    </td>
                    <td class="px-3 py-1.5 font-semibold w-1/4">
                        <span data-action="inline-edit-slug" data-id="${id}" class="inline-block cursor-text hover:bg-slate-100/50 px-1 -mx-1 rounded transition-colors" title="Click to edit slug">${escapeHTML(story.slug)}</span>
                        ${blocked ? `<span class="ml-2 text-[10px] font-bold text-red-600 whitespace-nowrap"><i class="fa-solid fa-lock mr-1"></i>${escapeHTML(story.lockedByName)}</span>`
                            : locked ? `<span class="ml-2 text-[10px] font-bold text-blue-600 whitespace-nowrap" title="Open in another of your tabs"><i class="fa-solid fa-lock mr-1"></i>You, other tab</span>` : ''}
                        ${story.isFloated ? `<span class="ml-2 text-[10px] font-bold bg-amber-100 text-amber-700 border border-amber-200 px-1.5 py-0.5 rounded uppercase tracking-wide">Floated</span>` : ''}
                        ${story.brief ? `<i class="fa-solid fa-lightbulb ml-2 text-violet-400 text-xs" title="${escapeHTML(`Pitch: ${story.brief}${story.pitchedBy ? ` (${story.pitchedBy})` : ''}`)}"></i>` : ''}
                    </td>
                    <td class="px-3 py-1.5 text-sm w-24"><span class="bg-slate-100 border px-2 py-0.5 rounded text-xs font-mono font-bold">${escapeHTML(story.format)}</span></td>
                    <td class="px-3 py-1.5 w-32"><div class="text-xs font-bold text-blue-700">${escapeHTML(story.reporter)}</div><div class="text-xs text-slate-600">${escapeHTML(story.presenter)}</div></td>
                    <td class="px-3 py-1.5 text-sm w-20 font-mono">${story.isFloated ? `<span class="line-through text-slate-400">${formatDuration(story.duration)}</span>` : formatDuration(story.duration)}</td>
                    <td class="px-3 py-1.5 text-sm italic truncate max-w-xs">${escapeHTML(story.script || 'No script…')}</td>
                    <td class="px-3 py-1.5 text-center w-16"><button data-action="toggle-complete" data-id="${id}" class="text-lg ${checkColour(story.completed)} transition-colors" title="${checkTitle(story.completed)}"><i class="fa-solid fa-circle"></i></button></td>
                    <td class="px-3 py-1.5 text-center w-16">
                        <button data-action="toggle-float" data-id="${id}" class="text-lg ${story.isFloated ? 'text-amber-500' : 'text-slate-300'} transition-colors" title="${story.isFloated ? 'Un-float story' : 'Float story (keeps it out of TRT and Cuez)'}"><i class="fa-solid fa-circle-pause"></i></button>
                    </td>
                    <td class="px-3 py-1.5 text-center w-28">${renderCuezBadge(id, story, live.has(id))}</td>
                    <td class="px-3 py-1.5 text-right w-20 whitespace-nowrap">
                        <button data-action="edit-story" data-id="${id}" class="p-1.5 ${blocked ? 'text-slate-200 cursor-not-allowed' : 'text-slate-400 hover:text-blue-600'} transition-colors"
                            ${blocked ? `disabled title="Being edited by ${escapeHTML(story.lockedByName)}"` : 'title="Edit story"'}><i class="fa-solid fa-pen text-xs"></i></button>
                        <button data-action="delete-story" data-id="${id}" class="p-1.5 text-slate-400 hover:text-red-600" title="Delete story"><i class="fa-solid fa-trash text-xs"></i></button>
                    </td>
                </tr>`;
            }).join('');

            return `<div class="max-w-7xl mx-auto p-4 md:p-6 pb-24">
                <div class="flex flex-wrap gap-3 items-center justify-between mb-4">
                    <h2 class="text-3xl font-bold text-slate-800"><i class="fa-solid fa-bars-staggered mr-3 text-slate-400"></i>Rundown</h2>
                    <div class="flex flex-wrap gap-2 items-center">
                        <div class="text-sm font-medium text-slate-500">Total TRT: <span class="text-slate-800 font-mono text-lg bg-slate-200 px-2 py-1 rounded ml-1">${formatDuration(totalDuration)}</span></div>
                        ${renderTargetControl(totalDuration)}
                        <button data-action="add-story" title="Add story (N)" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium transition-colors shadow-sm"><i class="fa-solid fa-plus mr-2"></i>Add Story</button>
                        <button data-action="add-segment" title="Add a segment divider (B)" class="bg-slate-700 hover:bg-slate-600 text-white px-5 py-2.5 rounded-lg font-medium transition-colors shadow-sm"><i class="fa-solid fa-scissors mr-2"></i>Add Segment</button>
                        ${renderCuezControls()}
                    </div>
                </div>
                ${state.ui.trash.length ? `
                <div class="flex items-center gap-3 bg-amber-50 border border-amber-200 text-amber-800 px-4 py-2.5 rounded-xl mb-4 text-sm flex-wrap">
                    <i class="fa-solid fa-trash-arrow-up text-amber-500"></i>
                    <span class="font-semibold">${state.ui.trash.length} deleted this session</span>
                    <div class="flex items-center gap-2 flex-wrap">
                        ${state.ui.trash.map(t => `<button data-action="rescue-story" data-id="${t.id}" ${t.restoring ? 'disabled' : ''} class="bg-amber-100 hover:bg-amber-200 border border-amber-300 text-amber-800 px-2.5 py-1 rounded-lg text-xs font-bold transition-colors disabled:opacity-50"><i class="fa-solid fa-rotate-left mr-1"></i>${escapeHTML(t.story.slug)}${t.restoring ? ' · Restoring…' : ''}</button>`).join('')}
                    </div>
                    <button data-action="clear-trash" class="ml-auto text-amber-400 hover:text-amber-700 text-xs font-bold px-2 py-1 rounded transition-colors">Clear</button>
                </div>` : ''}
                <div class="hidden lg:block">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wider text-slate-500">
                                    <th class="px-4 py-3 w-10 text-center"><i class="fa-solid fa-arrows-up-down"></i></th>
                                    <th class="px-4 py-3">Slug</th>
                                    <th class="px-4 py-3">Fmt</th>
                                    <th class="px-4 py-3">Staff</th>
                                    <th class="px-4 py-3">Dur</th>
                                    <th class="px-4 py-3">Preview</th>
                                    <th class="px-4 py-3 text-center">Checked</th>
                                    <th class="px-4 py-3 text-center">Float</th>
                                    <th class="px-4 py-3 text-center">Cuez</th>
                                    <th class="px-4 py-3 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows}
                                <tr data-story-id="end-of-list" class="h-16 bg-transparent"><td colspan="10"></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="lg:hidden flex flex-col gap-3">${renderRundownMobileCards(order, live)}</div>
            </div>`;
        }

        function renderRundownMobileCards(order, live) {
            let isBelowLine = false;
            return order.map((id, idx) => {
                if (id === 'marker-line') {
                    isBelowLine = true;
                    return `<div class="bg-red-600 text-white text-xs font-black uppercase tracking-widest px-4 py-2 rounded-xl flex items-center gap-2"><i class="fa-solid fa-arrow-down"></i> End of programme</div>`;
                }
                const story = state.storiesMap[id];
                if (!story) return '';
                if (story.type === 'segment') {
                    return `<div class="bg-indigo-900 text-white text-xs font-black uppercase tracking-widest px-4 py-2 rounded-xl flex items-center justify-between">
                        <span><i class="fa-solid fa-scissors mr-2 opacity-40"></i>${escapeHTML(story.slug)}</span>
                        <span class="flex items-center gap-3">
                            ${story.duration > 0 ? `<span class="font-mono text-indigo-300">${formatDuration(story.duration)}</span>` : ''}
                            <button data-action="edit-story" data-id="${id}" class="text-indigo-300"><i class="fa-solid fa-pen"></i></button>
                        </span>
                    </div>`;
                }
                const locked = isLockedByOther(story);
                let wrapperClass = 'bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm';
                if (isBelowLine) wrapperClass += ' opacity-60';
                if (story.isFloated && !isBelowLine) wrapperClass += ' opacity-50';

                return `<div class="${wrapperClass}" data-story-id="${id}">
                    <div class="flex items-center justify-between px-4 py-3 gap-2">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="font-semibold truncate">${escapeHTML(story.slug)}</span>
                            ${locked ? `<i class="fa-solid fa-lock text-red-500 text-xs" title="Being edited by ${escapeHTML(story.lockedByName)}"></i>` : ''}
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            ${renderCuezBadge(id, story, live.has(id))}
                            <span class="bg-slate-100 border px-2 py-0.5 rounded text-xs font-mono font-bold">${escapeHTML(story.format || '')}</span>
                            <span class="font-mono text-sm text-slate-600">${formatDuration(story.duration)}</span>
                        </div>
                    </div>
                    ${(story.reporter || story.presenter) ? `<div class="text-xs text-slate-500 px-4 pb-2 flex gap-3">
                        ${story.reporter ? `<span class="font-bold text-blue-700">${escapeHTML(story.reporter)}</span>` : ''}
                        ${story.presenter ? `<span>${escapeHTML(story.presenter)}</span>` : ''}
                    </div>` : ''}
                    <div class="flex gap-2 px-4 pb-3 flex-wrap">
                        <button data-action="edit-story" data-id="${id}" ${lockState(story) === 'other' ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors"><i class="fa-solid fa-pen mr-1"></i>Edit</button>
                        <button data-action="toggle-complete" data-id="${id}" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs transition-colors ${checkColour(story.completed)}"><i class="fa-solid fa-circle mr-1"></i>Check</button>
                        <button data-action="toggle-float" data-id="${id}" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs transition-colors ${story.isFloated ? 'text-amber-500' : 'text-slate-600'}"><i class="fa-solid fa-circle-pause mr-1"></i>Float</button>
                        <button data-action="move-story-up" data-id="${id}" class="px-2 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs" ${idx === 0 ? 'disabled' : ''}>▲</button>
                        <button data-action="move-story-down" data-id="${id}" class="px-2 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs" ${idx === order.length - 1 ? 'disabled' : ''}>▼</button>
                    </div>
                </div>`;
            }).join('');
        }

        // ── Modals ─────────────────────────────────────────────────────────
        function renderModals() {
            if (state.ui.isShortcutsModalOpen) return renderShortcutsModal();
            if (state.ui.pendingConflict) return renderConflictModal();
            if (state.ui.editingStoryId) return renderEditModal();
            if (state.ui.join && !state.ui.needsJoin) return renderJoinModal();
            if (state.ui.isSettingsModalOpen) return renderSettingsModal();
            return '';
        }

        function renderShortcutsModal() {
            const rows = [['N', 'Add story'], ['B', 'Add segment'], ['?', 'Show this list']];
            return `<div data-action="close-shortcuts-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[90]">
                <div data-action="noop" class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-sm">
                    <div class="px-5 py-4 border-b border-slate-700 flex justify-between items-center">
                        <h3 class="text-sm font-black text-white uppercase tracking-widest"><i class="fa-solid fa-keyboard mr-2 text-blue-400"></i>Shortcuts</h3>
                        <button data-action="close-shortcuts-modal" class="text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="p-5 space-y-2.5">
                        ${rows.map(([key, label]) => `<div class="flex items-center justify-between gap-4 text-sm">
                            <span class="text-slate-300">${escapeHTML(label)}</span>
                            <kbd class="bg-slate-800 border border-slate-600 text-slate-200 font-mono text-xs px-2 py-1 rounded">${escapeHTML(key)}</kbd>
                        </div>`).join('')}
                        <div class="pt-3 mt-1 border-t border-slate-700 text-xs text-slate-500">Ignored while typing or while a dialog is open.</div>
                    </div>
                </div>
            </div>`;
        }

        function renderLockBanner(story) {
            if (lockState(story) === 'elsewhere') {
                return `<div class="bg-blue-50 border-b border-blue-200 px-6 py-3 flex items-center justify-between gap-3">
                    <span class="text-blue-800 text-sm">You have this story open in another tab, or in a page you reloaded.</span>
                    <button data-action="take-over-edit" id="takeover-btn" class="text-xs bg-blue-600 hover:bg-blue-700 text-white border border-blue-700 px-3 py-1.5 rounded shadow-sm font-bold transition-colors">Edit here</button>
                </div>`;
            }
            const lockAge = story.lockedAt ? Date.now() - story.lockedAt : STALE_LOCK_MS;
            const isStale = lockAge >= STALE_LOCK_MS;
            const waitSecs = isStale ? 0 : Math.ceil((STALE_LOCK_MS - lockAge) / 1000);
            return `<div class="bg-amber-100 border-b border-amber-200 px-6 py-3 flex items-center justify-between gap-3">
                <span class="text-amber-800 text-sm">Being edited by <strong>${escapeHTML(story.lockedByName)}</strong>.</span>
                <button data-action="take-over-edit" id="takeover-btn" ${!isStale ? 'disabled' : ''}
                    class="text-xs ${isStale ? 'bg-amber-600 hover:bg-amber-700 text-white border-amber-700' : 'bg-white text-slate-400 border-slate-300 cursor-not-allowed'} border px-3 py-1.5 rounded shadow-sm font-bold transition-colors">
                    ${isStale ? 'Take over' : `Wait ${waitSecs}s…`}
                </button>
            </div>`;
        }

        function renderEditModal() {
            const story = state.storiesMap[state.ui.editingStoryId];
            if (!story) return '';
            const locked = isLockedByOther(story);
            const dis = locked ? 'disabled' : '';

            if (story.type === 'segment') {
                return `<div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm flex flex-col overflow-hidden">
                        <div class="px-6 py-4 border-b border-indigo-100 flex justify-between items-center bg-indigo-50">
                            <h3 class="text-lg font-bold text-indigo-900"><i class="fa-solid fa-scissors mr-2 text-indigo-400"></i>Edit Segment</h3>
                            <button data-action="cancel-edit" class="text-indigo-300 hover:text-indigo-600 text-2xl"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        ${locked ? renderLockBanner(story) : ''}
                        <div class="p-6 space-y-4">
                            <input type="hidden" id="edit-rev" value="${story.rev}">
                            <div>
                                <label class="text-sm font-semibold block mb-1">Label</label>
                                <input type="text" id="edit-slug" value="${escapeHTML(story.slug)}" class="w-full border rounded-lg px-4 py-2.5 outline-none focus:border-blue-500 font-bold uppercase tracking-widest" ${dis} placeholder="e.g. SPORT, WEATHER">
                            </div>
                            <div>
                                <label class="text-sm font-semibold block mb-1">Duration <span class="font-normal text-slate-400">(optional, counts toward TRT)</span></label>
                                <input type="text" id="edit-duration" value="${story.duration > 0 ? formatDuration(story.duration) : ''}" class="w-full border rounded-lg px-4 py-2 font-mono outline-none focus:border-blue-500" ${dis} placeholder="e.g. 3:00">
                            </div>
                            <p class="text-xs text-slate-400">Segments organise the desk's running order. They aren't sent to Cuez.</p>
                        </div>
                        <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3">
                            <button data-action="cancel-edit" class="px-5 py-2.5 rounded-lg text-slate-600 hover:bg-slate-200 transition-colors">${locked ? 'Close' : 'Cancel'}</button>
                            <span id="edit-save-error" class="text-sm text-red-600 self-center" style="display:none"></span>
                            ${!locked ? `<button data-action="save-edit" data-label="Save" class="btn-primary">Save</button>` : ''}
                        </div>
                    </div>
                </div>`;
            }

            const formats = state.meta.formats || DEFAULT_FORMATS;
            const formatOptions = [...new Set([...formats, story.format].filter(Boolean))]
                .map(f => `<option value="${escapeHTML(f)}" ${story.format === f ? 'selected' : ''}>${escapeHTML(f)}</option>`).join('');
            const names = [...new Set(Object.values(state.storiesMap).flatMap(s => [s.reporter, s.presenter]).filter(Boolean))];
            const status = cuezStatus(story);
            const sentAt = story.cuezSentAt ? new Date(story.cuezSentAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';

            return `<div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
                <datalist id="staff-names">${names.map(n => `<option value="${escapeHTML(n)}">`).join('')}</datalist>
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl flex flex-col max-h-full overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                        <h3 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-pen-to-square mr-2 text-blue-500"></i>Edit Story</h3>
                        <button data-action="cancel-edit" class="text-slate-400 hover:text-slate-600 text-2xl"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    ${locked ? renderLockBanner(story) : ''}
                    ${status !== 'none' ? `<div class="bg-emerald-50 border-b border-emerald-200 px-6 py-2.5 text-sm text-emerald-800">
                        <i class="fa-solid fa-tower-broadcast mr-2"></i>Sent to Cuez at ${sentAt}${story.cuezItemNumber ? ` as item ${escapeHTML(story.cuezItemNumber)}` : ''}. Changes here won't update Cuez${status === 'changed' ? ', and this story has changed since it was sent' : ''}.
                    </div>` : ''}
                    ${story.brief || story.pitchedBy ? `<div class="bg-violet-50 border-b border-violet-200 px-6 py-2.5 text-sm text-violet-900">
                        <i class="fa-solid fa-lightbulb mr-2 text-violet-400"></i><b>Pitch:</b> ${escapeHTML(story.brief || '(no angle given)')}${story.pitchedBy ? ` <span class="text-violet-500">· pitched by ${escapeHTML(story.pitchedBy)}</span>` : ''}
                    </div>` : ''}
                    <div class="p-6 overflow-y-auto flex-1 min-h-0 space-y-5">
                        <input type="hidden" id="edit-rev" value="${story.rev}">
                        <div class="grid grid-cols-1 gap-4 sm:grid-cols-4">
                            <div class="sm:col-span-3"><label class="text-sm font-semibold block mb-1">Slug</label><input type="text" id="edit-slug" value="${escapeHTML(story.slug)}" spellcheck="true" lang="en-GB" oninput="window._moiraUpdateScriptStats()" class="w-full border rounded-lg px-4 py-2.5 outline-none focus:border-blue-500" ${dis}></div>
                            <div><label class="text-sm font-semibold block mb-1">Format</label><select id="edit-format" class="w-full border rounded-lg px-4 py-2.5 outline-none focus:border-blue-500" ${dis} onchange="window._moiraUpdateScriptStats()">${formatOptions}</select></div>
                        </div>
                        <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
                            <div><label class="text-sm font-semibold block mb-1">Reporter</label><input type="text" id="edit-reporter" list="staff-names" maxlength="60" spellcheck="false" value="${escapeHTML(story.reporter)}" class="w-full border rounded-lg px-4 py-2 outline-none focus:border-blue-500" ${dis}></div>
                            <div><label class="text-sm font-semibold block mb-1">Presenter</label><input type="text" id="edit-presenter" list="staff-names" maxlength="60" spellcheck="false" value="${escapeHTML(story.presenter)}" class="w-full border rounded-lg px-4 py-2 outline-none focus:border-blue-500" ${dis}></div>
                            <div><label class="text-sm font-semibold block mb-1">Duration <span class="font-normal text-slate-400 text-xs ml-1">(total)</span></label>
                                <input type="text" id="edit-duration" value="${formatDuration(story.duration)}" class="w-full border rounded-lg px-4 py-2 font-mono outline-none focus:border-blue-500" ${dis} placeholder="e.g. 02:15"></div>
                        </div>
                        <div class="flex flex-col min-h-[14rem] md:h-72">
                            <label class="text-sm font-semibold block mb-1">Script
                                ${locked ? '' : `<span class="float-right flex gap-1.5" title="Insert at the cursor">
                                    <button type="button" data-action="insert-tag" data-val="clip" class="script-tool script-tool-clip">+ Clip</button>
                                    <button type="button" data-action="insert-tag" data-val="strap" class="script-tool script-tool-strap">+ Strap</button>
                                    <button type="button" data-action="insert-tag" data-val="direction" class="script-tool script-tool-instructions">+ Direction</button>
                                </span>`}
                            </label>
                            <textarea id="edit-script" spellcheck="true" lang="en-GB" class="w-full flex-1 border rounded-lg p-4 outline-none focus:border-blue-500 resize-none text-lg" ${dis}
                                oninput="window._moiraUpdateScriptStats()">${escapeHTML(story.script)}</textarea>
                            <div class="flex items-center justify-between mt-1.5 gap-3 flex-wrap">
                                <div class="flex flex-col">
                                    <span id="edit-script-stats" class="text-xs font-mono text-slate-400">${escapeHTML(scriptStatsLabel(story.script, story.format))}</span>
                                    <div id="edit-cuez-preview" class="cuez-chips">${cuezChipsHtml(story.script, story.format, story.slug)}</div>
                                </div>
                                <button type="button" data-action="use-estimate" ${dis} class="text-xs font-bold text-blue-600 hover:text-blue-800 disabled:text-slate-300 px-2 py-0.5 rounded hover:bg-blue-50 transition-colors" title="Copy the estimate into Duration (saves when you click Save)">Use estimate</button>
                            </div>
                        </div>
                    </div>
                    <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-between items-center gap-3">
                        <div>${state.ui.storySnapshots[state.ui.editingStoryId] && !locked ? `<button data-action="revert-story" data-id="${state.ui.editingStoryId}" class="flex items-center gap-2 px-4 py-2.5 rounded-lg text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 font-medium transition-colors text-sm"><i class="fa-solid fa-clock-rotate-left"></i>Revert to previous version</button>` : ''}</div>
                        <div class="flex gap-3 items-center flex-wrap justify-end">
                            <span id="edit-save-error" class="text-sm text-red-600 max-w-xs" style="display:none"></span>
                            <button data-action="cancel-edit" class="px-5 py-2.5 rounded-lg text-slate-600 hover:bg-slate-200 transition-colors">${locked ? 'Close' : 'Cancel'}</button>
                            ${!locked ? `<button data-action="save-edit" data-label="Save changes" class="btn-primary">Save changes</button>` : ''}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderSettingsModal() {
            const currentFormats = (state.meta.formats || DEFAULT_FORMATS).join('\n');
            const tabBtn = (id, label, icon) => `
                <button data-action="set-settings-tab" data-val="${id}" class="flex-1 py-3 text-sm font-bold border-b-2 transition-colors flex items-center justify-center gap-2 ${state.ui.settingsTab === id ? 'border-blue-600 text-blue-600 bg-blue-50/50' : 'border-slate-200 text-slate-400 hover:text-slate-600'}">
                    <i class="fa-solid ${icon}"></i><span class="hidden md:inline">${label}</span>
                </button>`;
            const tab = state.ui.settingsTab;

            let body;
            if (tab === 'editorial') {
                body = `<div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
                    <h4 class="font-bold text-slate-800 mb-1">Story formats for ${escapeHTML(state.roomDisplayName)}</h4>
                    <p class="text-xs text-slate-500 mb-3">One per line. Stories in ${[...CLIP_FORMATS].join(', ')} get an empty clip block in Cuez when their script has no [CLIP] tag.</p>
                    <textarea id="settings-formats-input" rows="8" class="w-full border rounded-lg p-4 text-sm font-mono outline-none">${escapeHTML(currentFormats)}</textarea>
                </div>`;
            } else if (tab === 'reset') {
                body = `<div class="bg-red-50 border border-red-200 rounded-xl p-6">
                    <h4 class="font-bold text-red-800 text-lg mb-3"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Clear this browser</h4>
                    <p class="text-sm text-red-700 mb-6">Deletes the Local Mode newsroom saved in this browser, and your name. It can't be undone.</p>
                    <button data-action="factory-reset" class="w-full px-4 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold transition-colors">Clear this browser</button>
                </div>`;
            } else {
                body = `<div class="p-4 space-y-4 text-center">
                    <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto"><i class="fa-solid fa-newspaper text-3xl"></i></div>
                    <h4 class="text-2xl font-bold text-slate-800">Moira:Desk</h4>
                    <p class="text-sm text-slate-500">The editorial desk: write, check and order the bulletin here, then send it to Cuez, which handles production and playout.</p>
                    <p class="text-sm text-slate-500">A trimmed sibling of <a href="https://github.com/digitaldickinson/moira-rundown" target="_blank" rel="noopener" class="text-blue-600 hover:underline font-bold">Moira:Rundown</a> by Andy Dickinson. Moira is named after <a href="https://en.wikipedia.org/wiki/Moira_Stuart" target="_blank" rel="noopener" class="text-blue-600 hover:underline font-bold">Moira Stuart</a>.</p>
                </div>`;
            }

            return `<div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-[70]">
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col max-h-[85vh]">
                    <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                        <h3 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-gear mr-2 text-slate-500"></i>Settings</h3>
                        <button data-action="close-settings-modal" class="text-slate-400 hover:text-slate-600 text-2xl"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="flex">
                        ${tabBtn('editorial', 'Formats', 'fa-pen-nib')}
                        ${tabBtn('about', 'About', 'fa-info-circle')}
                        ${state.localMode ? tabBtn('reset', 'Clear', 'fa-right-from-bracket') : ''}
                    </div>
                    <div class="p-6 overflow-y-auto flex-1 min-h-0">${body}</div>
                    <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 rounded-b-2xl flex justify-end items-center gap-3">
                        <button data-action="close-settings-modal" class="px-5 py-2.5 rounded-lg text-slate-600 hover:bg-slate-200">Close</button>
                        ${tab === 'editorial' ? `<button data-action="save-editorial-settings" class="btn-primary">Apply to newsroom</button>` : ''}
                    </div>
                </div>
            </div>`;
        }

        function renderConflictModal() {
            const { serverData, localData } = state.ui.pendingConflict;
            const diffs = [];
            const row = (label, a, b) => `<tr><td class="pr-4 text-slate-500 py-1 text-xs">${label}</td><td class="text-xs text-red-700 font-mono">${escapeHTML(a)}</td><td class="text-xs text-blue-700 font-mono">${escapeHTML(b)}</td></tr>`;
            if (serverData.slug !== localData.slug) diffs.push(row('Slug', serverData.slug, localData.slug));
            if (serverData.format !== localData.format) diffs.push(row('Format', serverData.format, localData.format));
            if ((serverData.duration || 0) !== (localData.duration || 0)) diffs.push(row('Duration', formatDuration(serverData.duration), formatDuration(localData.duration)));
            if ((serverData.script || '').trim() !== (localData.script || '').trim()) diffs.push(row('Script', 'Changed', 'Changed'));
            const diffTable = diffs.length
                ? `<table class="w-full mt-2 mb-1"><thead><tr><th class="text-left text-[10px] uppercase tracking-wide text-slate-400 pr-4">Field</th><th class="text-left text-[10px] uppercase tracking-wide text-red-500">Saved (rev ${serverData.rev || '?'})</th><th class="text-left text-[10px] uppercase tracking-wide text-blue-500">Your edit</th></tr></thead><tbody>${diffs.join('')}</tbody></table>`
                : `<p class="text-xs text-slate-500 mt-1 mb-1">Check both versions before deciding.</p>`;

            return `<div class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 z-[80]">
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6">
                    <h3 class="text-lg font-bold text-slate-800">⚠️ Edit conflict: ${escapeHTML(serverData.slug)}</h3>
                    <p class="text-sm text-slate-500 mt-0.5 mb-4">Someone else saved this story while you were editing it.</p>
                    <div class="bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 mb-5">${diffTable}</div>
                    <div class="flex gap-3">
                        <button data-action="resolve-conflict" data-val="overwrite" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-3 rounded-lg font-bold text-sm transition-colors"><i class="fa-solid fa-upload mr-1"></i> Use my version</button>
                        <button data-action="resolve-conflict" data-val="discard" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-3 rounded-lg font-bold text-sm transition-colors"><i class="fa-solid fa-download mr-1"></i> Keep saved version</button>
                    </div>
                </div>
            </div>`;
        }

        // ==========================================
        // 11. EVENTS
        // ==========================================
        function bindGlobalEvents() {
            document.addEventListener('keydown', async e => {
                if (state.signingOut) return;
                if (e.target && ['join-code', 'join-name'].includes(e.target.id) && e.key === 'Enter') {
                    e.preventDefault();
                    const code = document.getElementById('join-code')?.value || '';
                    const name = document.getElementById('join-name')?.value.trim() || '';
                    e.target.blur();
                    joinWithCode(code, name);
                    return;
                }

                if (e.key === 'Enter' && e.target?.dataset?.pitchEnter) {
                    e.preventDefault();
                    if (e.target.dataset.pitchEnter === 'add') addPitch();
                    else savePitchEdit(e.target.dataset.id);
                    return;
                }
                if (e.key === 'Escape' && e.target?.dataset?.pitchEnter === 'save') {
                    state.ui.editingPitchId = null; render('main'); return;
                }

                if (state.ui.isShortcutsModalOpen) {
                    if (e.key === 'Escape') { e.preventDefault(); state.ui.isShortcutsModalOpen = false; render('modal'); }
                    return;
                }
                if (e.ctrlKey || e.metaKey || e.altKey) return;

                const typingTarget = document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
                const anyModalOpen = !!(state.ui.editingStoryId || state.ui.isSettingsModalOpen || state.ui.pendingConflict || state.ui.join || state.ui.needsJoin || !state.currentBulletinId);
                if (typingTarget || anyModalOpen) return;

                if (e.key === '?') { e.preventDefault(); state.ui.isShortcutsModalOpen = true; render('modal'); return; }
                const lower = e.key.toLowerCase();
                if (state.ui.view !== 'rundown') return; // N and B add to the running order, so only there
                if (lower === 'n') { e.preventDefault(); addStory(); }
                else if (lower === 'b') { e.preventDefault(); addSegment(); }
            });

            const handleSettings = async ({ action, val }) => {
                if (action === 'open-settings-modal')  { state.ui.isSettingsModalOpen = true; state.ui.settingsTab = 'editorial'; render('modal'); return true; }
                if (action === 'close-settings-modal') { state.ui.isSettingsModalOpen = false; render('modal'); return true; }
                if (action === 'set-settings-tab')     { state.ui.settingsTab = val; render('modal'); return true; }
                if (action === 'sign-out') { signOutBrowser(); return true; }
                if (action === 'factory-reset') {
                    if (!await confirmAction('Clear this browser? The Local Mode newsroom saved here will be deleted.', { title: 'Clear this browser', confirmLabel: 'Clear browser', danger: true })) return true;
                    if (state.ui.editingStoryId) { stopLockRefresh(); await unlockStory(state.ui.editingStoryId); }
                    try { if (supabase) await supabase.auth.signOut(); } catch {}
                    try {
                        Object.keys(localStorage).filter(k => k.startsWith('moiradesk_')).forEach(k => localStorage.removeItem(k));
                    } catch {}
                    location.reload();
                    return true;
                }
                if (action === 'save-editorial-settings') {
                    const formats = document.getElementById('settings-formats-input').value.split('\n').map(f => f.trim()).filter(Boolean);
                    if (formats.length) updateFormats(formats);
                    return true;
                }
                if (action === 'set-my-name') {
                    const name = (await askName(state.myName) || '').trim().slice(0, 40);
                    if (name) { state.myName = name; lsSet(LS.name, name); render('header'); }
                    return true;
                }
                return false;
            };

            const handleRundown = async ({ action, id }) => {
                if (action === 'add-story')       { addStory(); return true; }
                if (action === 'add-segment')     { addSegment(); return true; }
                if (action === 'toggle-float')    { toggleFloat(id); return true; }
                if (action === 'delete-story')    { deleteStory(id); return true; }
                if (action === 'rescue-story')    { rescueStory(id); return true; }
                if (action === 'revert-story')    { revertStory(id); return true; }
                if (action === 'clear-trash')     { state.ui.trash = []; render('main'); return true; }
                if (action === 'toggle-complete') { toggleStoryComplete(id); return true; }
                if (action === 'open-join')       { state.ui.join = { error: null, busy: false }; render('modal'); setTimeout(() => document.getElementById('join-name')?.focus() || document.getElementById('join-code')?.focus(), 50); return true; }
                if (action === 'close-join')      { state.ui.join = null; render('modal'); return true; }
                if (action === 'join-submit') {
                    const code = document.getElementById('join-code')?.value || '';
                    const name = document.getElementById('join-name')?.value.trim() || '';
                    document.activeElement?.blur?.();
                    joinWithCode(code, name);
                    return true;
                }
                if (action === 'move-story-up') {
                    const idx = state.meta.order.indexOf(id);
                    if (idx > 0) await reorderStory(id, state.meta.order[idx - 1]);
                    return true;
                }
                if (action === 'move-story-down') {
                    const idx = state.meta.order.indexOf(id);
                    if (idx > -1 && idx < state.meta.order.length - 1) await reorderStory(id, state.meta.order[idx + 2]);
                    return true;
                }
                return false;
            };

            const handleConference = async ({ action, val, id }) => {
                if (action === 'show-view')         { showView(val); return true; }
                if (action === 'claim-producer')    { claimProducer(); return true; }
                if (action === 'release-producer')  { releaseProducer(); return true; }
                if (action === 'add-pitch')         { addPitch(); return true; }
                if (action === 'edit-pitch')        { state.ui.editingPitchId = id; render('main'); setTimeout(() => document.getElementById(`pitch-edit-slug-${id}`)?.focus(), 30); return true; }
                if (action === 'cancel-pitch-edit') { state.ui.editingPitchId = null; render('main'); return true; }
                if (action === 'save-pitch-edit')   { savePitchEdit(id); return true; }
                if (action === 'delete-pitch')      { deletePitch(id); return true; }
                if (action === 'pick-pitch')        { conferenceAction('pick_pitch', { p_pitch_id: id }); return true; }
                if (action === 'unpick-pitch')      { unpickPitch(id); return true; }
                if (action === 'spike-pitch')       { spikePitch(id); return true; }
                if (action === 'unspike-pitch')     { conferenceAction('unspike_pitch', { p_pitch_id: id }); return true; }
                if (action === 'open-picked')       { state.ui.pendingScrollToStoryId = id; showView('rundown'); return true; }
                return false;
            };

            const handleCuez = async ({ action, val, id }) => {
                if (action === 'send-to-cuez') { sendToCuez(); return true; }
                if (action === 'cuez-unlink')  { unlinkFromCuez(id); return true; }
                return false;
            };

            const handleEdit = async ({ action, id, val }) => {
                if (action === 'edit-story') {
                    if (!canMutate()) return true;
                    if (!await ensureMyName()) return true;
                    state.ui.editingStoryId = id;
                    lockStory(id);
                    startLockRefresh(id);
                    render('modal');
                    return true;
                }
                if (action === 'cancel-edit') {
                    const editingId = state.ui.editingStoryId;
                    state.ui.editingStoryId = null;
                    stopLockRefresh();
                    if (editingId) unlockStory(editingId);
                    render('main', 'modal');
                    return true;
                }
                if (action === 'take-over-edit') {
                    const storyId = state.ui.editingStoryId;
                    if (!storyId) return true;
                    const userName = getMyName();
                    const now = Date.now();
                    const s = state.storiesMap[storyId];
                    if (s) { s.lockedBySession = state.sessionId; s.lockedByName = userName; s.lockedAt = now; }
                    startLockRefresh(storyId);
                    render('modal');
                    try { await DB.takeLock(storyId, state.sessionId, userName); }
                    catch (e) { showError('Could not take over: ' + DB.errorMessage(e)); }
                    return true;
                }
                if (action === 'save-edit') {
                    const editingId = state.ui.editingStoryId;
                    const editing = state.storiesMap[editingId];
                    if (!editing) return true;
                    const rev = parseInt(document.getElementById('edit-rev').value, 10);
                    const duration = parseDurationInput(document.getElementById('edit-duration').value);
                    if (editing.type === 'segment') {
                        saveStory(editingId, { slug: document.getElementById('edit-slug').value.toUpperCase(), duration, rev });
                    } else {
                        saveStory(editingId, {
                            slug:      document.getElementById('edit-slug').value,
                            format:    document.getElementById('edit-format').value,
                            reporter:  document.getElementById('edit-reporter').value.trim(),
                            presenter: document.getElementById('edit-presenter').value.trim(),
                            duration,
                            script:    document.getElementById('edit-script').value,
                            rev,
                        });
                    }
                    return true;
                }
                if (action === 'insert-tag') { insertScriptTag(val); return true; }
                if (action === 'use-estimate') {
                    const ta = document.getElementById('edit-script');
                    const fmt = document.getElementById('edit-format');
                    const durEl = document.getElementById('edit-duration');
                    if (ta && durEl) durEl.value = formatDuration(scriptTiming(ta.value, fmt?.value).estSeconds);
                    return true;
                }
                if (action === 'resolve-conflict') {
                    const { storyId, serverData, localData } = state.ui.pendingConflict;
                    state.ui.pendingConflict = null;
                    if (val === 'overwrite') {
                        const conflict = { storyId, serverData, localData };
                        const r = await saveStory(storyId, { ...localData, rev: serverData.rev });
                        if (r === 'error') { state.ui.pendingConflict = conflict; render('modal'); showError('Not saved. Your version is still here: choose again to retry.'); }
                    } else {
                        // The rejected save was applied optimistically; put the saved version back.
                        state.storiesMap[storyId] = { ...serverData };
                        state.ui.editingStoryId = null;
                        stopLockRefresh();
                        unlockStory(storyId);
                        render('main', 'modal');
                    }
                    return true;
                }
                if (action === 'inline-edit-slug') {
                    const story = state.storiesMap[id];
                    if (!canMutate() || !story || isLockedByOther(story)) return true;
                    if (!await ensureMyName()) return true;
                    state.ui.inlineEditingId = id;
                    await lockStory(id);
                    const liveSpan = document.querySelector(`[data-action="inline-edit-slug"][data-id="${id}"]`);
                    if (!liveSpan) { state.ui.inlineEditingId = null; render('main'); return true; }
                    const originalSlug = story.slug ?? '';
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.value = originalSlug;
                    input.className = 'w-full border-2 border-blue-500 rounded px-1 text-slate-800 font-semibold outline-none bg-white shadow-sm ring-2 ring-blue-100';
                    input.spellcheck = true;
                    input.lang = 'en-GB';
                    let committed = false, escapedOut = false;
                    const finish = async (save) => {
                        if (committed) return;
                        committed = true;
                        state.ui.inlineEditingId = null;
                        const newSlug = input.value.trim();
                        if (save && !escapedOut && newSlug && newSlug !== originalSlug) {
                            const s = state.storiesMap[id];
                            const prevRev = s?.rev;
                            if (s) { s.slug = newSlug; s.rev = (s.rev || 0) + 1; s.lockedBySession = null; s.lockedByName = null; s.lockedAt = null; }
                            render('main');
                            try { await DB.saveSlug(id, newSlug, state.sessionId); }
                            catch (e) {
                                // Put the old slug back: the row must show what's actually saved.
                                if (s) { s.slug = originalSlug; s.rev = prevRev; s.lockedBySession = state.sessionId; }
                                showError(`Slug not saved: ${DB.errorMessage(e)}. "${newSlug}" was not kept.`);
                                await unlockStory(id); render('main');
                            }
                        } else {
                            await unlockStory(id);
                            render('main');
                        }
                    };
                    input.addEventListener('keydown', ev => {
                        if (ev.key === 'Enter') { ev.preventDefault(); ev.stopPropagation(); input.blur(); }
                        else if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); escapedOut = true; input.blur(); finish(false); }
                    });
                    input.addEventListener('blur', () => { if (!escapedOut) finish(true); });
                    liveSpan.replaceWith(input);
                    input.focus();
                    input.select();
                    return true;
                }
                if (action === 'edit-target') {
                    if (!canMutate()) return true;
                    const container = document.getElementById('target-control');
                    if (!container) return true;
                    const current = state.meta.targetDuration;
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.value = current != null ? formatDuration(current) : '';
                    input.placeholder = 'M:SS or secs';
                    input.className = 'w-24 border-2 border-blue-500 rounded px-2 py-1 text-xs font-mono outline-none bg-white shadow-sm ring-2 ring-blue-100';
                    const saveBtn = document.createElement('button');
                    saveBtn.type = 'button'; saveBtn.textContent = 'Save';
                    saveBtn.className = 'text-[11px] font-bold text-blue-600 hover:text-blue-800 px-1.5';
                    const clearBtn = document.createElement('button');
                    clearBtn.type = 'button'; clearBtn.textContent = 'Clear';
                    clearBtn.className = 'text-[11px] font-bold text-slate-400 hover:text-slate-600 px-1.5';
                    let committed = false;
                    const shake = () => { input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); };
                    const attemptSave = () => {
                        if (committed) return true;
                        const parsed = parseTargetDurationInput(input.value);
                        if (parsed === undefined) { shake(); return false; }
                        committed = true;
                        updateTargetDuration(input.value.trim() ? parsed : null);
                        return true;
                    };
                    const attemptClear = () => { if (committed) return true; committed = true; updateTargetDuration(null); return true; };
                    const cancel = () => { if (committed) return; committed = true; render('main'); };
                    input.addEventListener('keydown', ev => {
                        if (ev.key === 'Enter') { ev.preventDefault(); if (attemptSave()) input.blur(); }
                        else if (ev.key === 'Escape') { ev.preventDefault(); cancel(); input.blur(); }
                    });
                    input.addEventListener('blur', () => cancel());
                    // Validate on mousedown, before focus moves and blur cancels.
                    saveBtn.addEventListener('mousedown', ev => { if (!attemptSave()) ev.preventDefault(); });
                    clearBtn.addEventListener('mousedown', () => attemptClear());
                    container.innerHTML = '';
                    container.append(input, saveBtn, clearBtn);
                    input.focus();
                    input.select();
                    return true;
                }
                return false;
            };

            document.body.addEventListener('click', async e => {
                if (state.signingOut) return;
                const btn = e.target.closest('[data-action]');
                if (!btn || btn.disabled) return;
                const ctx = { action: btn.getAttribute('data-action'), id: btn.getAttribute('data-id'), val: btn.getAttribute('data-val') };
                if (ctx.action === 'noop') return;
                if (!['inline-edit-slug', 'edit-target'].includes(ctx.action)) {
                    // Safari doesn't move focus to a clicked button, and render()
                    // skips redrawing while an input has focus. Keep what was typed
                    // in the Cuez episode box, then release focus.
                    const ae = document.activeElement;
                    if (ae && ae !== btn && ['INPUT', 'TEXTAREA'].includes(ae.tagName) && !ae.hasAttribute('data-preserve') && ctx.action !== 'use-estimate' && ctx.action !== 'join-submit' && ctx.action !== 'insert-tag') ae.blur();
                }
                if (ctx.action === 'close-shortcuts-modal') { state.ui.isShortcutsModalOpen = false; render('modal'); return; }
                if (await handleSettings(ctx)) return;
                if (await handleConference(ctx)) return;
                if (await handleCuez(ctx)) return;
                if (await handleRundown(ctx)) return;
                await handleEdit(ctx);
            });

            document.body.addEventListener('change', e => {
                if (e.target.id === 'room-select' && e.target.value !== state.currentBulletinId) openRoom(e.target.value);
                if (e.target.classList?.contains('picked-format')) setPickedFormat(e.target.dataset.id, e.target.value);
                if (e.target.classList?.contains('picked-reporter')) setPickedReporter(e.target.dataset.id, e.target.value);
            });
            document.body.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.isComposing && e.target.classList?.contains('picked-reporter')) {
                    e.preventDefault();
                    e.target.blur();
                }
            });

            // Drag and drop (polyfilled for touch screens).
            if (typeof MobileDragDrop !== 'undefined') MobileDragDrop.polyfill({ holdToDrag: 400 });

            document.body.addEventListener('dragstart', e => {
                const row = e.target.closest('[data-story-id]');
                if (!row) return;
                const dragId = row.getAttribute('data-story-id');
                if (isLockedByOther(state.storiesMap[dragId])) { e.preventDefault(); return; }
                state.ui.draggedStoryId = dragId;
                e.dataTransfer.effectAllowed = 'move';
                setTimeout(() => row.classList.add('opacity-30'), 0);
            });
            document.body.addEventListener('dragend', e => {
                const row = e.target.closest('[data-story-id]');
                if (row) row.classList.remove('opacity-30');
                state.ui.draggedStoryId = null;
                render('main');
            });
            document.body.addEventListener('dragover', e => {
                if (!state.ui.draggedStoryId) return;
                e.preventDefault();
                document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                const row = e.target.closest('[data-story-id]');
                if (row && row.getAttribute('data-story-id') !== state.ui.draggedStoryId) row.classList.add('drag-over');
            });
            document.body.addEventListener('dragleave', e => { const row = e.target.closest('[data-story-id]'); if (row) row.classList.remove('drag-over'); });
            document.body.addEventListener('drop', e => {
                if (!state.ui.draggedStoryId) return;
                e.preventDefault();
                const dropTarget = e.target.closest('[data-story-id]');
                if (!dropTarget) return;
                dropTarget.classList.remove('drag-over');
                const targetId = dropTarget.getAttribute('data-story-id');
                const draggedId = state.ui.draggedStoryId;
                state.ui.draggedStoryId = null;
                if (draggedId !== targetId) reorderStory(draggedId, targetId === 'end-of-list' ? null : targetId);
            });
        }

        window.addEventListener('beforeunload', () => {
            if (unsubAll) { unsubAll(); unsubAll = null; }
            stopLockRefresh();
            if (state.ui.editingStoryId) unlockStory(state.ui.editingStoryId);
        });

        boot();
    </script>
</body>
</html>
