            if (!story.lockedAt || Date.now() - story.lockedAt > STALE_LOCK_MS) return 'free';
            return story.lockedBySession.split('/')[0] === BROWSER_ID ? 'elsewhere' : 'other';
        }
        function isLockedByOther(story) { return lockState(story) !== 'free'; }

        function insertStoryIntoOrder(id) {
            const markerIdx = state.meta.order.indexOf('marker-line');
            if (markerIdx > -1) state.meta.order.splice(markerIdx, 0, id);
            else state.meta.order.push(id, 'marker-line');
        }

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return str.toString().replace(/[&<>"']/g, c => map[c]);
        }

        function formatDuration(seconds) {
            const s = Math.max(0, Math.round(seconds || 0));
            return `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`;
        }

        function parseDurationInput(raw) {
            const s = (raw || '').trim();
            if (s.includes(':')) {
                const [m, sec] = s.split(':');
                return (parseInt(m, 10) || 0) * 60 + (parseInt(sec, 10) || 0);
            }
            return parseInt(s, 10) || 0;
        }

        // Words per minute for the read estimate: whatever Cuez times this
        // newsroom's prompter at (stored when the target is set or on a send),
        // otherwise Cuez's default, so the desk's TRT matches production's.
        function readWpm() {
            const w = Number(state.meta.cuezReadSpeed);
            return w >= 60 && w <= 400 ? w : DEFAULT_WPM;
        }

        // What a [bracketed] tag means (mirror of parseTag in the function).
        // Placeholders from the insert buttons, ignored if left untouched.
        const PLACEHOLDERS = new Set(['clip title', 'last words', 'name', 'job title', 'direction']);
        const realValue = (v) => (PLACEHOLDERS.has(v.trim().toLowerCase()) ? '' : v.trim());

        function parseTag(inner) {
            const t = inner.trim();
            let m = t.match(/^CLIP\b(?::(\d+):(\d{2}))?\s*([\s\S]*)$/i);
            if (m) {
                let title = '', sound = null, lastWords = null;
                for (const part of m[3].split('|').map(x => x.trim()).filter(Boolean)) {
                    if (/^(SOT|OFF)$/i.test(part)) sound = part.toUpperCase();
                    else if (/^LW\b/i.test(part)) lastWords = realValue(part.replace(/^LW\b\s*:?\s*/i, '')) || null;
                    else if (!title) title = realValue(part);
                }
                const seconds = m[1] !== undefined ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : 0;
                return { kind: 'clip', title, duration: m[1] !== undefined ? `${parseInt(m[1], 10)}:${m[2]}` : '', seconds, sound, lastWords };
            }
            m = t.match(/^STRAP\b\s*:?\s*([\s\S]*)$/i);
            if (m) {
                const [name = '', ...rest] = m[1].split('|').map(x => realValue(x));
                return { kind: 'strap', name, role: rest.filter(Boolean).join(' | ') };
            }
            return { kind: 'instructions', text: realValue(t) };
        }

        // Script analysis: words read aloud ([bracketed] tags stripped), read time,
        // and clip time from [CLIP...] tags. The estimate is read time plus clips.
        function scriptTiming(script, format = '') {
            const text = script || '';
            const words = text.replace(/\[[^\]]*\]/g, '').split(/\s+/).filter(Boolean).length;
            const readSeconds = Math.round(words * 60 / readWpm());
            let clips = 0, clipSeconds = 0;
            for (const m of text.matchAll(TAG_RE)) {
                const tag = parseTag(m[1]);
                if (tag.kind === 'clip') { clips++; clipSeconds += tag.seconds; }
            }
            const formatClip = !clips && CLIP_FORMATS.has((format || '').trim().toUpperCase());
            return { words, readSeconds, clips, clipSeconds, formatClip, estSeconds: readSeconds + clipSeconds };
        }

        function scriptStatsLabel(script, format) {
            const t = scriptTiming(script, format);
            let label = `${t.words} words · ${formatDuration(t.readSeconds)} read at ${readWpm()} wpm`;
            if (t.clips) label += ` + ${formatDuration(t.clipSeconds)} in ${t.clips} clip${t.clips === 1 ? '' : 's'}`;
            return label + ` · est. ${formatDuration(t.estSeconds)}`;
        }

        // The blocks this script becomes in Cuez, in order (mirror of storyBlocks
        // in the function, assuming the template has every block type).
        function cuezBlocksPreview(script, format, slug) {
            const text = script || '';
            const fmt = (format || '').trim().toUpperCase();
            const blocks = [];
            let buf = '', last = 0;
            const flush = () => { if (buf.split('\n').some(l => l.trim())) blocks.push({ kind: 'prompter' }); buf = ''; };
            for (const m of text.matchAll(TAG_RE)) {
                buf += text.slice(last, m.index);
                last = m.index + m[0].length;
                const tag = parseTag(m[1]);
                if ((tag.kind === 'strap' && !tag.name) || (tag.kind === 'instructions' && !tag.text)) continue; // empty placeholder: dropped
                flush();
                if (tag.kind === 'instructions' && blocks[blocks.length - 1]?.kind === 'instructions') blocks[blocks.length - 1].lines.push(tag.text);
                else if (tag.kind === 'instructions') blocks.push({ kind: 'instructions', lines: [tag.text] });
                else blocks.push(tag);
            }
            buf += text.slice(last);
            flush();
            let clips = blocks.filter(b => b.kind === 'clip');
            if (!clips.length && CLIP_FORMATS.has(fmt)) {
                blocks.push({ kind: 'clip', title: '', duration: '', sound: null, lastWords: null });
                clips = blocks.filter(b => b.kind === 'clip');
            }
            const base = (slug || '').trim() || 'UNTITLED';
            clips.forEach((c, i) => {
                if (!c.title) c.title = clips.length > 1 ? `${base} CLIP ${i + 1}` : `${base} CLIP`;
                if (!c.sound) c.sound = OFF_FORMATS.has(fmt) ? 'OFF' : 'SOT';
            });
            if (!blocks.length) blocks.push({ kind: 'prompter' });
            return blocks;
        }

        // Coloured chips in Cuez's block colours: what production will receive.
        function cuezChipsHtml(script, format, slug) {
            const chip = (b) => {
                if (b.kind === 'clip') {
                    const tip = `Empty clip block, sound ${b.sound}${b.lastWords ? `, last words "${b.lastWords}"` : ''}. Production adds the video.`;
                    return `<span class="cuez-chip cuez-chip-clip" title="${escapeHTML(tip)}"><b>CLIP</b> ${escapeHTML(b.title)}${b.duration ? ` · ${escapeHTML(b.duration)}` : ''} · ${escapeHTML(b.sound)}${b.lastWords ? ' · LW' : ''}</span>`;
                }
                if (b.kind === 'strap') return `<span class="cuez-chip cuez-chip-strap" title="Lower third"><b>STRAP</b> ${escapeHTML(b.name)}${b.role ? ` · ${escapeHTML(b.role)}` : ''}</span>`;
                if (b.kind === 'instructions') return `<span class="cuez-chip cuez-chip-instructions" title="${escapeHTML(b.lines.join(' / '))} (not read out)"><b>DIRECTION</b> ${escapeHTML(b.lines.join(' / '))}</span>`;
                return `<span class="cuez-chip cuez-chip-prompter"><b>PROMPTER</b></span>`;
            };
            return `<span class="cuez-chips-label">In Cuez</span>${cuezBlocksPreview(script, format, slug).map(chip).join('<span class="cuez-chip-arrow">›</span>')}`;
        }

        // "+ Clip" etc: insert a tag on its own line at the cursor, with the first
        // placeholder selected ready to type over.
        const TAG_TEMPLATES = {
            clip:      { text: '[CLIP:0:00 Clip title | SOT | LW: last words]', select: '0:00' },
            strap:     { text: '[STRAP: Name | Job title]', select: 'Name' },
            direction: { text: '[Direction]', select: 'Direction' },
        };
        function insertScriptTag(kind) {
            const ta = document.getElementById('edit-script');
            const tpl = TAG_TEMPLATES[kind];
            if (!ta || !tpl || ta.disabled) return;
            let start = ta.selectionStart ?? ta.value.length, end = ta.selectionEnd ?? start;
            // If the cursor is inside a tag (e.g. just after typing over a
            // placeholder), insert after that tag rather than splitting it.
            const v = ta.value;
            const open = v.lastIndexOf('[', start - 1), closeBefore = v.lastIndexOf(']', start - 1);
            const close = v.indexOf(']', start), nextOpen = v.indexOf('[', start), nextNewline = v.indexOf('\n', start);
            if (open > closeBefore && close !== -1 && (nextOpen === -1 || close < nextOpen) && (nextNewline === -1 || close < nextNewline)) {
                start = end = close + 1;
            }
            const before = ta.value.slice(0, start), after = ta.value.slice(end);
            const pre = before && !before.endsWith('\n') ? '\n' : '';
            const post = !after.startsWith('\n') ? '\n' : '';
            ta.focus();
            ta.setRangeText(pre + tpl.text + post, start, end, 'end');
            const selStart = start + pre.length + tpl.text.indexOf(tpl.select);
            ta.setSelectionRange(selStart, selStart + tpl.select.length);
            window._moiraUpdateScriptStats();
        }

        // Live stats under the script. Direct DOM writes, never render('modal'),
        // so the textarea keeps focus and cursor position.
        window._moiraUpdateScriptStats = function () {
            const ta = document.getElementById('edit-script');
            const fmt = document.getElementById('edit-format');
            const slug = document.getElementById('edit-slug');
            if (!ta) return;
            const format = fmt ? fmt.value : '';
            const st = document.getElementById('edit-script-stats');
            if (st) st.textContent = scriptStatsLabel(ta.value, format);
            const cz = document.getElementById('edit-cuez-preview');
            if (cz) cz.innerHTML = cuezChipsHtml(ta.value, format, slug ? slug.value : '');
        };

        // "M:SS" or plain seconds; null for empty, undefined for invalid.
        function parseTargetDurationInput(raw) {
            const s = (raw || '').trim();
            if (/^\d+:\d{1,2}$/.test(s)) {
                const [m, sec] = s.split(':').map(n => parseInt(n, 10));
                if (sec > 59) return undefined;
                return m * 60 + sec;
            }
            if (/^\d+$/.test(s)) return parseInt(s, 10);
            return undefined;
        }

        // Stories Cuez should have: above the line, not floated, not segments.
        function cuezLiveIds() {
            const order = state.meta.order || [];
            const markerIdx = order.indexOf('marker-line');
            return (markerIdx > -1 ? order.slice(0, markerIdx) : order).filter(id => {
                const s = state.storiesMap[id];
                return s && s.type !== 'segment' && !s.isFloated;
            });
        }
        function cuezPendingIds() { return cuezLiveIds().filter(id => !state.storiesMap[id].cuezItemUid); }

        function cuezSendInProgress() {
            const at = state.meta.cuezSendingAt ? Date.parse(state.meta.cuezSendingAt) : 0;
            return state.ui.cuezSending || (at && Date.now() - at < CUEZ_SEND_STALE_MS);
        }

        function cuezTargetLabel() {
            if (!state.meta.cuezPartUid) return 'Not connected';
            return `${state.meta.cuezEpisodeTitle || 'Episode'} › ${state.meta.cuezPartTitle || 'Part'}`;
        }

        function cuezStatus(story) {
            if (!story.cuezItemUid) return story.cuezPendingUid ? 'pending' : 'none';
            return (story.cuezSentRev != null && story.rev > story.cuezSentRev) ? 'changed' : 'sent';
        }

        function renderCuezBadge(id, story, isLive) {
            const status = cuezStatus(story);
            if (status === 'none') {
                return isLive ? `<span class="cuez-badge cuez-none" title="Will go with the next send">Not sent</span>` : '';
            }
            if (status === 'pending') {
                return `<button data-action="cuez-unlink" data-id="${id}" class="cuez-badge cuez-changed" title="This story isn't confirmed as fully in Cuez: the send didn't confirm, or the item arrived with a block or script missing. The next send checks Cuez first: a complete item is marked as sent, an incomplete one is repaired in place, and a missing one is sent again under the same identity, so it can't make a second copy. Click to clear this and treat it as not sent (check Cuez first).">
                    <i class="fa-solid fa-hourglass-half"></i>Unconfirmed</button>`;
            }
            const when = story.cuezSentAt ? new Date(story.cuezSentAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';
            // Cuez renumbers when items are added above, so this is "as of the last send".
            const num = story.cuezItemNumber ? escapeHTML(story.cuezItemNumber) : '';
            const asItem = num ? ` as item ${num} (number as of the last send)` : '';
            if (status === 'changed') {
                return `<button data-action="cuez-unlink" data-id="${id}" class="cuez-badge cuez-changed" title="Edited since it was sent at ${when}${asItem}. Cuez still has the earlier version. Click to mark as not sent.">
                    <i class="fa-solid fa-triangle-exclamation"></i>${num ? `Item ${num} · changed` : 'Changed'}</button>`;
            }
            return `<button data-action="cuez-unlink" data-id="${id}" class="cuez-badge cuez-sent" title="Sent at ${when}${asItem}. Click to mark as not sent.">
                <i class="fa-solid fa-check"></i>${num ? `Item ${num}` : 'In Cuez'}</button>`;
        }

        function checkColour(cs) {
            return !cs ? 'text-slate-300' : cs === 'needs-checking' ? 'text-yellow-500' : cs === 'checked-ok' ? 'text-emerald-500' : 'text-red-500';
        }
        function checkTitle(cs) {
            return !cs ? 'Not checked: click to flag for checking' : cs === 'needs-checking' ? 'Needs checking: click to approve'
                : cs === 'checked-ok' ? 'Checked OK: click to flag an issue' : 'Needs work: click to clear';
        }

        function renderStatusBadge(label, icon, colorClass) {
            return `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium ${colorClass}"><i class="fa-solid ${icon}"></i> ${label}</span>`;
        }

        // Local mode only: persist per room, minus locks.
        let _saveLocalStateTimeout = null;
        function saveLocalState() {
            if (!state.localMode) return;
            clearTimeout(_saveLocalStateTimeout);
            _saveLocalStateTimeout = setTimeout(() => {
                const cleaned = {};
                for (const [id, story] of Object.entries(state.storiesMap)) {
                    cleaned[id] = { ...story, lockedBySession: null, lockedByName: null, lockedAt: null };
                }
                lsSet(LS.local(state.currentBulletinId), JSON.stringify({ storiesMap: cleaned, meta: state.meta }));
            }, 500);
        }
        function loadLocalState() {
            try {
                const str = lsGet(LS.local(state.currentBulletinId));
                if (!str) return false;
                const saved = JSON.parse(str);
                if (saved.storiesMap && saved.meta) {
                    state.storiesMap = saved.storiesMap;
                    state.meta = { ...INITIAL_META, ...saved.meta };
                    return true;
                }
            } catch (e) {}
            return false;
        }

        // ==========================================
        // 9. RENDER ENGINE
        // ==========================================
        // RAF-debounced and section-aware: render('main'), render('modal', 'header'), etc.
        const _pendingRender = { header: false, main: false, modal: false };
        let _renderRafId = null;

        function render(...sections) {
            if (!sections.length) sections = ['header', 'main', 'modal'];
            sections.forEach(s => { if (s in _pendingRender) _pendingRender[s] = true; });
            if (_renderRafId) cancelAnimationFrame(_renderRafId);
            _renderRafId = requestAnimationFrame(() => {
                _renderRafId = null;
                const dirty = { ..._pendingRender };
                _pendingRender.header = _pendingRender.main = _pendingRender.modal = false;
                _renderNow(dirty);
            });
        }

        // Which dialog should be showing. Used so a redraw is only held back while
        // you're typing in the SAME dialog, never when it should close or change.
        function modalKey() {
            if (state.ui.isShortcutsModalOpen) return 'shortcuts';
            if (state.ui.pendingConflict) return 'conflict';
            if (state.ui.editingStoryId) return 'edit:' + state.ui.editingStoryId;
            if (state.ui.join && !state.ui.needsJoin) return 'join';
            if (state.ui.isSettingsModalOpen) return 'settings:' + state.ui.settingsTab;
            return '';
        }
        let _renderedModalKey = '';

        function _renderNow(dirty) {
            if (activeDeskDialog) {
                Object.keys(dirty).filter(key => dirty[key]).forEach(key => deferredDialogRender.add(key));
                return;
            }
            const mainContainer = document.getElementById('main-container');
            const modalContainer = document.getElementById('modal-container');
            const savedScroll = mainContainer ? mainContainer.scrollTop : 0;
            const activeEl = document.activeElement;
            // Conference inputs (data-preserve) keep their text, focus and cursor
            // across redraws, so new pitches appear while you're typing the next.
            const preserving = !!activeEl && activeEl.hasAttribute && activeEl.hasAttribute('data-preserve');
            const userIsTyping = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA') && !preserving;
            const typingInModal = userIsTyping && modalContainer.contains(activeEl);

            if (dirty.header) document.getElementById('header-container').innerHTML = renderHeader();

            if (dirty.main && !state.ui.draggedStoryId && !state.ui.inlineEditingId && !(userIsTyping && !typingInModal)) {
                const kept = [...mainContainer.querySelectorAll('[data-preserve]')].map(el => [el.id, el.value]);
                const focusId = preserving ? activeEl.id : null;
                const sel = preserving && typeof activeEl.selectionStart === 'number' ? [activeEl.selectionStart, activeEl.selectionEnd] : null;
                mainContainer.innerHTML = renderMain();
                kept.forEach(([id, value]) => { const el = id && document.getElementById(id); if (el) el.value = value; });
                if (focusId) {
                    const el = document.getElementById(focusId);
                    if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch {} }
                }
            } else if (dirty.main) {
                _pendingRender.main = true; // try again once typing/dragging ends
            }

            if (dirty.modal) {
                const key = modalKey();
                if (!(typingInModal && key === _renderedModalKey)) {
                    if (typingInModal) activeEl.blur(); // the dialog is closing or changing
                    modalContainer.innerHTML = renderModals();
                    _renderedModalKey = key;
                }
                // Same dialog, still typing: skip the redraw so unsaved text isn't wiped.
            }

            if (dirty.main) {
                const mc = document.getElementById('main-container');
                if (state.ui.pendingScrollToStoryId) {
                    const row = document.querySelector(`[data-story-id="${state.ui.pendingScrollToStoryId}"]`);
                    if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    state.ui.pendingScrollToStoryId = null;
                } else if (!state.ui.draggedStoryId && mc) {
                    mc.scrollTop = savedScroll;
                }
            }

            saveLocalState();

            if (dirty.modal) {
                const s = state.ui.editingStoryId && !state.ui.pendingConflict ? state.storiesMap[state.ui.editingStoryId] : null;
                if (s && lockState(s) === 'other') startTakeoverCountdown(s.lockedAt);
                else if (takeoverCountdownInterval) { clearInterval(takeoverCountdownInterval); takeoverCountdownInterval = null; }
            }
        }

        // Locks expire by time, not by event: redraw when any story's lock state
        // changes so a stale lock frees its row without needing a refresh.
        let _lockSignature = '';
        setInterval(() => {
            const sig = Object.values(state.storiesMap).map(s => lockState(s)[0]).join('');
            if (sig !== _lockSignature) { _lockSignature = sig; render('main'); }
        }, 5000);

        // Re-render main once the user stops typing, if an update was held back.
        document.addEventListener('focusout', () => {
            setTimeout(() => { if (_pendingRender.main) render('main'); }, 0);
        });

        let takeoverCountdownInterval = null;
        function startTakeoverCountdown(lockedAt) {
            if (takeoverCountdownInterval) return;
            takeoverCountdownInterval = setInterval(() => {
                const btn = document.getElementById('takeover-btn');
                if (!btn) { clearInterval(takeoverCountdownInterval); takeoverCountdownInterval = null; return; }
                const lockAge = Date.now() - lockedAt;
                if (lockAge >= STALE_LOCK_MS) {
                    btn.disabled = false;
                    btn.textContent = 'Take over';
                    btn.className = 'text-xs bg-amber-600 hover:bg-amber-700 text-white border border-amber-700 px-3 py-1.5 rounded shadow-sm font-bold transition-colors';
                    clearInterval(takeoverCountdownInterval);
                    takeoverCountdownInterval = null;
                } else {
                    btn.textContent = `Wait ${Math.ceil((STALE_LOCK_MS - lockAge) / 1000)}s…`;
                }
            }, 500);
        }

        // ==========================================
        // 10. VIEWS
        // ==========================================
        function renderHeader() {
            let connectionBadge;
            if (state.connectionState === 'connecting') connectionBadge = renderStatusBadge('Connecting', 'fa-circle-notch fa-spin', 'bg-blue-100 text-blue-800 border border-blue-200');
            else if (state.connectionState === 'connected') connectionBadge = renderStatusBadge('Synced', 'fa-cloud-arrow-down', 'bg-emerald-100 text-emerald-800 border border-emerald-200');
            else if (state.connectionState === 'error') connectionBadge = renderStatusBadge('Sync error', 'fa-triangle-exclamation', 'bg-red-100 text-red-800 border border-red-200');
            else connectionBadge = renderStatusBadge('Local mode', 'fa-hard-drive', 'bg-amber-100 text-amber-800 border border-amber-200');

            return `
                <div class="bg-white border-b border-slate-200 px-3 py-2 md:px-6 md:py-3 flex flex-wrap items-center justify-between gap-x-3 gap-y-2">
                    <div class="flex items-center gap-3 min-w-0 max-w-full">
                        <h1 class="text-xl font-bold tracking-tight text-slate-800 whitespace-nowrap"><i class="fa-solid fa-newspaper text-blue-500 mr-2"></i><span class="hidden sm:inline">Moira:<span class="text-blue-600">Desk</span></span></h1>
                        <button data-action="set-my-name" title="Shown to others when you're editing a story"
                            class="flex items-center gap-1.5 bg-blue-50 border border-blue-200 text-blue-800 px-3 py-1 rounded-full text-xs font-bold hover:bg-blue-100 transition-colors truncate">
                            <i class="fa-solid fa-user text-[10px] opacity-60"></i>${state.myName ? escapeHTML(state.myName) : '<span class="font-normal italic">Set your name</span>'}
                        </button>
                        ${!state.localMode && supabaseUser ? `<button data-action="sign-out" title="Sign out of Moira:Desk on this browser" aria-label="Sign out of Moira:Desk" ${state.signingOut ? 'disabled' : ''}
                            class="shrink-0 flex items-center gap-1.5 text-slate-500 hover:text-red-600 hover:bg-red-50 border border-slate-200 px-2.5 py-1 rounded-full text-xs font-bold transition-colors whitespace-nowrap">
                            <i class="fa-solid fa-right-from-bracket"></i><span class="hidden sm:inline">${state.signingOut ? 'Signing out…' : 'Sign out'}</span></button>` : ''}
                    </div>
                    <div class="flex items-center gap-3">
                        ${renderRoomControl()}
                        ${state.currentBulletinId ? `<a href="prompt.html?room=${encodeURIComponent(state.currentBulletinId)}" target="_blank" rel="noopener" data-testid="open-prompter"
                            class="flex items-center gap-1.5 text-slate-500 hover:text-blue-700 hover:bg-blue-50 border border-slate-200 px-2.5 py-1 rounded-full text-xs font-bold transition-colors whitespace-nowrap"
                            title="Open the prompter in a new tab" aria-label="Open the prompter in a new tab"><i class="fa-solid fa-scroll"></i><span class="hidden sm:inline">Prompter</span></a>` : ''}
                        ${state.currentBulletinId ? `<button data-action="open-settings-modal" class="text-slate-400 hover:text-slate-600 transition-colors" title="Settings"><i class="fa-solid fa-gear text-lg"></i></button>` : ''}
                        ${connectionBadge}
                    </div>
                </div>`;
        }

        // Newsroom switcher (joined rooms) plus "Join another".
        function renderRoomControl() {
            if (state.localMode) {
                return `<span class="hidden md:inline text-xs font-bold text-slate-500 uppercase tracking-widest">${escapeHTML(state.roomDisplayName)}</span>`;
            }

            const select = state.rooms.length > 1
                ? `<select id="room-select" class="bg-white border border-slate-300 rounded px-2 py-1 text-sm font-bold text-slate-800 outline-none focus:border-blue-500 max-w-[12rem]">
                    ${state.rooms.map(r => `<option value="${escapeHTML(r.id)}" ${r.id === state.currentBulletinId ? 'selected' : ''}>${escapeHTML(r.name)}</option>`).join('')}
                   </select>`
                : `<span class="px-2 text-sm font-bold text-slate-800 truncate max-w-[12rem]">${escapeHTML(state.roomDisplayName)}</span>`;
            return `<div class="flex items-center bg-slate-100 p-1 rounded-lg border border-slate-200 gap-1">
                <span class="hidden md:inline text-[10px] font-bold text-slate-500 uppercase tracking-widest px-2">Newsroom</span>
                ${select}
                <button data-action="open-join" title="Join another newsroom with its code" class="bg-white hover:bg-slate-50 border border-slate-300 text-slate-600 px-2 py-1 rounded text-sm"><i class="fa-solid fa-key"></i><span class="hidden lg:inline ml-1.5">Join</span></button>
            </div>`;
        }

        // The code form, used full-screen on first visit and in a dialog after.
        function renderJoinForm() {
            const j = state.ui.join || {};
            return `
                <div class="space-y-4">
                    ${!state.myName ? `<div>
                        <label class="text-sm font-semibold block mb-1" for="join-name">Your name</label>
                        <input type="text" id="join-name" maxlength="40" autocomplete="name" class="w-full border rounded-lg px-4 py-2.5 outline-none focus:border-blue-500" placeholder="Shown when you're editing a story">
                    </div>` : ''}
                    <div>
                        <label class="text-sm font-semibold block mb-1" for="join-code">Newsroom code</label>

                    </div>

                    <button data-action="join-submit" ${j.busy ? 'disabled' : ''} class="btn-primary w-full !py-3">
                        ${j.busy ? '<i class="fa-solid fa-circle-notch fa-spin"></i>' : 'Join newsroom'}
                    </button>
                </div>`;
        }

        function renderJoinScreen() {
            return `<div class="min-h-full flex items-center justify-center p-4">
                <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-8">
                    <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-key text-2xl"></i></div>
                    <h2 class="text-2xl font-bold text-slate-800 text-center mb-1">Join your newsroom</h2>

        function renderJoinModal() {

                    <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
