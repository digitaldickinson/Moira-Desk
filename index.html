<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moira:Desk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0/release/index.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0/release/default.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .drag-over { border-top: 4px solid #3b82f6 !important; }
        #main-container { -webkit-overflow-scrolling: touch; overflow-y: auto; }

        .form-label-sm { font-size: 0.625rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .form-input-sm { width: 100%; border: 1px solid #e2e8f0; border-radius: 0.375rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; font-family: monospace; outline: none; }
        .form-input-sm:focus { border-color: #3b82f6; }
        .btn-primary   { padding: 0.625rem 1.5rem; border-radius: 0.5rem; background: #2563eb; color: #fff; font-weight: 500; font-size: 0.875rem; box-shadow: 0 1px 2px rgb(0 0 0/0.05); transition: background-color 150ms; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }

        @keyframes toast-in  { from { opacity:0; transform:translateY(12px) scale(0.97); } to { opacity:1; transform:translateY(0) scale(1); } }
        @keyframes toast-out { from { opacity:1; } to { opacity:0; transform:translateY(-8px); } }
        .moira-toast { animation: toast-in 0.2s ease-out forwards; }
        .moira-toast.leaving { animation: toast-out 0.4s ease-in forwards; }

        @keyframes shake {
            10%, 90% { transform: translateX(-1px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }
        .shake { animation: shake 0.4s; }

        /* Touch: hide the grip, show ▲/▼ instead */
        .row-reorder-btns { display: none; }
        @media (pointer: coarse) {
            .row-drag-icon  { display: none; }
            .row-reorder-btns { display: flex; flex-direction: column; align-items: center; gap: 1px; }
        }

        .segment-row td { padding: 0; }
        .segment-divider { display: flex; align-items: center; background: #eef2ff; color: #3730a3; border-top: 1px solid #c7d2fe; border-bottom: 1px solid #c7d2fe; }
        .segment-label  { font-size: 0.7rem; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.4rem 1rem; white-space: nowrap; }
        .segment-dur    { font-size: 0.7rem; font-family: monospace; opacity: 0.6; padding-right: 1rem; }
        .segment-line   { flex: 1; height: 1px; background: #c7d2fe; }

        .cuez-badge { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.15rem 0.5rem; border-radius: 999px; border: 1px solid; white-space: nowrap; }
        .cuez-none    { color: #94a3b8; border-color: #e2e8f0; background: #f8fafc; }
        .cuez-sent    { color: #047857; border-color: #a7f3d0; background: #ecfdf5; cursor: pointer; }
        .cuez-changed { color: #b45309; border-color: #fcd34d; background: #fffbeb; cursor: pointer; }

        /* "In Cuez" preview chips, in Cuez's block colours */
        .cuez-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem; margin-top: 0.35rem; }
        .cuez-chips-label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: #94a3b8; margin-right: 0.15rem; }
        .cuez-chip { font-size: 0.7rem; padding: 0.1rem 0.45rem; border-radius: 0.3rem; border-left: 3px solid; white-space: nowrap; max-width: 16rem; overflow: hidden; text-overflow: ellipsis; }
        .cuez-chip b { font-weight: 800; letter-spacing: 0.04em; }
        .cuez-chip-prompter { color: #0369a1; background: #f0f9ff; border-color: #38bdf8; }
        .cuez-chip-clip { color: #7e22ce; background: #faf5ff; border-color: #a855f7; }
        .cuez-chip-strap { color: #1d4ed8; background: #eff6ff; border-color: #3b82f6; }
        .cuez-chip-instructions { color: #b91c1c; background: #fef2f2; border-color: #ef4444; }
        .cuez-chip-arrow { color: #cbd5e1; font-size: 0.75rem; }
        .script-tool { font-size: 0.7rem; font-weight: 700; padding: 0.1rem 0.5rem; border-radius: 0.3rem; border: 1px solid; background: #fff; }
        .script-tool-clip { color: #7e22ce; border-color: #d8b4fe; }
        .script-tool-strap { color: #1d4ed8; border-color: #93c5fd; }
        .script-tool-instructions { color: #b91c1c; border-color: #fca5a5; }
        .script-tool:hover { filter: brightness(0.95); }

        /* Small action dialogs sit above the editor without replacing its draft. */
        .desk-dialog { width: min(540px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; margin: auto; padding: 0; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; color: #1e293b; box-shadow: 0 24px 64px #0f172a33; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .desk-dialog::backdrop { background: #0f172a99; backdrop-filter: blur(3px); }
        .desk-dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 24px; border-bottom: 1px solid #e2e8f0; }
        .desk-dialog h2 { margin: 0; font-size: 18px; font-weight: 700; }
        .desk-dialog-body { padding: 20px 24px; display: grid; gap: 14px; }
        .desk-dialog-message { margin: 0; white-space: pre-line; overflow-wrap: anywhere; color: #475569; }
        .desk-dialog label { display: block; font-weight: 600; margin-bottom: 6px; }
        .desk-dialog input, .desk-dialog textarea { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; background: #f8fafc; color: #1e293b; font: inherit; }
        .desk-dialog textarea { min-height: 120px; resize: vertical; }
        .desk-dialog input:focus, .desk-dialog textarea:focus { outline: 2px solid #2563eb; outline-offset: 1px; }
        .desk-dialog-count { text-align: right; color: #64748b; font-size: 12px; margin-top: 4px; }
        .desk-dialog-error { color: #b91c1c; font-size: 13px; }
        .desk-dialog-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid #e2e8f0; }
        .desk-dialog button { border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; background: #f1f5f9; color: #475569; }
        .desk-dialog button:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
        .desk-dialog .desk-dialog-close { padding: 4px 10px; font-size: 20px; }
        .desk-dialog .desk-dialog-submit { background: #2563eb; color: #fff; }
        .desk-dialog .desk-dialog-submit.danger { background: #b91c1c; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden text-slate-800">

    <div id="header-container" class="shrink-0"></div>
    <div id="main-container" class="flex-1 overflow-auto"></div>
    <div id="modal-container" class="relative z-50"></div>

    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

        // ==========================================
        // 1. CONSTANTS & CONFIGURATION
        // ==========================================

        // ── YOUR SUPABASE PROJECT ──────────────────────────────────────────
        // Project Settings → API in the Supabase dashboard. Both values are
        // designed to be public: the members-only database rules are what
        // protect the data, so it's safe for these to be in a public repo.
        // Leave the placeholders in to run in Local Mode (this browser only).
        const SUPABASE_URL = 'https://ushtoubwyopjdlogapew.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzaHRvdWJ3eW9wamRsb2dhcGV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0OTY3MzUsImV4cCI6MjEwODA3MjczNX0.qyukiNYqfnaOrnqGiL9mAGgmSmvBFKHe5YlzD59BFOA';
        // Optional: Cloudflare Turnstile site key, if you've turned on CAPTCHA
        // protection in Supabase (see the README). Leave empty otherwise.
        const TURNSTILE_SITE_KEY = '';
        // ───────────────────────────────────────────────────────────────────

        const DEFAULT_FORMATS = ["READ", "WRAP", "CLIP", "OOV", "ULAY", "OOV/CLIP", "ULAY/CLIP", "OVO", "LIVE"];
        const STALE_LOCK_MS = 1000 * 45;   // heartbeat refreshes every 20s while the editor is open
        const DEFAULT_WPM = 120;           // Cuez's default prompter read speed; the newsroom's own setting wins
        const CUEZ_FUNCTION = 'send-to-cuez';
        const CUEZ_SEND_STALE_MS = 120 * 1000;  // matches SEND_CLAIM_SECONDS in the function

        // Script tags -> Cuez blocks. Keep in step with TAG_RE / parseTag /
        // storyBlocks in the send-to-cuez function.
        //   [CLIP:1:20 Title | SOT | LW: last words]   clip (all parts optional)
        //   [STRAP: Name | Job title]                  lower third
        //   [any other direction]                      instructions (not read out)
        const TAG_RE = /\[([^\]\n]+)\]/g;
        const CLIP_FORMATS = new Set(["WRAP", "CLIP", "OOV", "ULAY", "OOV/CLIP", "ULAY/CLIP", "PKG", "VT"]);
        const OFF_FORMATS = new Set(["OOV", "ULAY"]);   // clips default to OFF here, SOT elsewhere

        // localStorage keys are prefixed so Moira:Desk and Moira:Rundown can share
        // an origin (e.g. the same GitHub Pages site) without clobbering each other.
        const LS = {
            bulletin: 'moiradesk_bulletin_id',
            name:     'moiradesk_my_name',
            view:     'moiradesk_view',
            local:    (id) => `moiradesk_local_room_${id}`,
        };
        const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
        const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
        const lsDel = (k) => { try { localStorage.removeItem(k); } catch {} };

        // Stable per browser, so your own locks are recognisable across tabs and reloads.
        const BROWSER_ID = (() => {
            let id = lsGet('moiradesk_browser_id');
            if (!id) { id = crypto.randomUUID().slice(0, 8); lsSet('moiradesk_browser_id', id); }
            return id;
        })();

        const INITIAL_META = {
            order: [], formats: DEFAULT_FORMATS, targetDuration: null,
            cuezEpisodeId: null, cuezEpisodeTitle: null, cuezPartUid: null, cuezPartTitle: null, cuezSendingAt: null,
            producerUser: null, producerName: null, conferenceId: null, conferenceStartedAt: null,
        };

        const IS_CONFIGURED = /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SUPABASE_URL) && !/YOUR-/.test(SUPABASE_ANON_KEY);

        let supabase = null;
        let supabaseUser = null;
        let lockRefreshInterval = null;

        function startLockRefresh(id) {
            stopLockRefresh();
            lockRefreshInterval = setInterval(async () => {
                if (state.ui.editingStoryId !== id) { stopLockRefresh(); return; }
                const story = state.storiesMap[id];
                if (!story || story.lockedBySession !== state.sessionId) { stopLockRefresh(); return; }
                story.lockedAt = Date.now();
                try { if (!(await DB.renewLock(id, state.sessionId))) lockLost(id); }
                catch (e) { console.warn('Lock refresh failed, lock may go stale:', e.message); }
            }, 20000);
        }
        function stopLockRefresh() {
            if (lockRefreshInterval) { clearInterval(lockRefreshInterval); lockRefreshInterval = null; }
        }
        // The server says this tab no longer holds the lock (it went stale and
        // someone took over). Keep the editor and the text; saving will tell them
        // whether it can go through.
        function lockLost(id) {
            stopLockRefresh();
            const story = state.storiesMap[id];
            showNotice('Heads up', `Someone else took over "${story?.slug || 'this story'}" while your editor was idle. Your text is still here; if they're still editing, saving will be refused, so copy it somewhere safe.`, 'warn');
        }

        // Switching tabs (to Cuez, say) keeps the editor open and your text intact.
        // Browsers slow timers in hidden tabs, so the heartbeat may lapse and the
        // lock go stale; on return, renew it. If someone took over meanwhile, warn:
        // their save bumps the revision, so yours will raise the conflict prompt.
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState !== 'visible') return;
            const id = state.ui.editingStoryId;
            const story = id && state.storiesMap[id];
            if (!story || !canMutate()) return;
            if (story.lockedBySession === state.sessionId) {
                story.lockedAt = Date.now();
                let held = true;
                try { held = await DB.renewLock(id, state.sessionId); } catch (e) { console.warn('Lock renew failed:', e.message); }
                if (held) startLockRefresh(id); else lockLost(id);
            } else if (lockState(story) === 'free') {
                await lockStory(id);
                startLockRefresh(id);
            } else {
                showNotice('Heads up', `${story.lockedByName} took over "${story.slug}" while you were away. If they've saved, you'll be asked which version to keep when you save.`, 'warn');
            }
        });

        // ==========================================
        // 2. CENTRAL STATE
        // ==========================================
        let state = {
            localMode: true,
            signingOut: false,
            connectionState: 'offline',
            rooms: [],                     // newsrooms this browser has joined: [{ id, name }]
            roomDisplayName: 'Local newsroom',
            currentBulletinId: IS_CONFIGURED ? null : 'bulletin-local',
            // "browser/tab": locks from your own other tabs (or a page you
            // reloaded mid-edit) can be taken over straight away.
            sessionId: `${BROWSER_ID}/${crypto.randomUUID()}`,
            myName: lsGet(LS.name) || '',
            meta: { ...INITIAL_META },
            storiesMap: {},
            pitchesMap: {},                // this newsroom's pitches (current conference shown)
            ui: {
                view: lsGet(LS.view) === 'conference' ? 'conference' : 'rundown',
                editingPitchId: null, // pitch being edited inline
                pitchBusy: false,     // waiting on a pitch/producer action
                draggedStoryId: null,
                inlineEditingId: null,
                editingStoryId: null,
                pendingConflict: null,
                pendingScrollToStoryId: null,
                isSettingsModalOpen: false,
                settingsTab: 'editorial',
                join: null,           // { error, busy } while the join dialog/screen is in use
                needsJoin: false,     // signed in but no newsrooms yet: show the join screen
                isShortcutsModalOpen: false,
                cuezSending: false,   // this browser is waiting on a send
                trash: [],            // [{id, story, orderIndex, deletedAt}]
                storySnapshots: {},   // {storyId: previous version} for one-step revert
            }
        };

        const canMutate = () => !state.signingOut && (state.localMode || !!supabaseUser);

        // ==========================================
        // 3. NOTICES
        // ==========================================
        let _errorContainer = null;
        function showError(message, actionLabel = null, actionFn = null) {
            if (!_errorContainer) {
                _errorContainer = document.createElement('div');
                _errorContainer.style.cssText = 'position:fixed;bottom:1rem;right:1rem;left:1rem;z-index:9998;display:flex;flex-direction:column;gap:0.5rem;pointer-events:none;max-width:min(26rem,calc(100vw - 2rem));margin-left:auto;';
                document.body.appendChild(_errorContainer);
            }
            const el = document.createElement('div');
            el.style.cssText = 'background:#1e293b;border:1px solid #ef4444;border-left:4px solid #ef4444;border-radius:0.75rem;padding:0.75rem 1rem;box-shadow:0 8px 32px rgba(0,0,0,0.5);pointer-events:auto;display:flex;flex-direction:column;gap:0.4rem;';
            el.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;">
                    <span style="font-size:0.6rem;font-weight:900;color:#ef4444;text-transform:uppercase;letter-spacing:0.1em;">&#9888; Error</span>
                    <button data-dismiss style="font-size:0.7rem;color:#64748b;background:none;border:none;cursor:pointer;padding:0;">&#10005; Dismiss</button>
                </div>
                <div style="font-size:0.82rem;font-weight:600;color:#f1f5f9;line-height:1.45;white-space:pre-wrap;">${escapeHTML(message)}</div>
                ${actionLabel && actionFn ? `<button data-act style="margin-top:0.2rem;font-size:0.75rem;font-weight:700;color:#93c5fd;background:none;border:none;cursor:pointer;text-align:left;padding:0;text-decoration:underline;">${escapeHTML(actionLabel)}</button>` : ''}`;
            el.querySelector('[data-dismiss]').addEventListener('click', () => el.remove());
            if (actionLabel && actionFn) el.querySelector('[data-act]').addEventListener('click', () => { el.remove(); actionFn(); });
            _errorContainer.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 20000);
        }

        let _toastContainer = null;
        function showNotice(title, text, tone = 'ok') {
            if (!_toastContainer) {
                _toastContainer = document.createElement('div');
                _toastContainer.style.cssText = 'position:fixed;top:1rem;right:1rem;left:1rem;z-index:9999;display:flex;flex-direction:column;gap:0.5rem;pointer-events:none;max-width:min(24rem,calc(100vw - 2rem));margin-left:auto;';
                document.body.appendChild(_toastContainer);
            }
            const colour = tone === 'warn' ? '#f59e0b' : '#10b981';
            const toast = document.createElement('div');
            toast.className = 'moira-toast';
            toast.style.cssText = `background:#1e293b;border:1px solid ${colour};border-left:4px solid ${colour};border-radius:0.75rem;padding:0.75rem 1rem;box-shadow:0 8px 32px rgba(0,0,0,0.4);pointer-events:auto;`;
            toast.innerHTML = `
                <div style="font-size:0.6rem;font-weight:900;color:${colour};text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.25rem;">${escapeHTML(title)}</div>
                <div style="font-size:0.875rem;font-weight:600;color:#f1f5f9;line-height:1.4;white-space:pre-wrap;">${escapeHTML(text)}</div>`;
            _toastContainer.appendChild(toast);
            const dismiss = () => { toast.classList.add('leaving'); toast.addEventListener('animationend', () => toast.remove(), { once: true }); };
            const timer = setTimeout(dismiss, tone === 'warn' ? 15000 : 7000);
            toast.addEventListener('click', () => { clearTimeout(timer); dismiss(); });
        }

        // ==========================================
        // 4. STARTUP
        // ==========================================
        // Gets a Cloudflare Turnstile token for signing in, when a site key is set.
        // Usually invisible; Cloudflare shows a checkbox only if it's unsure.
        // Only needed the first time a browser signs in: the session is reused after.
        function captchaToken() {
            if (!TURNSTILE_SITE_KEY) return Promise.resolve(undefined);
            return new Promise((resolve, reject) => {
                const box = document.createElement('div');
                box.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999';
                document.body.appendChild(box);
                const done = (fn, v) => { box.remove(); fn(v); };
                const render = () => window.turnstile.render(box, {
                    sitekey: TURNSTILE_SITE_KEY, appearance: 'interaction-only',
                    callback: (t) => done(resolve, t),
                    'error-callback': () => done(reject, new Error('The human check failed. Reload to try again.')),
                    'timeout-callback': () => done(reject, new Error('The human check timed out. Reload to try again.')),
                });
                if (window.turnstile) return render();
                const sc = document.createElement('script');
                sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
                sc.async = true;
                sc.onload = render;
                sc.onerror = () => done(reject, new Error('Could not load the human check (Cloudflare Turnstile). Check your connection.'));
                document.head.appendChild(sc);
            });
        }

        async function boot() {
            bindGlobalEvents();
            if (!IS_CONFIGURED) { seedLocalData(); render(); return; }

            state.connectionState = 'connecting';
            render('header');
            try {
                supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                // Reuse this browser's session: signing in afresh on every load
                // would create a new anonymous user each time, forgetting which
                // newsrooms it joined (and eating the per-network sign-in limit).
                const { data: { session } } = await supabase.auth.getSession();
                if (session?.user) {
                    supabaseUser = session.user;
                } else {
                    const token = await captchaToken();
                    const { data, error } = await supabase.auth.signInAnonymously(token ? { options: { captchaToken: token } } : undefined);
                    if (error) throw error;
                    supabaseUser = data.user;
                }
                state.localMode = false;
                DB = DB_SUPABASE;

                supabase.auth.onAuthStateChange((_event, session) => {
                    if (session && session.user) {
                        supabaseUser = session.user;
                    } else {
                        if (state.signingOut) return;
                        supabaseUser = null;
                        state.connectionState = 'offline';
                        render('header');
                        showError('Signed out: changes are not saving. Reload to reconnect.', 'Reload', () => location.reload());
                    }
                });

                await loadRooms();
                setInterval(checkAccess, 60000);
                document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkAccess(); });
                const last = lsGet(LS.bulletin);
                const room = state.rooms.find(r => r.id === last) || state.rooms[0];
                if (room) openRoom(room.id);
                else { state.ui.needsJoin = true; state.connectionState = 'connected'; render(); }
            } catch (e) {
                state.connectionState = 'error';
                render('header', 'main');
                const msg = /fetch/i.test(e.message || '')
                    ? 'Could not reach the server. Check your internet connection and reload.'
                    : /anonymous/i.test(e.message || '')
                        ? 'Sign-in failed: Anonymous Sign-Ins must be enabled for this Supabase project (Authentication → Sign In / Providers).'
                        : /rate|limit/i.test(e.message || '')
                            ? 'Too many sign-ins from this network. Wait a minute and reload (or raise the anonymous sign-in rate limit in Supabase).'
                            : `Sign-in failed: ${e.message}`;
                showError(msg, 'Reload', () => location.reload());
            }
        }

        // Newsrooms this browser has joined (the database only returns those).
        async function loadRooms() {
            const { data, error } = await supabase.rpc('my_newsrooms');
            if (error) throw error;
            state.rooms = (data || []).map(r => ({ id: r.newsroom_id, name: r.newsroom_name }));
        }

        function openRoom(bulletinId) {
            const room = state.rooms.find(r => r.id === bulletinId);
            if (!room) return;
            if (state.ui.editingStoryId) { stopLockRefresh(); unlockStory(state.ui.editingStoryId); }

            state.roomDisplayName = room.name;
            state.currentBulletinId = room.id;
            state.storiesMap = {};
            state.pitchesMap = {};
            state.meta = { ...INITIAL_META };
            Object.assign(state.ui, {
                draggedStoryId: null, editingStoryId: null, pendingConflict: null,
                trash: [], needsJoin: false, join: null, editingPitchId: null,
            });
            lsSet(LS.bulletin, room.id);
            render();
            setupListeners();
        }

        // Re-check memberships, so a changed code removes access within a minute.
        async function checkAccess() {
            if (state.signingOut || state.localMode || !supabaseUser || !state.currentBulletinId) return;
            try { await loadRooms(); } catch { return; } // offline: try again later
            if (state.signingOut) return;
            if (!state.rooms.some(r => r.id === state.currentBulletinId)) lostAccess();
            else render('header');
        }

        // Called when the database stops returning this newsroom: its code was
        // changed (removing members) or it was deleted.
        async function lostAccess() {
            if (!state.currentBulletinId) return;
            const name = state.roomDisplayName;
            if (unsubAll) { unsubAll(); unsubAll = null; }
            state.ui.editingStoryId = null;
            stopLockRefresh();
            try { await loadRooms(); } catch {}
            state.rooms = state.rooms.filter(r => r.id !== state.currentBulletinId);
            showError(`You no longer have access to ${name}. Its code may have been changed: ask for the new one.`);
            state.currentBulletinId = null;
            state.storiesMap = {};
            state.meta = { ...INITIAL_META };
            if (state.rooms.length) openRoom(state.rooms[0].id);
            else { state.ui.needsJoin = true; render(); }
        }

        async function joinWithCode(code, name) {
            const j = state.ui.join || (state.ui.join = {});
            if (name) { state.myName = name.slice(0, 40); lsSet(LS.name, state.myName); }
            if (!state.myName) { j.error = 'Add your name: it shows others who is editing a story.'; render('main', 'modal'); return; }
            if (!code.trim()) { j.error = 'Enter the newsroom code.'; render('main', 'modal'); return; }
            j.busy = true; j.error = null;
            render('main', 'modal');
            try {
                const { data, error } = await supabase.rpc('join_newsroom', { p_code: code });
                if (error) throw error;
                const room = data?.[0];
                if (!room) { Object.assign(j, { busy: false, error: "That code isn't recognised. Check it with your tutor or editor." }); render('main', 'modal'); return; }
                await loadRooms();
                state.ui.join = null;
                openRoom(room.newsroom_id);
                showNotice('Joined', `You're in ${room.newsroom_name}.`);
            } catch (e) {
                Object.assign(j, { busy: false, error: e.message || 'Could not join.' });
                render('main', 'modal');
            }
        }

        function seedLocalData() {
            if (!state.localMode) return;
            if (loadLocalState()) { render('header', 'main'); return; }
            const localId = crypto.randomUUID();
            state.storiesMap[localId] = {
                bulletinId: state.currentBulletinId,
                slug: 'WELCOME TO MOIRA:DESK',
                script: `Good evening. You're in Local Mode: nothing here leaves this browser.\nTo share newsrooms and send to Cuez, add your Supabase details to index.html.\n[CLIP:0:20 Example clip]\nA [CLIP] tag becomes an empty clip block in Cuez for production to fill.`,
                format: 'OVO', presenter: '', reporter: '',
                duration: 35, completed: null, isFloated: false, type: null,
                lockedBySession: null, lockedByName: null, lockedAt: null, rev: 1,
                cuezItemUid: null, cuezSentAt: null, cuezSentRev: null, cuezItemNumber: null,
            };
            state.meta = { ...INITIAL_META, order: [localId, 'marker-line'] };
            render('header', 'main');
        }

        // ==========================================
        // 5. DATA SYNC
        // ==========================================
        let unsubAll = null;

        function setupListeners() {
            if (!canMutate() || state.localMode || !state.currentBulletinId) return;
            if (unsubAll) { unsubAll(); unsubAll = null; }
            const bulletinId = state.currentBulletinId;

            unsubAll = DB.subscribe(
                (data, err) => {
                    if (bulletinId !== state.currentBulletinId) return;
                    if (err) { state.connectionState = 'error'; render('header'); showError('Lost connection to the database: changes are not saving. Reconnecting…'); return; }
                    state.connectionState = 'connected';
                    if (!data) { lostAccess(); return; }
                    const conferenceChanged = data.conferenceId !== state.meta.conferenceId;
                    state.meta = { ...INITIAL_META, ...data };
                    if (conferenceChanged) refreshPitches();
                    render('header', 'main');
                },
                (changes, err) => {
                    if (bulletinId !== state.currentBulletinId) return;
                    if (err) { state.connectionState = 'error'; render('header'); showError('Story sync lost. Check your connection.'); return; }
                    const newMap = { ...state.storiesMap };
                    changes.forEach(({ type, id, data }) => {
                        if (type === 'removed') delete newMap[id];
                        else newMap[id] = data;
                    });
                    state.storiesMap = newMap;
                    render('main');
                },
                (changes) => {
                    if (bulletinId !== state.currentBulletinId) return;
                    const map = { ...state.pitchesMap };
                    changes.forEach(({ type, id, data }) => { if (type === 'removed') delete map[id]; else map[id] = data; });
                    state.pitchesMap = map;
                    prunePitchTrash();
                    render('main');
                }
            );
        }

        // Reload the current conference's pitches (after a change of conference,
        // and after each pitch action in case a Realtime event was missed).
        // Only the latest request's answer is used: requests can overlap (a new
        // conference starts while an earlier load is still in flight), and a
        // late answer for the old conference must not replace the current one.
        let _pitchLoadSeq = 0;
        async function refreshPitches() {
            if (state.localMode || !state.currentBulletinId) return;
            const seq = ++_pitchLoadSeq;
            const bulletinId = state.currentBulletinId;
            const conferenceId = state.meta.conferenceId;
            try {
                const rows = await DB.loadPitches(bulletinId, conferenceId);
                if (seq !== _pitchLoadSeq || bulletinId !== state.currentBulletinId || conferenceId !== state.meta.conferenceId) return;
                state.pitchesMap = Object.fromEntries(rows.map(p => [p.id, p]));
                prunePitchTrash();
                render('main');
            } catch (e) { console.warn('Could not load pitches:', e.message); }
        }

        // ==========================================
        // 6. DB ADAPTERS
        // ==========================================
        // Mutators update state optimistically, then persist through DB.*.

        const DB_NULL = {
            subscribe:                 () => () => {},
            updateBulletin:      async () => {},
            moveStory:           async () => null,
            createStory:         async () => {},
            deleteStory:         async () => {},
            restoreStory:        async () => {},
            saveStory:           async () => 'ok',
            lockStory:           async () => {},
            renewLock:           async () => true,
            unlockStory:         async () => {},
            saveSlug:            async () => {},
            takeLock:            async () => {},
            setStoryStatus:      async () => {},
            setStoryFloated:     async () => {},
            markNotSent:         async () => {},
            loadPitches:         async () => [],
            pitchAction:         async () => null,
            errorMessage:              (e) => e?.message || 'Unknown error',
        };

        // snake_case columns <-> camelCase objects
        function bulletinFromRow(row) {
            return {
                order: row.order_ids || [],
                formats: (row.formats && row.formats.length) ? row.formats : DEFAULT_FORMATS,
                targetDuration: row.target_duration ?? null,
                cuezEpisodeId: row.cuez_episode_id || null,
                cuezEpisodeTitle: row.cuez_episode_title || null,
                cuezPartUid: row.cuez_part_uid || null,
                cuezPartTitle: row.cuez_part_title || null,
                cuezSendingAt: row.cuez_sending_at || null,
                cuezReadSpeed: row.cuez_read_speed ?? null,
                producerUser: row.producer_user || null,
                producerName: row.producer_name || null,
                conferenceId: row.conference_id || null,
                conferenceStartedAt: row.conference_started_at || null,
            };
        }
        function pitchFromRow(row) {
            return {
                id: row.id, conferenceId: row.conference_id, slug: row.slug || '', angle: row.angle || '',
                format: row.format || '', pitchedBy: row.pitched_by || '', createdBy: row.created_by || null,
                status: row.status || 'pitched', spikeReason: row.spike_reason || '', epNote: row.ep_note || '',
                storyId: row.story_id || null, position: row.position ?? 0,
                createdAt: row.created_at || null, decidedAt: row.decided_at || null,
            };
        }
        const BULLETIN_FIELD_MAP = {
            order: 'order_ids', formats: 'formats', targetDuration: 'target_duration',
        };
        function bulletinToRow(updates) {
            const row = {};
            for (const [k, v] of Object.entries(updates)) if (BULLETIN_FIELD_MAP[k]) row[BULLETIN_FIELD_MAP[k]] = v;
            return row;
        }
        function storyFromRow(row) {
            return {
                bulletinId: row.bulletin_id,
                slug: row.slug || '',
                script: row.script || '',
                format: row.format || '',
                presenter: row.presenter || '',
                reporter: row.reporter || '',
                duration: row.duration || 0,
                completed: row.completed || null,
                isFloated: !!row.is_floated,
                type: row.type || null,
                lockedBySession: row.locked_by_session || null,
                lockedByName: row.locked_by_name || null,
                lockedAt: row.locked_at || null,
                rev: row.rev,
                cuezItemUid: row.cuez_item_uid || null,
                cuezSentAt: row.cuez_sent_at || null,
                cuezSentRev: row.cuez_sent_rev ?? null,
                cuezItemNumber: row.cuez_item_number || null,
                cuezPendingUid: row.cuez_pending_uid || null,
                brief: row.brief || '',
                pitchId: row.pitch_id || null,
                pitchedBy: row.pitched_by || '',
            };
        }
        const STORY_FIELD_MAP = {
            slug: 'slug', script: 'script', format: 'format',
            presenter: 'presenter', reporter: 'reporter',
            duration: 'duration', completed: 'completed',
            isFloated: 'is_floated', type: 'type',
            lockedBySession: 'locked_by_session', lockedByName: 'locked_by_name',
            lockedAt: 'locked_at', rev: 'rev',
            cuezItemUid: 'cuez_item_uid', cuezSentAt: 'cuez_sent_at', cuezSentRev: 'cuez_sent_rev', cuezItemNumber: 'cuez_item_number',
            cuezPendingUid: 'cuez_pending_uid', cuezPendingAt: 'cuez_pending_at', cuezPendingRev: 'cuez_pending_rev', cuezPendingPlan: 'cuez_pending_plan',
        };
        function storyToRow(data) {
            const row = {};
            for (const [k, v] of Object.entries(data)) if (STORY_FIELD_MAP[k]) row[STORY_FIELD_MAP[k]] = v;
            return row;
        }

        const DB_SUPABASE = {
            // Prime with a select (Realtime only carries future changes), then subscribe.
            subscribe: (onBulletin, onStories, onPitches) => {
                const bulletinId = state.currentBulletinId;
                (async () => {
                    try {
                        const { data, error } = await supabase.from('bulletins').select('*').eq('id', bulletinId).maybeSingle();
                        if (error) throw error;
                        onBulletin(data ? bulletinFromRow(data) : null);
                    } catch (e) { onBulletin(null, e); }
                    refreshPitches();
                    try {
                        const { data, error } = await supabase.from('stories').select('*').eq('bulletin_id', bulletinId);
                        if (error) throw error;
                        onStories((data || []).map(row => ({ type: 'added', id: row.id, data: storyFromRow(row) })));
                    } catch (e) { onStories([], e); }
                })();

                const bulletinChannel = supabase
                    .channel(`bulletin-${bulletinId}`)
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'bulletins', filter: `id=eq.${bulletinId}` }, payload => {
                        if (payload.eventType === 'DELETE') { onBulletin(null); return; }
                        onBulletin(bulletinFromRow(payload.new));
                    })
                    .subscribe();

                const storiesChannel = supabase
                    .channel(`stories-${bulletinId}`)
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'stories', filter: `bulletin_id=eq.${bulletinId}` }, payload => {
                        if (payload.eventType === 'DELETE') {
                            onStories([{ type: 'removed', id: payload.old.id, data: null }]);
                        } else {
                            onStories([{ type: payload.eventType === 'INSERT' ? 'added' : 'modified', id: payload.new.id, data: storyFromRow(payload.new) }]);
                        }
                    })
                    .subscribe();

                const pitchesChannel = supabase
                    .channel(`pitches-${bulletinId}`)
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'pitches', filter: `bulletin_id=eq.${bulletinId}` }, payload => {
                        if (payload.eventType === 'DELETE') onPitches([{ type: 'removed', id: payload.old.id }]);
                        else onPitches([{ type: 'modified', id: payload.new.id, data: pitchFromRow(payload.new) }]);
                    })
                    .subscribe();

                return () => {
                    supabase.removeChannel(bulletinChannel);
                    supabase.removeChannel(storiesChannel);
                    supabase.removeChannel(pitchesChannel);
                };
            },

            loadPitches: async (bulletinId, conferenceId) => {
                if (!conferenceId) return [];
                const { data, error } = await supabase.from('pitches').select('*')
                    .eq('bulletin_id', bulletinId).eq('conference_id', conferenceId);
                if (error) throw error;
                return (data || []).map(pitchFromRow);
            },

            // Conference actions all go through database functions that check
            // membership and who the producer is. Returns the function's result.
            pitchAction: async (fn, args) => {
                const { data, error } = await supabase.rpc(fn, args);
                if (error) throw error;
                return data;
            },

            updateBulletin: async (updates) => {
                const { error } = await supabase.from('bulletins')
                    .update({ ...bulletinToRow(updates), updated_at: new Date().toISOString() })
                    .eq('id', state.currentBulletinId);
                if (error) throw error;
            },

            // Atomic move in the database; returns the resulting order.
            moveStory: async (storyId, beforeId) => {
                const { data, error } = await supabase.rpc('move_story', {
                    p_bulletin_id: state.currentBulletinId, p_story_id: storyId, p_before_id: beforeId,
                });
                if (error) throw error;
                return data;
            },

            // Story rows can't be written directly: every change goes through a
            // database function that checks membership, locks and revisions.
            setStoryStatus: async (id, completed) => {
                const { error } = await supabase.rpc('set_story_status', { p_story_id: id, p_completed: completed });
                if (error) throw error;
            },

            setStoryFloated: async (id, floated) => {
                const { error } = await supabase.rpc('set_story_floated', { p_story_id: id, p_floated: floated });
                if (error) throw error;
            },

            markNotSent: async (id) => {
                const { error } = await supabase.rpc('mark_story_not_sent', { p_story_id: id });
                if (error) throw error;
            },

            createStory: async (id, storyData) => {
                const { error } = await supabase.rpc('create_story', {
                    p_bulletin_id: state.currentBulletinId, p_story_id: id, p_story: storyToRow(storyData),
                });
                if (error) throw error;
            },

            deleteStory: async (id) => {
                const { error } = await supabase.rpc('delete_story', { p_bulletin_id: state.currentBulletinId, p_story_id: id });
                if (error) throw error;
            },

            // Restores the server's own copy of the deleted story.
            restoreStory: async (id, insertAt) => {
                const { error } = await supabase.rpc('restore_story', {
                    p_bulletin_id: state.currentBulletinId, p_story_id: id, p_insert_at: insertAt,
                });
                if (error) throw error;
            },

            // Returns 'conflict' if the server rev has moved on, 'ok' otherwise.
            saveStory: async (id, data) => {
                const { rev: expectedRev, ...rest } = data;
                const { data: result, error } = await supabase.rpc('save_story', {
                    p_story_id: id, p_data: storyToRow(rest), p_expected_rev: expectedRev,
                });
                if (error) throw error;
                if (result && result.status === 'conflict') {
                    state.ui.pendingConflict = { storyId: id, serverData: storyFromRow(result.server), localData: data };
                    return 'conflict';
                }
                return 'ok';
            },

            // Lock times come from the database clock, not the browser's.
            lockStory: async (id, sessionId, userName) => {
                const { error } = await supabase.rpc('lock_story', {
                    p_story_id: id, p_session_id: sessionId, p_user_name: userName,
                });
                if (error) throw error;
            },

            // Returns false if this tab no longer holds the lock.
            renewLock: async (id, sessionId) => {
                const { data, error } = await supabase.rpc('renew_lock', { p_story_id: id, p_session_id: sessionId });
                if (error) throw error;
                return data !== false;
            },

            unlockStory: async (id, sessionId) => {
                const { error } = await supabase.rpc('unlock_story', { p_story_id: id, p_session_id: sessionId });
                if (error) throw error;
            },

            saveSlug: async (id, slug, sessionId) => {
                const { error } = await supabase.rpc('save_slug', { p_story_id: id, p_slug: slug, p_session_id: sessionId });
                if (error) throw error;
            },

            takeLock: async (id, sessionId, userName) => {
                const { error } = await supabase.rpc('take_lock', {
                    p_story_id: id, p_session_id: sessionId, p_user_name: userName,
                });
                if (error) throw error;
            },

            errorMessage: (e) => {
                if (!e) return 'Unknown database error';
                const code = e.code || '';
                const msg = e.message || '';
                if (code === '42501' || code === 'PGRST301') return 'Permission denied: check your Supabase Row Level Security policies';
                if (code === '23505')                        return 'Duplicate record: refresh and try again';
                if (code === '23503' || code === 'PGRST116') return 'Record not found: it may have been deleted by someone else';
                if (code === '57014')                        return 'Database timeout: check your connection and try again';
                if (/JWT|not authenticated|401/i.test(msg))  return 'Not authenticated: try reloading the page';
                if (/fetch|network/i.test(msg))              return 'Could not reach Supabase: check your internet connection';
                return msg || 'Database write failed';
            },
        };

        let DB = DB_NULL;

        // Calls the send-to-cuez Edge Function. Non-2xx responses carry the
        // function's JSON on error.context, which is where the useful message is.
        async function callCuezFunction(body) {
            if (!supabase) throw new Error('Cuez needs a Supabase connection.');
            const { data, error } = await supabase.functions.invoke(CUEZ_FUNCTION, { body });
            if (error) {
                let detail = null;
                try { detail = await error.context.json(); } catch { /* not JSON */ }
                const err = new Error(detail?.message || error.message || 'The send-to-cuez function failed.');
                err.detail = detail;
                throw err;
            }
            return data;
        }

        // ==========================================
        // 7. MUTATORS
        // ==========================================
        async function lockStory(id) {
            if (!canMutate()) return;
            const userName = getMyName();
            const now = Date.now();
            const existing = state.storiesMap[id];
            // Don't overwrite a fresh lock held by someone else: the banner needs it.
            const heldByOther = existing?.lockedBySession && existing.lockedBySession !== state.sessionId &&
                existing.lockedAt && (now - existing.lockedAt <= STALE_LOCK_MS);
            if (!heldByOther && existing) {
                existing.lockedBySession = state.sessionId;
                existing.lockedByName = userName;
                existing.lockedAt = now;
            }
            render('main', 'modal');
            try { await DB.lockStory(id, state.sessionId, userName); }
            catch (e) { console.error('Lock failed', e); }
        }

        async function unlockStory(id) {
            if (!canMutate()) return;
            const story = state.storiesMap[id];
            if (!story || story.lockedBySession !== state.sessionId) return;
            story.lockedBySession = null;
            story.lockedByName = null;
            story.lockedAt = null;
            render('main', 'modal');
            try { await DB.unlockStory(id, state.sessionId); }
            catch (e) { console.error('Unlock failed', e); }
        }

        // Saves an edit. Nothing changes locally, and the editor stays open with
        // the draft intact, until the database confirms. A failed save leaves the
        // draft in place to retry. Returns 'ok', 'conflict' or 'error'.
        async function saveStory(id, newData) {
            if (!canMutate() || state.ui.saving) return 'error';
            const expectedRev = newData.rev;
            // Take the revert copy now, before awaiting: Realtime can deliver the
            // saved row before the save call returns, and a copy taken after that
            // would already hold the new text. Kept only if the save succeeds.
            const previous = state.storiesMap[id] ? { ...state.storiesMap[id] } : null;
            state.ui.saving = true;
            setSaveBusy(true);
            let result;
            try {
                result = await DB.saveStory(id, { ...newData, rev: expectedRev });
            } catch (e) {
                state.ui.saving = false;
                setSaveBusy(false, `Not saved: ${DB.errorMessage(e)}. Your changes are still here: try again.`);
                if (state.ui.editingStoryId === id) startLockRefresh(id); // keep holding the story while they retry
                return 'error';
            }
            state.ui.saving = false;
            if (result === 'conflict') { stopLockRefresh(); render('modal'); return 'conflict'; }

            if (previous && previous.rev === expectedRev) state.ui.storySnapshots[id] = previous;
            state.storiesMap[id] = { ...(state.storiesMap[id] || previous), ...newData, rev: expectedRev + 1, lockedBySession: null, lockedByName: null, lockedAt: null };
            if (state.ui.editingStoryId === id) { state.ui.editingStoryId = null; stopLockRefresh(); }
            render('main', 'modal');
            return 'ok';
        }

        // Save button state and error line, set directly so the draft isn't redrawn.
        function setSaveBusy(busy, error = '') {
            const btn = document.querySelector('#modal-container [data-action="save-edit"]');
            if (btn) { btn.disabled = busy; btn.textContent = busy ? 'Saving…' : (btn.dataset.label || 'Save'); }
            const box = document.getElementById('edit-save-error');
            if (box) { box.textContent = error; box.style.display = error ? '' : 'none'; }
        }

        async function toggleStoryComplete(id) {
            if (!canMutate() || !state.storiesMap[id]) return;
            const current = state.storiesMap[id].completed;
            const nextState = !current ? 'needs-checking'
                : current === 'needs-checking' ? 'checked-ok'
                : current === 'checked-ok' ? 'checked-needs-work'
                : null;
            state.storiesMap[id].completed = nextState;
            render('main');
            try { await DB.setStoryStatus(id, nextState); }
            catch (e) { showError('Status not saved: ' + DB.errorMessage(e)); }
        }

        // Optimistic locally; the database does the move atomically and returns
        // the true order (which may include others' concurrent changes).
        async function reorderStory(draggedId, targetId) {
            if (!canMutate()) return;
            const o = state.meta.order.filter(id => id !== draggedId);
            const idx = targetId ? o.indexOf(targetId) : -1;
            o.splice(idx !== -1 ? idx : o.length, 0, draggedId);
            state.meta.order = o;
            render('main');
            try {
                const order = await DB.moveStory(draggedId, targetId && targetId !== 'end-of-list' ? targetId : null);
                if (Array.isArray(order)) { state.meta.order = order; render('main'); }
            } catch (e) { showError('Reorder failed: ' + DB.errorMessage(e)); }
        }

        async function updateFormats(formats) {
            if (!canMutate()) return;
            state.meta.formats = formats;
            render('main', 'modal');
            try { await DB.updateBulletin({ formats }); }
            catch (e) { showError('Formats not saved: ' + DB.errorMessage(e)); }
        }

        async function updateTargetDuration(seconds) {
            if (!canMutate()) return;
            state.meta.targetDuration = seconds;
            render('main');
            try { await DB.updateBulletin({ targetDuration: seconds }); }
            catch (e) { showError('Target duration not saved: ' + DB.errorMessage(e)); }
        }

        function blankStory(extra = {}) {
            return {
                bulletinId: state.currentBulletinId,
                slug: 'NEW STORY', script: '',
                format: (state.meta.formats?.[0]) || 'READ',
                presenter: '', reporter: '',
                duration: 10, isFloated: false, completed: null, type: null,
                lockedBySession: null, lockedByName: null, lockedAt: null, rev: 1,
                cuezItemUid: null, cuezSentAt: null, cuezSentRev: null, cuezItemNumber: null,
                ...extra,
            };
        }

        async function addStory() {
            if (!canMutate() || !state.currentBulletinId) return;
            const newId = crypto.randomUUID();
            const newStory = blankStory();
            state.storiesMap[newId] = newStory;
            insertStoryIntoOrder(newId);
            state.ui.pendingScrollToStoryId = newId;
            render('main');
            try { await DB.createStory(newId, newStory); }
            catch (e) { showError('Could not save new story: ' + DB.errorMessage(e)); }
        }

        // Segments are dividers: they count toward TRT but are never sent to Cuez.
        async function addSegment() {
            if (!canMutate() || !state.currentBulletinId) return;
            const newId = crypto.randomUUID();
            const newStory = blankStory({ type: 'segment', slug: 'BREAK', duration: 0, format: '' });
            state.storiesMap[newId] = newStory;
            insertStoryIntoOrder(newId);
            state.ui.pendingScrollToStoryId = newId;
            render('main');
            try { await DB.createStory(newId, newStory); }
            catch (e) { showError('Could not save new segment: ' + DB.errorMessage(e)); }
        }

        async function toggleFloat(id) {
            if (!canMutate() || !state.storiesMap[id]) return;
            const next = !state.storiesMap[id].isFloated;
            state.storiesMap[id].isFloated = next;
            render('main');
            try { await DB.setStoryFloated(id, next); }
            catch (e) { showError('Float not saved: ' + DB.errorMessage(e)); }
        }

        async function deleteStory(id) {
            if (!canMutate()) return;
            const story = state.storiesMap[id];
            if (!story) return;
            const warning = story.cuezItemUid
                ? `Delete "${story.slug}"?\n\nIt's already in Cuez, and deleting it here won't remove it there.`
                : `Delete "${story.slug}"?`;
            if (!await confirmAction(warning, { title: 'Delete story', confirmLabel: 'Delete story', danger: true })) return;
            const orderIndex = state.meta.order.indexOf(id);
            state.ui.trash.unshift({ id, story: { ...story }, orderIndex, deletedAt: Date.now() });
            delete state.storiesMap[id];
            state.meta.order = state.meta.order.filter(i => i !== id);
            render('main');
            try { await DB.deleteStory(id); }
            catch (e) { showError('Could not delete story: ' + DB.errorMessage(e)); }
        }

        function prunePitchTrash() {
            state.ui.trash = state.ui.trash.filter(entry => {
                const pitch = state.pitchesMap[entry.story.pitchId];
                return !pitch || (pitch.status === 'picked' && pitch.storyId === entry.id);
            });
        }

        async function rescueStory(id) {
            if (!canMutate()) return;
            const entry = state.ui.trash.find(t => t.id === id);
            if (!entry || entry.restoring) return;
            const bulletinId = state.currentBulletinId;
            const localMode = state.localMode;
            const insertAt = Math.min(entry.orderIndex, state.meta.order.length);
            entry.restoring = true;
            render('main');
            try {
                await DB.restoreStory(id, insertAt);
                if (bulletinId !== state.currentBulletinId || localMode !== state.localMode) return;
                state.ui.trash = state.ui.trash.filter(t => t !== entry);
                // Connected desks receive the authoritative row and order via
                // Realtime. Never insert a stale browser copy after an RPC.
                if (localMode) {
                    state.storiesMap[id] = { ...entry.story, lockedBySession: null, lockedByName: null, lockedAt: null };
                    state.meta.order = state.meta.order.filter(storyId => storyId !== id);
                    state.meta.order.splice(insertAt, 0, id);
                }
            } catch (e) {
                if (bulletinId !== state.currentBulletinId || localMode !== state.localMode) return;
                if (e.message === 'That story can no longer be restored.') {
                    state.ui.trash = state.ui.trash.filter(t => t !== entry);
                }
                showError('Could not restore story: ' + DB.errorMessage(e));
            } finally {
                entry.restoring = false;
                if (bulletinId === state.currentBulletinId && localMode === state.localMode) render('main');
            }
        }

        async function revertStory(id) {
            const snapshot = state.ui.storySnapshots[id];
            if (!snapshot) return;
            if (!await confirmAction(`Revert "${state.storiesMap[id]?.slug || id}" to its previous version?`, { title: 'Revert story', confirmLabel: 'Revert story' })) return;
            delete state.ui.storySnapshots[id];
            const { slug, script, format, presenter, reporter, duration, type } = snapshot;
            stopLockRefresh();
            await saveStory(id, { slug, script, format, presenter, reporter, duration, type, rev: state.storiesMap[id]?.rev });
        }

        // ── Cuez ───────────────────────────────────────────────────────────

        // Clears a story's Cuez link so it will be sent again. The old Cuez item stays.
        async function unlinkFromCuez(id) {
            const story = state.storiesMap[id];
            if (!(story?.cuezItemUid || story?.cuezPendingUid) || !canMutate()) return;
            if (!await confirmAction(`Mark "${story.slug}" as not sent?\n\nThe item already in Cuez stays there. Sending again adds a second copy, so delete the old one in Cuez first if you're replacing it.`, { title: 'Mark as not sent', confirmLabel: 'Mark as not sent' })) return;
            story.cuezItemUid = null; story.cuezSentAt = null; story.cuezSentRev = null; story.cuezItemNumber = null; story.cuezPendingUid = null;
            render('main');
            try { await DB.markNotSent(id); }
            catch (e) { showError('Could not update the story: ' + DB.errorMessage(e)); }
        }

        async function sendToCuez() {
            if (!canMutate()) return;
            if (state.localMode) { showError('Sending to Cuez needs a Supabase connection.'); return; }
            if (!state.meta.cuezEpisodeId || !state.meta.cuezPartUid) { showNotice('Cuez', 'This newsroom has no Cuez target yet. Ask your tutor to set one.', 'warn'); return; }
            if (state.ui.cuezSending || cuezSendInProgress()) return;
            if (hasProducer() && !isProducer()) { showNotice('Cuez', `Only the producer (${state.meta.producerName || 'someone else'}) can send the bulletin to Cuez.`, 'warn'); return; }

            const pending = cuezPendingIds();
            if (!pending.length) { showNotice('Cuez', 'Nothing new to send: every story above the line is already in Cuez.'); return; }

            const stories = pending.map(id => state.storiesMap[id]);
            const unchecked = stories.filter(s => s.completed !== 'checked-ok').length;
            const beingEdited = stories.filter(s => isLockedByOther(s)).length;
            const lines = [`Send ${pending.length} ${pending.length === 1 ? 'story' : 'stories'} to Cuez?`, '', `→ ${cuezTargetLabel()}`];
            if (unchecked) lines.push('', `${unchecked} ${unchecked === 1 ? "isn't" : "aren't"} marked Checked OK.`);
            if (beingEdited) lines.push('', `${beingEdited} ${beingEdited === 1 ? 'is' : 'are'} being edited right now: the last saved version will be sent.`);
            if (!await confirmAction(lines.join('\n'), { title: 'Send to Cuez', confirmLabel: 'Send to Cuez' })) return;
            if (!canMutate() || state.ui.cuezSending || cuezSendInProgress()) return;

            state.ui.cuezSending = true;
            render('main');
            try {
                const data = await callCuezFunction({ action: 'send-bulletin', bulletinId: state.currentBulletinId });
                const missing = data.missingInCuez || [];
                showNotice((data.held || []).length ? 'Sent, with some held back' : 'Sent to Cuez', data.message || 'Done.', (data.held || []).length ? 'warn' : 'ok');
                if (missing.length) {
                    showNotice('Check Cuez', `${missing.length} sent ${missing.length === 1 ? 'story is' : 'stories are'} no longer in that part: ${missing.map(m => m.slug).join(', ')}. Use the badge to mark them as not sent if they should go again.`, 'warn');
                }
            } catch (e) {
                const d = e.detail;
                let msg = e.message;
                if (d?.failedEvents?.length) msg += `\nRejected: ${d.failedEvents.join(', ')}`;
                showError(msg);
            } finally {
                state.ui.cuezSending = false;
                render('main');
            }
        }

        // ── News conference ───────────────────────────────────────────────
        // Anyone in the newsroom can pitch; the producer (whoever drew the queen
        // and claimed the role) picks and spikes. The database enforces who may
        // do what, so these just call it and show what comes back.

        function isProducer() { return !state.localMode && !!supabaseUser && state.meta.producerUser === supabaseUser.id; }
        function hasProducer() { return !!state.meta.producerUser; }
        function currentPitches() {
            return Object.values(state.pitchesMap)
                .filter(p => p.conferenceId && p.conferenceId === state.meta.conferenceId)
                .sort((a, b) => a.position - b.position);
        }
        function canEditPitch(p) { return p.status === 'pitched' && (isProducer() || (!!supabaseUser && p.createdBy === supabaseUser.id)); }

        async function conferenceAction(fn, args) {
            if (!canMutate() || state.localMode || state.ui.pitchBusy) return null;
            state.ui.pitchBusy = true;
            render('main');
            try {
                const result = await DB.pitchAction(fn, args);
                return result ?? true;
            } catch (e) {
                showError(DB.errorMessage(e));
                return null;
            } finally {
                state.ui.pitchBusy = false;
                await refreshPitches();
                render('main');
            }
        }

        async function claimProducer() {
            if (!await ensureMyName()) return;
            const ok = await conferenceAction('claim_producer', { p_bulletin_id: state.currentBulletinId, p_name: getMyName() });
            if (ok) {
                Object.assign(state.meta, { producerUser: supabaseUser.id, producerName: getMyName() });
                render('header', 'main');
                showNotice('Producer', "You're producer: you pick the stories, and you send the bulletin to Cuez.");
            }
        }

        async function releaseProducer() {
            if (!await confirmAction("Step down as producer? Someone else can then claim the role.", { title: 'Step down as producer', confirmLabel: 'Step down' })) return;
            const ok = await conferenceAction('release_producer', { p_bulletin_id: state.currentBulletinId });
            if (ok) { Object.assign(state.meta, { producerUser: null, producerName: null }); render('header', 'main'); }
        }

        async function addPitch() {
            const slugEl = document.getElementById('pitch-new-slug');
            const slug = slugEl?.value.trim() || '';
            if (!slug) { slugEl?.focus(); return; }
            if (!await ensureMyName()) return;
            const angleEl = document.getElementById('pitch-new-angle');
            const ok = await conferenceAction('add_pitch', {
                p_bulletin_id: state.currentBulletinId,
                p_slug: slug,
                p_angle: angleEl?.value || '',
                p_format: '',
                p_pitched_by: document.getElementById('pitch-new-by')?.value.trim() || '',
            });
            if (ok) {
                // Ready for the next pitch: keep "pitched by", clear the rest.
                const s = document.getElementById('pitch-new-slug'), a = document.getElementById('pitch-new-angle');
                if (s) s.value = ''; if (a) a.value = '';
                s?.focus();
            }
        }

        async function savePitchEdit(id) {
            const v = (k) => document.getElementById(`pitch-edit-${k}-${id}`)?.value ?? '';
            if (!v('slug').trim()) { document.getElementById(`pitch-edit-slug-${id}`)?.focus(); return; }
            const ok = await conferenceAction('update_pitch', {
                p_pitch_id: id, p_slug: v('slug'), p_angle: v('angle'), p_format: state.pitchesMap[id]?.format || '', p_pitched_by: v('by'),
            });
            if (ok) { state.ui.editingPitchId = null; render('main'); }
        }

        async function spikePitch(id) {
            const p = state.pitchesMap[id];
            const reason = await deskDialog({ title: 'Spike pitch', message: `Spike "${p?.slug || 'this pitch'}"? The pitch and your reason will be kept on the record.`,
                confirmLabel: 'Spike pitch', input: { label: 'Reason (optional)', value: p?.spikeReason || '', multiline: true, maxLength: 300 } });
            if (reason === null) return;
            await conferenceAction('spike_pitch', { p_pitch_id: id, p_reason: reason });
        }

        async function unpickPitch(id) {
            const p = state.pitchesMap[id];
            if (!await confirmAction(`Drop "${p?.slug || 'this story'}" from the running order and put it back with the pitches? A story still in the running order can only be dropped while nobody has written it or is editing it. If it was already deleted, dropping it also removes its Rescue option and any script saved in that deleted copy.`, { title: 'Return to pitches', confirmLabel: 'Return to pitches' })) return;
            const ok = await conferenceAction('unpick_pitch', { p_pitch_id: id });
            if (ok && p?.storyId) {
                state.ui.trash = state.ui.trash.filter(t => t.id !== p.storyId);
                render('main');
            }
        }

        async function deletePitch(id) {
            const p = state.pitchesMap[id];
            if (!await confirmAction(`Remove the pitch "${p?.slug || ''}"? Use Spike instead if you want it kept on the record.`, { title: 'Remove pitch', confirmLabel: 'Remove pitch', danger: true })) return;
            await conferenceAction('delete_pitch', { p_pitch_id: id });
        }

        // The producer decides the coverage once a story is picked.
        async function setPickedFormat(storyId, format) {
            const story = state.storiesMap[storyId];
            if (!story || story.format === format) return;
            const before = story.format;
            story.format = format;
            const ok = await conferenceAction('set_story_format', { p_story_id: storyId, p_format: format });
            if (!ok && state.storiesMap[storyId]) { state.storiesMap[storyId].format = before; render('main'); }
        }

        async function setPickedReporter(storyId, value) {
            if (!isProducer() || !canMutate() || state.ui.pitchBusy) return;
            const story = state.storiesMap[storyId];
            const reporter = value.trim();
            if (!story || story.reporter === reporter) return;
            const before = story.reporter;
            story.reporter = reporter;
            const ok = await conferenceAction('set_story_reporter', { p_story_id: storyId, p_reporter: reporter });
            // A newer server row may have arrived while this request was pending.
            if (!ok && state.storiesMap[storyId] === story) story.reporter = before;
            render('main');
        }

        // Sign out of this browser: first give up the producer role and any
        // editing locks (in every newsroom), then end the session and clear
        // what this browser remembers. Getting back in needs the code again.
        async function signOutBrowser() {
            if (state.signingOut || state.localMode || !supabaseUser || !supabase) return;
            if (state.ui.saving || state.ui.pitchBusy || state.ui.cuezSending || state.ui.join?.busy) {
                showNotice('Please wait', 'Let the current save or send finish before signing out.', 'warn');
                return;
            }
            const lines = ['Sign out of Moira:Desk on this browser?', '',
                `You'll need the newsroom code to get back in${state.rooms.length ? ` to ${state.rooms.map(r => r.name).join(', ')}` : ''}.`];
            lines.push('', "Any producer roles and editing locks held by this browser will be released, including in other tabs.");
            lines.push('', "Any unsaved work in this browser's tabs will be lost.");
            if (state.ui.signOutConfirming) return;
            state.ui.signOutConfirming = true;
            let confirmed;
            try { confirmed = await confirmAction(lines.join('\n'), { title: 'Sign out', confirmLabel: 'Sign out' }); }
            finally { state.ui.signOutConfirming = false; }
            if (!confirmed || state.signingOut || !supabaseUser) return;
            if (state.ui.saving || state.ui.pitchBusy || state.ui.cuezSending || state.ui.join?.busy) {
                showNotice('Please wait', 'Let the current save or send finish before signing out.', 'warn'); return;
            }
            state.signingOut = true;
            stopLockRefresh();
            render('header');
            try {
                // Use the existing, permission-checked RPCs; no schema upgrade is needed.
                const [rooms, locks] = await Promise.all([
                    supabase.from('bulletins').select('id').eq('producer_user', supabaseUser.id),
                    supabase.from('stories').select('id, locked_by_session').eq('locked_by_user', supabaseUser.id),
                ]);
                if (rooms.error) throw rooms.error;
                if (locks.error) throw locks.error;
                for (const story of locks.data || []) {
                    const { error } = await supabase.rpc('unlock_story', { p_story_id: story.id, p_session_id: story.locked_by_session });
                    if (error) throw error;
                }
                for (const room of rooms.data || []) {
                    const { error } = await supabase.rpc('release_producer', { p_bulletin_id: room.id });
                    if (error) throw error;
                }
                const { error } = await supabase.auth.signOut({ scope: 'local' });
                if (error) throw error;
                supabaseUser = null;
                state.ui.editingStoryId = null;
                if (unsubAll) { unsubAll(); unsubAll = null; }
                Object.keys(localStorage).filter(k => k.startsWith('moiradesk_')).forEach(k => localStorage.removeItem(k));
                location.reload();
            } catch (e) {
                state.signingOut = false;
                if (supabaseUser && state.ui.editingStoryId) startLockRefresh(state.ui.editingStoryId);
                render('header');
                showError(`Could not finish signing out: ${e.message || 'Please try again.'} Any unsaved text is still on this page. Producer roles or locks may already have been released.`);
            }
        }

        function showView(view) {
            state.ui.view = view === 'conference' ? 'conference' : 'rundown';
            lsSet(LS.view, state.ui.view);
            render('main');
        }

        // ==========================================
        // 8. HELPERS
        // ==========================================
        // Native <dialog> supplies focus trapping and Escape; its content is ours.
        // Keep it separate from renderModals so background updates cannot erase it.
        let activeDeskDialog = null;
        const deferredDialogRender = new Set();
        function deskDialog({ title, message, confirmLabel = 'Continue', danger = false, input = null }) {
            if (activeDeskDialog) return Promise.resolve(null);
            const previousFocus = document.activeElement;
            const roomId = state.currentBulletinId, userId = supabaseUser?.id;
            const dialog = document.createElement('dialog');
            dialog.className = 'desk-dialog';
            dialog.setAttribute('aria-labelledby', 'desk-dialog-title');
            dialog.setAttribute('aria-describedby', 'desk-dialog-message');
            const field = input ? `<div><label for="desk-dialog-input">${escapeHTML(input.label)}</label>
                ${input.multiline ? '<textarea id="desk-dialog-input"></textarea>' : '<input id="desk-dialog-input" type="text" autocomplete="name">'}
                <div class="desk-dialog-count"></div><div class="desk-dialog-error" role="alert" hidden></div></div>` : '';
            dialog.innerHTML = `<form novalidate>
                <div class="desk-dialog-head"><h2 id="desk-dialog-title">${escapeHTML(title)}</h2><button type="button" class="desk-dialog-close" data-dialog-cancel aria-label="Close">×</button></div>
                <div class="desk-dialog-body"><p class="desk-dialog-message" id="desk-dialog-message">${escapeHTML(message)}</p>${field}</div>
                <div class="desk-dialog-foot"><button type="button" data-dialog-cancel>Cancel</button><button type="submit" class="desk-dialog-submit${danger ? ' danger' : ''}">${escapeHTML(confirmLabel)}</button></div>
            </form>`;
            activeDeskDialog = dialog;
            (document.fullscreenElement || document.body).appendChild(dialog);
            return new Promise(resolve => {
                let finished = false;
                const finish = value => {
                    if (finished) return;
                    finished = true;
                    if (roomId !== state.currentBulletinId || userId !== supabaseUser?.id) value = null;
                    dialog.close(); dialog.remove(); activeDeskDialog = null;
                    if (previousFocus?.isConnected) previousFocus.focus();
                    // An unchanged editor underneath may contain unsaved text,
                    // even when a toolbar button had focus before this dialog.
                    if (modalKey() === _renderedModalKey) deferredDialogRender.delete('modal');
                    if (deferredDialogRender.size) { render(...deferredDialogRender); deferredDialogRender.clear(); }
                    resolve(value);
                };
                const field = dialog.querySelector('#desk-dialog-input');
                if (field) {
                    field.value = input.value || '';
                    field.maxLength = input.maxLength || 300;
                    const count = () => { dialog.querySelector('.desk-dialog-count').textContent = `${field.value.length}/${field.maxLength}`; };
                    field.addEventListener('input', () => { count(); dialog.querySelector('.desk-dialog-error').hidden = true; });
                    count();
                }
                dialog.querySelectorAll('[data-dialog-cancel]').forEach(b => b.addEventListener('click', () => finish(null)));
                dialog.addEventListener('cancel', e => { e.preventDefault(); finish(null); });
                dialog.addEventListener('keydown', e => e.stopPropagation());
                dialog.querySelector('form').addEventListener('submit', e => {
                    e.preventDefault(); e.stopPropagation();
                    if (field && input.required && !field.value.trim()) {
                        const error = dialog.querySelector('.desk-dialog-error');
                        error.textContent = 'Please enter your name.'; error.hidden = false; field.focus(); return;
                    }
                    finish(field ? field.value : true);
                });
                dialog.showModal();
                (field || dialog.querySelector('[data-dialog-cancel]:not(.desk-dialog-close)')).focus();
            });
        }
        async function confirmAction(message, options = {}) {
            return (await deskDialog({ title: 'Please confirm', message, ...options })) === true;
        }
        function askName(value = '') {
            return deskDialog({ title: 'Your name', message: 'This helps others see who is editing a story.', confirmLabel: 'Save name',
                input: { label: 'Name', value, maxLength: 40, required: true } });
        }

        function getMyName() { return state.myName || 'Someone'; }

        // Asks once per browser; the name appears on edit locks.
        async function ensureMyName() {
            if (state.myName) return true;
            const name = (await askName() || '').trim().slice(0, 40);
            if (!name) return false;
            state.myName = name;
            lsSet(LS.name, name);
            render('header');
            return true;
        }

        // 'free'      unlocked, stale, or locked by this tab
        // 'elsewhere' locked by you in another tab or an earlier page load
        // 'other'     locked by someone else
        function lockState(story) {
            if (!story?.lockedBySession || story.lockedBySession === state.sessionId) return 'free';
