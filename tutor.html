<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Moira:Desk Tutor</title>
<!-- The only external script: pinned, with an integrity check, so a changed file is refused. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
        integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"
        crossorigin="anonymous"></script>
<!-- The EP wall, bulletin totals and report page, shared with the admin desk. -->
<script src="desk-shared.js"></script>
<style>
  :root {
    --bg: #f1f3f6; --panel: #fff; --ink: #1b1f27; --muted: #667085; --line: #dfe3ea;
    --accent: #2457d6; --accent-ink: #fff; --ok: #18794e; --ok-bg: #e7f6ee; --warn: #9a5b00; --warn-bg: #fff4e0;
    --err: #b42318; --err-bg: #fdecea; --chip: #eef1f6; --code-bg: #10141c; --code-ink: #f5f7fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --panel: #1b2029; --ink: #e8ebf1; --muted: #97a1b2; --line: #2c3340;
      --accent: #7aa2ff; --accent-ink: #0d1220; --ok: #5fd39a; --ok-bg: #12301f; --warn: #f0b45a; --warn-bg: #352610;
      --err: #ff8f84; --err-bg: #3a1714; --chip: #252b36; --code-bg: #0a0d12; --code-ink: #f5f7fb;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; }
  header h1 span { color: var(--accent); }
  header .spacer { flex: 1; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 130px; display: grid; gap: 16px; }
  main > * { min-width: 0; }
  .card { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  input[type=text], input[type=search], input[type=email], input[type=password] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 6px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { filter: brightness(0.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.danger { color: var(--err); }
  button.small { padding: 4px 8px; font-size: 13px; }
  a.btn { display: inline-block; font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 6px; padding: 7px 12px; text-decoration: none; white-space: nowrap; }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .msg { border-radius: 6px; padding: 8px 10px; font-size: 14px; margin-top: 10px; }
  .msg.err { background: var(--err-bg); color: var(--err); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .muted { color: var(--muted); }
  .login { max-width: 380px; margin: 10vh auto; }
  .login .card { display: grid; gap: 12px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--panel); color: var(--ink); width: min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(10, 14, 20, .55); }
  dialog .head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  dialog .head h3 { margin: 0; font-size: 17px; }
  dialog .body { padding: 18px; display: grid; gap: 12px; }
  dialog .foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
  .code-big { background: var(--code-bg); color: var(--code-ink); font: 700 clamp(32px, 8vw, 56px)/1.1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; text-align: center; padding: 22px 10px; border-radius: 10px; }
  .fullscreen-code { position: fixed; inset: 0; background: var(--code-bg); color: var(--code-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; z-index: 100; cursor: pointer; text-align: center; padding: 20px; }
  .fullscreen-code .name { font-size: 4vw; font-weight: 700; opacity: .8; }
  .fullscreen-code .code { font: 700 13vw/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em; }
  .fullscreen-code .hint { font-size: 1.6vw; opacity: .6; }
  .part { width: 100%; text-align: left; display: block; padding: 10px 12px; }
  .part.selected { outline: 2px solid var(--accent); background: var(--panel); }
  .part .items { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--ink); }
  .check input { margin-top: 3px; }
  .crown { color: #c58a00; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .sub { color: var(--muted); font-size: 12px; }

  /* Newsroom page: toolbar, cards or list, and the selection bar */
  header .status { font-size: 13px; color: var(--muted); }
  header .status.err { color: var(--err); }
  .msg .msg-close { float: right; margin: -3px -4px 0 8px; background: transparent; border-color: transparent; color: inherit; }
  .rooms-head { display: flex; gap: 12px 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
  .rooms-head h2 { margin: 0 0 4px; }
  .rooms-head p { margin: 0; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar input[type=search] { width: 220px; flex: 1 1 180px; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
  .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
  .filter-note { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
  .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 14px; }
  .room-card { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; }
  .room-card.ticked { outline: 3px solid var(--accent); }
  .room-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; margin: 0; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); cursor: pointer; color: var(--ink); font-size: 15px; }
  .room-head input, .rl-sel input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); cursor: pointer; }
  .room-head input { grid-row: span 2; }
  .room-head .name { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
  .room-head .meta { color: var(--muted); font-size: 13px; }
  .room-body { flex: 1; padding: 12px 16px; display: grid; gap: 10px; align-content: start; }
  .stat { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; font-size: 14px; align-items: baseline; }
  .stat .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .confbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--chip); margin: 6px 0 5px; }
  .confbar .picked, .dot.picked { background: var(--ok); }
  .confbar .undecided, .dot.undecided { background: #8a94a6; }
  .confbar .spiked, .dot.spiked { background: var(--err); }
  .nw { white-space: nowrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .chk { display: inline-flex; align-items: center; gap: 5px; margin-right: 12px; white-space: nowrap; vertical-align: middle; }
  .chk:last-child { margin-right: 0; }
  .chk i { font-style: normal; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-size: 10px; font-weight: 800; color: var(--panel); }
  /* The same colours as the check dots on the student desk's running order. */
  .chk.ok i { background: #10b981; }
  .chk.work i { background: #ef4444; }
  .chk.todo i { background: #eab308; color: #1b1f27; }
  .chk.none i { background: #cbd5e1; color: #1b1f27; }
  .room-foot { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  .room-list-wrap { position: relative; overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .room-list { min-width: 1120px; }
  .rl-row { display: grid; grid-template-columns: 44px minmax(170px, 1.5fr) minmax(130px, 1fr) 120px 140px 200px 100px 270px; align-items: center; border-bottom: 1px solid var(--line); font-size: 14px; }
  .rl-row:last-child { border-bottom: 0; }
  .rl-row > * { min-width: 0; padding: 10px 8px; overflow-wrap: anywhere; }
  .rl-row.head > * { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .rl-row.ticked { background: color-mix(in srgb, var(--accent) 12%, var(--panel)); box-shadow: inset 3px 0 0 var(--accent); }
  .rl-row .rl-sel { align-self: stretch; padding: 0; }
  .rl-sel label { display: flex; height: 100%; align-items: center; justify-content: center; margin: 0; cursor: pointer; }
  .list-key { margin: 8px 2px 0; color: var(--muted); font-size: 13px; }
  .selbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: #161b24; color: #f5f7fb; border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0, 0, 0, .18); }
  .selbar:empty { display: none; }
  .selbar-in { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
  .selbar .hint { flex: 1 1 260px; color: #c3cad6; }
  .selbar .names { flex: 1 1 160px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c3cad6; }
  .selbar .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .selbar button { background: #2a3140; border-color: #3a4252; color: #f5f7fb; }
  .selbar button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* Review: read the running order and scripts, leave EP feedback */
  .review { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: flex; flex-direction: column; }
  .review-scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .review-page { max-width: 900px; margin: 0 auto; padding: 18px 16px 80px; display: grid; gap: 14px; }
  .review-page h2 { margin: 6px 0 0; }
  .review-story { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
  .review-story.dim { opacity: .75; }
  .review-story .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .review-story .num { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.5em; text-align: right; }
  .review-story .slug { font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
  .review-story .meta { color: var(--muted); font-size: 13px; }
  .review-script { white-space: pre-wrap; font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0; overflow-wrap: anywhere; }
  .review-seg { color: #4338ca; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; padding: 4px 2px 0; }
  .review-eop { background: var(--err); color: #fff; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; padding: 6px 10px; border-radius: 6px; }
  .fb-list { display: grid; gap: 8px; }
  .fb { background: var(--warn-bg); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; }
  .fb .by { font-size: 12px; font-weight: 700; color: var(--warn); display: flex; gap: 6px; align-items: center; }
  .fb .by .spacer { flex: 1; }
  .fb blockquote { margin: 0; padding-left: 10px; border-left: 3px solid var(--warn); color: var(--muted); font-style: italic; white-space: pre-wrap; }
  .fb .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .fb-dialog { width: min(640px, calc(100vw - 32px)); }
  .fb-dialog textarea { width: 100%; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; line-height: 1.5; }
  .fb-dialog textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fb-dialog .note-help { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>

<script>
const SUPABASE_URL = 'https://ushtoubwyopjdlogapew.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzaHRvdWJ3eW9wamRsb2dhcGV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0OTY3MzUsImV4cCI6MjEwODA3MjczNX0.qyukiNYqfnaOrnqGiL9mAGgmSmvBFKHe5YlzD59BFOA';
const TURNSTILE_SITE_KEY = '';

// This page uses only public browser configuration. All access is checked by
// the database against the signed-in staff account and newsroom assignments.
const configured = /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SUPABASE_URL) && !/YOUR-/.test(SUPABASE_ANON_KEY);
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storage: window.sessionStorage, storageKey: 'moiradesk-tutor-auth', persistSession: true, autoRefreshToken: true },
}) : null;
let savedView = 'cards';
try { if (sessionStorage.getItem('moiradesk-tutor-view') === 'list') savedView = 'list'; } catch {}
const state = { user: null, rooms: [], loading: false, loaded: false, loginBusy: false, loginEmail: '', loginError: null,
  message: null, selected: new Set(), reportScripts: false, reportIds: [], query: '', view: savedView,
  updated: null, refreshError: null, pollTimer: null, roomsSeq: 0, roomsInFlight: 0 };
const app = document.getElementById('app'), dlg = document.getElementById('dlg');
let sessionEpoch = 0;
const room = (id) => state.rooms.find(r => r.newsroom_id === id);
function flash(text, tone = 'ok') { state.message = { text, tone }; render(); }
const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
async function rpc(name, args) {
  const epoch = sessionEpoch;
  const { data, error } = await sb.rpc(name, args);
  if (epoch !== sessionEpoch) throw new Error('Your session has changed. Sign in again to continue.');
  if (error) throw error;
  return data;
}
configureDesk({ rpc, conferenceRpc: 'tutor_conference', noteRpc: 'tutor_set_pitch_note', zoomKey: 'moiradesk-tutor-wall-zoom', onWallClose: () => loadRooms() });
function render() {
  if (!configured) {
    app.innerHTML = '<div class="login"><div class="card"><h1>Moira:Desk Tutor</h1><p>The tutor desk is not ready yet. Please contact your administrator.</p></div></div>';
    return;
  }
  if (!state.user) { app.innerHTML = renderLogin(); return; }
  if (!document.getElementById('rooms')) renderShell();
  renderRooms();
}
// Rebuilt only on sign-in and when switching Cards / List, so the search box
// keeps its focus and cursor while the newsrooms update around it.
function renderShell() {
  app.innerHTML = `<header><h1>Moira:<span>Desk</span> Tutor</h1><span class="status" id="live-status"></span><span class="spacer"></span>
    <span class="muted">${esc(state.user.email)}</span><button data-action="sign-out">Sign out</button></header>
    <main><div id="msg"></div>
      <section class="rooms-head"><div><h2>Your newsrooms</h2><p class="muted" id="summary"></p></div>
        <div class="toolbar"><label for="room-search" class="sr-only">Find a newsroom</label>
          <input type="search" id="room-search" placeholder="Find a newsroom" autocomplete="off" value="${esc(state.query)}">
          <div class="seg" role="group" aria-label="Layout">${['cards', 'list'].map((v) =>
            `<button data-action="view" data-val="${v}" aria-pressed="${state.view === v}">${v === 'cards' ? 'Cards' : 'List'}</button>`).join('')}</div>
          <button data-action="select-all" id="sel-all-btn">Select all</button></div></section>
      <div id="rooms"></div>
      <p class="muted">Missing a newsroom or a join code? Ask your administrator to assign it to you. <a href="mailto:a.dickinson@mmu.ac.uk?subject=Moira%3ADesk%20feedback">Help and feedback</a></p>
    </main><div class="selbar" id="selbar"></div>`;
}
const sortedRooms = () => [...state.rooms].sort(byName);
function shownRooms() {
  const q = state.query.trim().toLowerCase();
  return sortedRooms().filter((r) => !q || r.name.toLowerCase().includes(q));
}
function selectAllState() {
  const shown = shownRooms(), filtering = !!state.query.trim();
  const all = shown.length > 0 && shown.every((r) => state.selected.has(r.newsroom_id));
  return { shown, all, label: filtering ? (all ? 'Deselect shown' : `Select ${shown.length} shown`) : (all ? 'Clear selection' : 'Select all') };
}
// Conference counts come from the conference snapshot when there is one.
function roomStats(r) {
  const n = r.conf;
  if (!n) return { pitched: r.pitches, picked: r.picked, spiked: null, undecided: null, b: null };
  const count = (k) => n.pitches.filter((p) => p.status === k).length;
  return { pitched: n.pitches.length, picked: count('picked'), spiked: count('spiked'), undecided: count('pitched'), b: bulletinStats(n) };
}
function confSummary(s) {
  if (!s.pitched) return 'No pitches yet';
  if (s.spiked === null) return `${s.pitched} pitched · ${s.picked} picked`;
  const bar = [['picked', s.picked], ['undecided', s.undecided], ['spiked', s.spiked]].map(([k, v]) => v ? `<span class="${k}" style="flex:${v}"></span>` : '').join('');
  const part = (k, v) => `<span class="nw"><span class="dot ${k}"></span>${v} ${k}</span>`;
  return `<div class="confbar" aria-hidden="true">${bar}</div><span class="nw">${s.pitched} pitched</span> · ${part('picked', s.picked)} · ${part('spiked', s.spiked)} · ${part('undecided', s.undecided)}`;
}
function checksSummary(b, compact) {
  if (!b) return '—';
  const mark = (cls, sym, n, label) => `<span class="chk ${cls}"><i aria-hidden="true">${sym}</i>${n}<span${compact ? ' class="sr-only"' : ''}> ${label}</span></span>`;
  return mark('ok', '✓', b.checks.ok, 'OK') + mark('work', '!', b.checks.work, 'needs work')
    + mark('todo', '?', b.checks.todo, 'to check') + mark('none', '', b.checks.none, 'not checked');
}
const feedbackSummary = (b, none) => !b ? '—' : b.feedback ? plural(b.feedback, 'comment') : none;
function roomButtons(r, list) {
  const id = esc(r.newsroom_id), name = esc(r.name);
  return `<button class="small" data-action="review" data-id="${id}" aria-label="${list ? 'Review' : 'Review &amp; feedback'}: ${name}">${list ? 'Review' : 'Review &amp; feedback'}</button>
    ${r.tutor_code_available ? `<button class="small" data-action="show-code" data-id="${id}" aria-label="Join code: ${name}">Join code</button>` : ''}
    <button class="small" data-action="report-dialog" data-id="${id}" aria-label="Report: ${name}">Report</button>`;
}
const tickBox = (r) => `<input type="checkbox" class="sel-room" data-id="${esc(r.newsroom_id)}" ${state.selected.has(r.newsroom_id) ? 'checked' : ''} aria-label="Select ${esc(r.name)}">`;
function renderCard(r) {
  const s = roomStats(r), b = s.b;
  return `<article class="room-card${state.selected.has(r.newsroom_id) ? ' ticked' : ''}">
    <label class="room-head">${tickBox(r)}<span class="name">${esc(r.name)}</span>
      <span class="meta">${plural(r.members, 'member')} · ${r.producer_name ? `<span class="crown">♛</span> ${esc(r.producer_name)}` : 'No producer yet'}</span></label>
    <div class="room-body">
      <div class="stat"><span class="k">Conference</span><div>${confSummary(s)}</div></div>
      <div class="stat"><span class="k">Running order</span><div>${!b ? '—' : b.stories ? `${plural(b.stories, 'story', 'stories')} · ${dur(b.trt)} running time` : 'Nothing picked yet'}</div></div>
      <div class="stat"><span class="k">Checks</span><div>${checksSummary(b)}</div></div>
      <div class="stat"><span class="k">EP feedback</span><div>${feedbackSummary(b, 'None yet')}</div></div>
    </div>
    <div class="room-foot">${roomButtons(r)}</div></article>`;
}
function renderList(rooms) {
  const head = ['<span class="sr-only">Select</span>', 'Newsroom', 'Producer', 'Pitches', 'Running order', 'Checks', 'Feedback', '<span class="sr-only">Actions</span>'];
  const rows = rooms.map((r) => {
    const s = roomStats(r), b = s.b;

let review = null;

async function openReview(id) {

function closeReview() {
  if (!review) return;
  review.dialog?.remove();

async function loadReview() {
  const r = review;
  if (!r) return;
  const seq = r.seq = (r.seq || 0) + 1;
  let data = null, error = null;
  try { data = (await rpc('tutor_conference', { p_newsroom_ids: [r.id], p_scripts: true }))?.[0] || null; }
  catch (e) { error = e.message; }
  if (review !== r || seq !== r.seq) return;
  if (error) r.error = error;
  else if (!data) r.error = 'This newsroom is no longer available to you.';

}

function renderReview() {
  const r = review;

  r.el.querySelector('[data-review-bar]').innerHTML = `<h1>Review: ${esc(n?.name || room(r.id)?.name || '')}</h1>
    <span class="muted">${r.error ? `<span style="color:var(--err)">${esc(r.error)}</span>` : n ? `${n.feedback.length} comment${n.feedback.length === 1 ? '' : 's'} · included in this newsroom's report as EP feedback` : 'Loading…'}</span>
    <span class="spacer"></span>

  const scroll = r.el.querySelector('.review-scroll').scrollTop;
  const byId = Object.fromEntries(n.stories.map((s) => [s.id, s]));
  const fbFor = (storyId) => n.feedback.filter((f) => f.story_id === storyId);

    const s = byId[id];

  page.innerHTML = `
    <p class="muted" style="margin:0">${n.producer_name ? `Producer: ${esc(n.producer_name)} · ` : ''}TRT ${dur(trt)}${target}. Select words in a script before choosing <strong>Add feedback</strong> to quote them.</p>

    <h2>Running order</h2>

function feedbackDialog({ storyId = null, item = null }) {
  const r = review;

  const story = storyId ? r.data.stories.find((s) => s.id === storyId) : null;
  const slug = story?.slug || item?.story_slug || '';

  const dialog = document.createElement('dialog');

  dialog.setAttribute('aria-labelledby', 'fb-title');
  dialog.innerHTML = `<form>
    <div class="head"><h3 id="fb-title">${item ? 'Edit feedback' : storyId ? 'Add feedback' : 'Add overall feedback'}</h3><button type="button" class="small" data-fb-cancel aria-label="Close">✕</button></div>
    <div class="body">
      <p class="note-story">${storyId ? esc(slug || 'Untitled') : 'The bulletin as a whole'}</p>

      <div><label for="fb-body">Feedback</label>
        <textarea id="fb-body" rows="6" maxlength="2000" aria-describedby="fb-help">${esc(item?.body || '')}</textarea></div>
      <div class="note-help"><span id="fb-help">Shown as EP feedback in this newsroom's report. Students don't see it on the desk.</span><span data-fb-count></span></div>
      <div class="msg err" data-fb-error role="alert" hidden></div>
    </div>
    <div class="foot"><button type="button" data-fb-cancel>Cancel</button><button type="submit" class="primary">${item ? 'Save changes' : 'Post feedback'}</button></div>
  </form>`;
  r.dialog = dialog;
  document.body.appendChild(dialog);
  const body = dialog.querySelector('#fb-body'), quoteEl = dialog.querySelector('#fb-quote');
  const error = dialog.querySelector('[data-fb-error]'), submit = dialog.querySelector('[type="submit"]');
  let saving = false;
  const count = () => { dialog.querySelector('[data-fb-count]').textContent = `${body.value.length}/2000`; };
  const close = () => {
    if (saving) return;
    dialog.close(); dialog.remove();
    if (r.dialog === dialog) r.dialog = null;
  };
  dialog.querySelectorAll('[data-fb-cancel]').forEach((b) => b.addEventListener('click', close));
  dialog.addEventListener('cancel', (e) => { e.preventDefault(); close(); });

      error.textContent = err.message || 'Could not save your feedback. Please try again.';
      error.hidden = false;
      dialog.querySelectorAll('button, textarea').forEach((x) => { x.disabled = false; });

// Clear sensitive views and invalidate pending requests whenever the session ends.
function clearSession() {
  sessionEpoch++;
  clearInterval(state.pollTimer);
  discardWall();
  if (review) { review.dialog?.remove(); review.el.remove(); review = null; }
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  closeDialog();
  if (lastReport) URL.revokeObjectURL(lastReport.url);
  lastReport = null;
  state.user = null; state.rooms = []; state.selected.clear(); state.message = null; state.loading = false; state.loaded = false;
  state.query = ''; state.updated = null; state.refreshError = null; state.pollTimer = null; state.roomsInFlight = 0;
  state.reportIds = []; state.reportScripts = false;
  render();
}
// The newsroom list, with each newsroom's conference snapshot merged in for
// the cards. "Loading…" shows only on the first load; later polls update in
// place. Timer ticks never overlap a request; an explicit refresh (closing the
// wall or a review) supersedes one, so only the latest answer is used.
async function loadRooms(background = false) {
  if (!state.user || (background && state.roomsInFlight)) return;
  const epoch = sessionEpoch, seq = ++state.roomsSeq;
  state.roomsInFlight++;
  if (!state.loaded) { state.loading = true; render(); }
  let rooms = null, conf = null, error = null, confError = null;
  try {
    rooms = await rpc('tutor_newsrooms') || [];
    if (rooms.length) {
      try { conf = await rpc('tutor_conference', { p_newsroom_ids: rooms.map((r) => r.newsroom_id), p_scripts: false }) || []; }
      catch (e) { confError = e.message; }
    }
  } catch (e) { error = e.message; }
  finally { if (epoch === sessionEpoch) state.roomsInFlight--; }
  if (epoch !== sessionEpoch || seq !== state.roomsSeq) return;
  if (error) state.refreshError = error;
  else {
    // If only the snapshot failed, keep each newsroom's last one.
    const prev = Object.fromEntries(state.rooms.map((r) => [r.newsroom_id, r.conf]));
    const byId = conf && Object.fromEntries(conf.map((n) => [n.id, n]));
    state.rooms = rooms.map((r) => ({ ...r, conf: (byId ? byId[r.newsroom_id] : prev[r.newsroom_id]) || null }));
    state.selected = new Set([...state.selected].filter((id) => room(id)));
    state.refreshError = confError; state.updated = new Date();
  }
  state.loading = false; state.loaded = true; render();
}
// Poll every 30 seconds while the page is in view and nothing covers it.
function pollRooms() {
  if (!state.user || wall || review || document.visibilityState === 'hidden') return;
  loadRooms(true);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pollRooms(); });
async function afterSignIn(user) {
  const epoch = sessionEpoch;
  try {
    const [admin, tutor] = await Promise.all([rpc('is_admin'), rpc('is_tutor')]);
    if (epoch !== sessionEpoch) return;
    if (!admin && !tutor) throw new Error('This account has no tutor access. Ask your administrator to enable it.');
    state.user = user; state.loginError = null;
    await loadRooms();
    if (epoch !== sessionEpoch) return;
    clearInterval(state.pollTimer);
    state.pollTimer = setInterval(pollRooms, 30000);
  } catch (e) {
    if (epoch !== sessionEpoch) return;
    state.loginError = e.message;
    await sb.auth.signOut({ scope: 'local' });
    clearSession();
  }
}

function getCaptchaToken() {
  if (!TURNSTILE_SITE_KEY) return Promise.resolve(undefined);
  if (location.protocol === 'file:') {
    return Promise.reject(new Error('The human check needs this page served from localhost, not opened as a file. See the README.'));
  }
  return new Promise((resolve, reject) => {
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999';
    document.body.appendChild(box);
    const done = (fn, v) => { box.remove(); fn(v); };
    const draw = () => window.turnstile.render(box, {
      sitekey: TURNSTILE_SITE_KEY, appearance: 'interaction-only',
      callback: t => done(resolve, t),
      'error-callback': () => done(reject, new Error('The human check failed. Check this hostname is allowed for the Turnstile widget.')),
      'timeout-callback': () => done(reject, new Error('The human check timed out. Try again.')),
    });
    if (window.turnstile) return draw();
    const sc = document.createElement('script');
    sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    sc.async = true; sc.onload = draw;
    sc.onerror = () => done(reject, new Error('Could not load the human check (Cloudflare Turnstile).'));
    document.head.appendChild(sc);
  });
}

document.addEventListener('submit', async e => {
  if (e.target.matches('[data-form="alert"]')) {
    e.preventDefault();
    const form = e.target, submit = e.submitter;
    if (form.dataset.busy) return;
    form.dataset.busy = 'true'; if (submit) submit.disabled = true;
    try { await sendBroadcastAlert(); }
    catch (error) {
      if (dlg.open) {
        dlg.querySelector('.alert-error')?.remove();
        dlg.querySelector('.body').insertAdjacentHTML('beforeend', `<div class="msg err alert-error" role="alert">${esc(error.message)}</div>`);
      } else flash(error.message, 'err');
    } finally {
      delete form.dataset.busy;
      if (submit?.isConnected) submit.disabled = false;
    }
    return;
  }
  if (!e.target.matches('[data-form="login"]')) return;
  e.preventDefault();
  if (state.loginBusy) return;
  state.loginEmail = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  state.loginBusy = true; state.loginError = null; render();
  try {
    const captchaToken = await getCaptchaToken();
    const { data, error } = await sb.auth.signInWithPassword({ email: state.loginEmail, password,
      ...(captchaToken ? { options: { captchaToken } } : {}) });
    if (error) throw error;
    await afterSignIn(data.user);
  } catch (e) { state.loginError = e.message; }
  finally { state.loginBusy = false; render(); }
});
document.addEventListener('click', async e => {
  const btn = e.target.closest('[data-action]');
  if (!btn || btn.disabled || !state.user) return;
  const action = btn.dataset.action, id = btn.dataset.id;
  btn.disabled = true;
  try {
    if (action === 'alert') alertDialog();
    else if (action === 'close-dialog') closeDialog();
    else if (action === 'dismiss-msg') { state.message = null; renderRooms(); }
    else if (action === 'view' && state.view !== btn.dataset.val) {
      state.view = btn.dataset.val === 'list' ? 'list' : 'cards';
      try { sessionStorage.setItem('moiradesk-tutor-view', state.view); } catch {}
      keepFocus(app, () => { renderShell(); renderRooms(); });
    }
    else if (action === 'select-all') {
      const { shown, all } = selectAllState();
      shown.forEach((r) => (all ? state.selected.delete(r.newsroom_id) : state.selected.add(r.newsroom_id)));
      renderRooms();
    }
    else if (action === 'clear-selection') { state.selected.clear(); renderRooms(); }
    else if (action === 'sign-out') {
      const { error } = await sb.auth.signOut({ scope: 'local' });
      if (error) throw error;
      clearSession();
    }
    else if (action === 'wall') await openWall(tickedIds());
    else if (await wallClick(action, id, btn)) { /* handled by the shared wall */ }
    else if (action === 'report-dialog') reportDialog(id ? [id] : tickedIds());
    else if (action === 'report') {
      btn.textContent = 'Generating…';
      await generateReport(state.reportIds, !!document.getElementById('report-scripts')?.checked);
    }
    else if (action === 'open-report' && lastReport) window.open(lastReport.url, '_blank', 'noopener');
    else if (action === 'show-code') await showJoinCode(id);
    else if (action === 'review') await openReview(id);
    else if (action === 'review-close') closeReview();
    else if (action === 'review-refresh') await loadReview();
    else if (action === 'review-add') feedbackDialog({ storyId: id || null });
    else if (action === 'review-edit') { const item = review?.data?.feedback.find((f) => f.id === id); if (item) feedbackDialog({ storyId: item.story_id, item }); }
    else if (action === 'review-delete') await deleteFeedback(id);
    else if (action === 'copy-code') { await navigator.clipboard.writeText(document.getElementById('code-text').textContent); btn.textContent = 'Copied'; }
  } catch (e) {
    if (wall) { wall.error = e.message; renderWall(); }
    else if (review) { review.error = e.message; renderReview(); }
    else if (dlg.open) { closeDialog(); flash(e.message, 'err'); }
    else flash(e.message, 'err');
  } finally { btn.disabled = false; }
});
document.addEventListener('keydown', e => {
  if (wallKeydown(e, dlg.open)) return;
  if (e.key === 'Escape' && review && !review.dialog && !dlg.open) closeReview();
});
dlg.addEventListener('close', () => { dlg.innerHTML = ''; });
document.addEventListener('change', e => {
  if (e.target.classList?.contains('sel-room')) {
    e.target.checked ? state.selected.add(e.target.dataset.id) : state.selected.delete(e.target.dataset.id);
    renderRooms();
  } else if (e.target.id === 'report-scripts') state.reportScripts = e.target.checked;
});
// Search filters as you type, without rebuilding the search box.
document.addEventListener('input', e => {
  if (e.target.id === 'room-search') { state.query = e.target.value; renderRooms(); }
});
if (sb) sb.auth.onAuthStateChange((event, session) => { if (event === 'SIGNED_OUT') clearSession(); });
(async () => {
  if (!configured) { render(); return; }
  try {
    const { data: { session }, error } = await sb.auth.getSession();
    if (error) throw error;
    if (session?.user) await afterSignIn(session.user);
    else render();
  } catch (e) { state.loginError = e.message; render(); }
})();

</script>
