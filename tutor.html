<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Moira:Desk Tutor</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
        integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"
        crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f1f3f6; --panel: #fff; --ink: #1b1f27; --muted: #667085; --line: #dfe3ea;
    --accent: #2457d6; --accent-ink: #fff; --ok: #18794e; --ok-bg: #e7f6ee; --warn: #9a5b00; --warn-bg: #fff4e0;
    --err: #b42318; --err-bg: #fdecea; --chip: #eef1f6; --code-bg: #10141c; --code-ink: #f5f7fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --panel: #1b2029; --ink: #e8ebf1; --muted: #97a1b2; --line: #2c3340;
      --accent: #7aa2ff; --accent-ink: #0d1220; --ok: #5fd39a; --ok-bg: #12301f; --warn: #f0b45a; --warn-bg: #352610;
      --err: #ff8f84; --err-bg: #3a1714; --chip: #252b36; --code-bg: #0a0d12; --code-ink: #f5f7fb;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; }
  header h1 span { color: var(--accent); }
  header .spacer { flex: 1; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; display: grid; gap: 16px; }
  .card { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  input[type=text], input[type=email], input[type=password] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .row > .grow { flex: 1 1 200px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 6px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { filter: brightness(0.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.danger { color: var(--err); }
  button.small { padding: 4px 8px; font-size: 13px; }
  a.btn { display: inline-block; font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 6px; padding: 7px 12px; text-decoration: none; white-space: nowrap; }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td .sub { color: var(--muted); font-size: 12px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .msg { border-radius: 6px; padding: 8px 10px; font-size: 14px; margin-top: 10px; }
  .msg.err { background: var(--err-bg); color: var(--err); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .muted { color: var(--muted); }
  .login { max-width: 380px; margin: 10vh auto; }
  .login .card { display: grid; gap: 12px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--panel); color: var(--ink); width: min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(10, 14, 20, .55); }
  dialog .head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  dialog .head h3 { margin: 0; font-size: 17px; }
  dialog .body { padding: 18px; display: grid; gap: 12px; }
  dialog .foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
  .code-big { background: var(--code-bg); color: var(--code-ink); font: 700 clamp(32px, 8vw, 56px)/1.1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; text-align: center; padding: 22px 10px; border-radius: 10px; }
  .fullscreen-code { position: fixed; inset: 0; background: var(--code-bg); color: var(--code-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; z-index: 100; cursor: pointer; text-align: center; padding: 20px; }
  .fullscreen-code .name { font-size: 4vw; font-weight: 700; opacity: .8; }
  .fullscreen-code .code { font: 700 13vw/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em; }
  .fullscreen-code .hint { font-size: 1.6vw; opacity: .6; }
  .part { width: 100%; text-align: left; display: block; padding: 10px 12px; }
  .part.selected { outline: 2px solid var(--accent); background: var(--panel); }
  .part .items { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--ink); }
  .check input { margin-top: 3px; }
  .table-wrap { overflow-x: auto; }
  td.sel, th.sel { width: 28px; padding-right: 0; }
  .crown { color: #c58a00; }

  .wall-view { display: contents; }
  .wall-note-dialog { font-size: 15px; width: min(600px, calc(100vw - 32px)); }
  .wall-note-dialog .note-story { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
  .wall-note-dialog textarea { width: 100%; min-height: 150px; resize: vertical; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; line-height: 1.5; }
  .wall-note-dialog textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .wall-note-dialog .note-help { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; }

  /* EP wall: projected, so big type and high contrast */
  .wall { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: flex; flex-direction: column; font-size: calc(16px * var(--zoom, 1)); }
  .wall-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; font-size: 15px; }
  .wall-bar h1 { margin: 0; font-size: 18px; }
  .wall-bar .spacer { flex: 1; }
  .wall-cols { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 1fr); gap: 12px; padding: 12px; overflow-x: auto; }
  .wall-col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; }
  .wall-col header { display: block; padding: .7em .9em; border-bottom: 1px solid var(--line); background: transparent; }
  .wall-col header .name { font-weight: 800; font-size: 1.25em; }
  .wall-col header .meta { color: var(--muted); font-size: .8em; margin-top: 2px; }
  .wall-col .list { overflow-y: auto; padding: .6em; display: grid; gap: .5em; align-content: start; }
  .wall-pitch { border: 1px solid var(--line); border-radius: 10px; padding: .55em .7em; background: var(--panel); }
  .wall-pitch .slug { font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
  .wall-pitch .angle { margin-top: 2px; }
  .wall-pitch .by { color: var(--muted); font-size: .78em; margin-top: 3px; }
  .wall-pitch.picked { border-color: var(--ok); background: var(--ok-bg); }
  .wall-pitch.picked .slug::before { content: "✓ "; color: var(--ok); }
  .wall-pitch.spiked { opacity: .55; }
  .wall-pitch.spiked .slug { text-decoration: line-through; }
  .wall-pitch .note { margin-top: .4em; font-size: .85em; background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: .3em .5em; }
  .wall-pitch .note-btn { float: right; font-size: 12px; padding: 2px 8px; margin-left: 6px; }
  .wall .empty { color: var(--muted); font-style: italic; padding: .5em; }

  /* Review: read the running order and scripts, leave EP feedback */
  .review { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: flex; flex-direction: column; }
  .review-scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .review-page { max-width: 900px; margin: 0 auto; padding: 18px 16px 80px; display: grid; gap: 14px; }
  .review-page h2 { margin: 6px 0 0; }
  .review-story { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
  .review-story.dim { opacity: .75; }
  .review-story .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .review-story .num { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.5em; text-align: right; }
  .review-story .slug { font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
  .review-story .meta { color: var(--muted); font-size: 13px; }
  .review-script { white-space: pre-wrap; font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0; overflow-wrap: anywhere; }
  .review-seg { color: #4338ca; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; padding: 4px 2px 0; }
  .review-eop { background: var(--err); color: #fff; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; padding: 6px 10px; border-radius: 6px; }
  .fb-list { display: grid; gap: 8px; }
  .fb { background: var(--warn-bg); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; }
  .fb .by { font-size: 12px; font-weight: 700; color: var(--warn); display: flex; gap: 6px; align-items: center; }
  .fb .by .spacer { flex: 1; }
  .fb blockquote { margin: 0; padding-left: 10px; border-left: 3px solid var(--warn); color: var(--muted); font-style: italic; white-space: pre-wrap; }
  .fb .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .fb-dialog { width: min(640px, calc(100vw - 32px)); }
  .fb-dialog textarea { width: 100%; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; line-height: 1.5; }
  .fb-dialog textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fb-dialog .note-help { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>

<script>
const SUPABASE_URL = 'https://ushtoubwyopjdlogapew.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzaHRvdWJ3eW9wamRsb2dhcGV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0OTY3MzUsImV4cCI6MjEwODA3MjczNX0.qyukiNYqfnaOrnqGiL9mAGgmSmvBFKHe5YlzD59BFOA';
const TURNSTILE_SITE_KEY = '';

// This page uses only public browser configuration. All access is checked by
// the database against the signed-in staff account and newsroom assignments.
const configured = /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SUPABASE_URL) && !/YOUR-/.test(SUPABASE_ANON_KEY);
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storage: window.sessionStorage, storageKey: 'moiradesk-tutor-auth', persistSession: true, autoRefreshToken: true },
}) : null;
const state = { user: null, rooms: [], loading: false, loginBusy: false, loginEmail: '', loginError: null,
  message: null, selected: new Set(), reportScripts: false };
const app = document.getElementById('app'), dlg = document.getElementById('dlg');
let sessionEpoch = 0;
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const room = (id) => state.rooms.find(r => r.newsroom_id === id);
function flash(text, tone = 'ok') { state.message = { text, tone }; render(); }
async function rpc(name, args) {
  const epoch = sessionEpoch;
  const { data, error } = await sb.rpc(name, args);
  if (epoch !== sessionEpoch) throw new Error('Your session has changed. Sign in again to continue.');
  if (error) throw error;
  return data;
}
function render() {
  if (!configured) {
    app.innerHTML = '<div class="login"><div class="card"><h1>Moira:Desk Tutor</h1><p>The tutor desk is not ready yet. Please contact your administrator.</p></div></div>';
    return;
  }
  if (!state.user) { app.innerHTML = renderLogin(); return; }
  app.innerHTML = `<header><h1>Moira:<span>Desk</span> Tutor</h1><span class="spacer"></span>
    <span class="muted">${esc(state.user.email)}</span><button data-action="refresh">Refresh</button><button data-action="sign-out">Sign out</button></header>
    <main>${state.message ? `<div class="msg ${state.message.tone}" role="status">${esc(state.message.text)}</div>` : ''}
      <section class="card"><h2>Your newsrooms</h2>
        <p>Select one or more newsrooms to discuss their pitches on the EP wall or generate a report. Use <strong>Review</strong> to read a newsroom's running order and scripts and leave EP feedback, and <strong>Show join code</strong> when a student needs to join.</p>
        ${state.loading ? '<p class="muted">Loading…</p>' : renderTable()}</section>
      ${renderConferenceCard()}
      <p class="muted">Missing a newsroom or a join code? Ask your administrator to assign it to you. <a href="mailto:a.dickinson@mmu.ac.uk?subject=Moira%3ADesk%20feedback">Help and feedback</a></p>
    </main>`;
}
function renderLogin() {
  return `<div class="login"><form class="card" data-form="login"><h1 style="font-size:22px;margin:0">Moira:Desk Tutor</h1>
    <p style="margin:0">Sign in with the staff account provided by your administrator.</p>
    <div><label for="email">Staff email</label><input type="email" id="email" autocomplete="username" value="${esc(state.loginEmail)}" required></div>
    <div><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required></div>
    ${state.loginError ? `<div class="msg err" role="alert">${esc(state.loginError)}</div>` : ''}
    <button class="primary" type="submit" ${state.loginBusy ? 'disabled' : ''}>${state.loginBusy ? 'Signing in…' : 'Sign in'}</button>
    <a href="./">Open the student desk</a></form></div>`;
}
function renderTable() {
  if (!state.rooms.length) return '<p class="muted">No newsrooms are assigned to you yet. Ask your administrator to add them.</p>';
  const all = state.rooms.every(r => state.selected.has(r.newsroom_id));
  return `<div class="table-wrap"><table><thead><tr><th class="sel"><input type="checkbox" id="sel-all" ${all ? 'checked' : ''} aria-label="Select all newsrooms"></th>
    <th>Newsroom</th><th>Conference</th><th>Stories</th><th>Feedback</th><th>Student access</th></tr></thead><tbody>${state.rooms.map(r => `<tr>
      <td class="sel"><input type="checkbox" class="sel-room" data-id="${esc(r.newsroom_id)}" ${state.selected.has(r.newsroom_id) ? 'checked' : ''} aria-label="Select ${esc(r.name)}"></td>
      <td><strong>${esc(r.name)}</strong><div class="sub">${r.members} members</div></td>
      <td>${r.producer_name ? `Producer: ${esc(r.producer_name)}` : 'No producer yet'}<div class="sub">${r.pitches} pitches · ${r.picked} picked</div></td>
      <td>${r.stories}</td><td><button class="small" data-action="review" data-id="${esc(r.newsroom_id)}">Review</button></td><td>${r.tutor_code_available ? `<button class="small" data-action="show-code" data-id="${esc(r.newsroom_id)}">Show join code</button>` : '<span class="muted">Ask administrator for a code</span>'}</td>
    </tr>`).join('')}</tbody></table></div>`;
}
function renderConferenceCard() {
  const n = tickedIds().length, disabled = n ? '' : 'disabled';
  return `<section class="card"><h2>Conference and reports</h2><div class="row" style="align-items:center">
    <span class="muted">${n} newsroom${n === 1 ? '' : 's'} selected</span><button class="primary" data-action="wall" ${disabled}>Open EP wall</button>
    <button data-action="report" ${disabled}>Generate report</button>
      <button data-action="alert" ${disabled}>Send alert</button>
    <label class="check" style="margin:0"><input type="checkbox" id="report-scripts" ${state.reportScripts ? 'checked' : ''}> Include scripts in the report</label></div>
    <p class="muted">The EP wall updates live and lets you leave notes on pitches. Reports capture the current conference, running order and EP feedback for sharing or a debrief.</p></section>`;
}
function alertDialog() {
  const ids = tickedIds();
  if (!ids.length) return;
  openDialog('Send EP broadcast alert', `<p style="margin:0">To ${ids.length} selected newsroom${ids.length === 1 ? '' : 's'}:</p>
    <ul style="margin:0;padding-left:20px;max-height:140px;overflow:auto">${ids.map(id => `<li>${esc(state.rooms.find(r => r.newsroom_id === id)?.name || id)}</li>`).join('')}</ul>
    <form data-form="alert" id="alert-form">
      <label for="alert-message">Message</label><input type="text" id="alert-message" maxlength="240" placeholder="e.g. Everyone back to the newsroom in 5 mins" required autocomplete="off">
    </form>`, '<button data-action="close-dialog">Cancel</button><button class="primary" type="submit" form="alert-form">Send to selected newsrooms</button>');
  document.getElementById('alert-message').focus();
}
async function sendBroadcastAlert() {
  const p_message = document.getElementById('alert-message').value.trim();
  if (!p_message) throw new Error('Enter an alert message.');
  const ids = tickedIds();
  if (!ids.length) throw new Error('Select at least one newsroom.');
  await rpc('tutor_send_alert', { p_newsroom_ids: ids, p_message });
  closeDialog(); flash('Alert sent.');
}

function openDialog(title, body, foot) {
  dlg.innerHTML = `<div class="head"><h3>${esc(title)}</h3><button class="small" data-action="close-dialog" aria-label="Close">✕</button></div><div class="body">${body}</div>${foot ? `<div class="foot">${foot}</div>` : ''}`;
  if (!dlg.open) dlg.showModal();
}
function closeDialog() { if (dlg.open) dlg.close(); dlg.innerHTML = ''; }
async function showJoinCode(id) {
  const name = room(id)?.name;
  if (!name) return;
  const code = await rpc('get_tutor_join_code', { p_newsroom_id: id });
  if (!code) { flash('No tutor join code is available for this newsroom. Ask your administrator.', 'warn'); return; }
  openDialog(`Join ${name}`, `<div class="code-big" id="code-text">${esc(code)}</div>
    <p>Students can use this code on the <a href="./" target="_blank" rel="noopener">student desk</a>. Share it only with this newsroom’s group.</p>`,
    '<button data-action="copy-code">Copy code</button><button class="primary" data-action="close-dialog">Done</button>');
}

let wall = null;

function tickedIds() { return state.rooms.map((r) => r.newsroom_id).filter((id) => state.selected.has(id)); }

async function openWall() {
  const ids = tickedIds();
  if (!ids.length) return;
  let zoom = 1;
  try { zoom = Number(sessionStorage.getItem('moiradesk-tutor-wall-zoom')) || 1; } catch {}
  const el = document.createElement('div');
  el.className = 'wall';
  el.innerHTML = '<div class="wall-view"></div>';
  document.body.appendChild(el);
  const w = wall = { ids, data: null, sig: '', el, zoom, error: null, updated: null };
  el.style.setProperty('--zoom', zoom);
  renderWall();
  el.requestFullscreen?.().catch(() => {});
  w.timer = setInterval(() => pollWall(true), 3000);
  await pollWall();
}

function closeWall() {
  if (!wall) return;
  clearInterval(wall.timer);
  wall.el.remove();
  wall = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  loadRooms();
}

// The wall can be closed (or reopened) while a request is in flight, so the
// answer is only applied to the wall that asked for it.
// Timer ticks never overlap a request. Explicit refreshes (a saved note or
// returning to the tab) may supersede one, so only the latest answer is used.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') pollWall();
});

async function pollWall(background = false) {
  const w = wall;
  if (!w || document.visibilityState === 'hidden' || (background && w.inFlight)) return;
  w.inFlight = (w.inFlight || 0) + 1;
  const seq = w.seq = (w.seq || 0) + 1;
  let data = null, error = null;
  try { data = await rpc('tutor_conference', { p_newsroom_ids: w.ids, p_scripts: false }); }
  catch (e) { error = e.message; }
  finally { w.inFlight--; }
  if (wall !== w || seq !== w.seq) return;
  if (error) { w.error = error; w.data = []; w.sig = ''; }
  else {
    w.error = null; w.updated = new Date();
    const sig = JSON.stringify(data);
    if (sig !== w.sig) { w.sig = sig; w.data = data; }
  }
  renderWall();
}

function renderWall() {
  if (!wall) return;
  const scroll = {};
  wall.el.querySelectorAll('.list[data-id]').forEach((l) => { scroll[l.dataset.id] = l.scrollTop; });
  const cols = (wall.data || []).map((n) => {
    const order = { pitched: 0, picked: 1, spiked: 2 };
    const pitches = [...n.pitches].sort((a, b) => (order[a.status] - order[b.status]));
    const fmtOf = Object.fromEntries(n.stories.map((s) => [s.id, s.format]));
    const counts = ['pitched', 'picked', 'spiked'].map((k) => `${n.pitches.filter((p) => p.status === k).length} ${k}`).join(' · ');
    return `<section class="wall-col">
      <header><div class="name">${esc(n.name)}</div>
        <div class="meta">${n.producer_name ? `<span class="crown">♛</span> ${esc(n.producer_name)}` : 'No producer yet'} · ${counts}</div></header>
      <div class="list" data-id="${esc(n.id)}">
        ${pitches.length ? pitches.map((p) => `<div class="wall-pitch ${p.status}">
          <button class="note-btn" data-action="wall-note" data-id="${esc(p.id)}" title="Add or change your note for this group">${p.ep_note ? 'Edit note' : 'Note'}</button>
          <div class="slug">${esc(p.slug)}${p.status === 'picked' && fmtOf[p.story_id] ? ` <span class="pill">${esc(fmtOf[p.story_id])}</span>` : ''}</div>
          ${p.angle ? `<div class="angle">${esc(p.angle)}</div>` : ''}
          <div class="by">${p.pitched_by ? esc(p.pitched_by) : ''}${p.status === 'spiked' && p.spike_reason ? ` · spiked: ${esc(p.spike_reason)}` : ''}</div>
          ${p.ep_note ? `<div class="note">EP: ${esc(p.ep_note)}</div>` : ''}
        </div>`).join('') : '<div class="empty">No pitches yet</div>'}
      </div>
    </section>`;
  }).join('');
  wall.el.querySelector('.wall-view').innerHTML = `<div class="wall-bar">
      <h1>Conference</h1>
      <span class="muted">${wall.error ? `<span style="color:var(--err)">Can't refresh: ${esc(wall.error)}</span>` : wall.updated ? `Live · updated ${wall.updated.toLocaleTimeString('en-GB')}` : 'Loading…'}</span>
      <span class="spacer"></span>
      <button data-action="wall-zoom" data-val="-1" title="Smaller text">A−</button>
      <button data-action="wall-zoom" data-val="1" title="Larger text">A+</button>
      <button class="primary" data-action="wall-close">Close (Esc)</button>
    </div>
    <div class="wall-cols">${wall.data ? cols : '<div class="empty">Loading…</div>'}</div>`;
  wall.el.querySelectorAll('.list[data-id]').forEach((l) => { if (scroll[l.dataset.id]) l.scrollTop = scroll[l.dataset.id]; });
}

function wallNote(pitchId) {
  const w = wall;
  const p = (w?.data || []).flatMap(n => n.pitches).find(x => x.id === pitchId);
  if (!p || w.noteDialog) return;
  const dialog = document.createElement('dialog');
  dialog.className = 'wall-note-dialog';
  dialog.setAttribute('aria-labelledby', 'wall-note-title');
  dialog.innerHTML = `<form>
    <div class="head"><h3 id="wall-note-title">${p.ep_note ? 'Edit EP note' : 'Add EP note'}</h3><button type="button" class="small" data-note-cancel aria-label="Close note">✕</button></div>
    <div class="body">
      <p class="note-story">${esc(p.slug)}</p>
      <label for="wall-note-text">Your note to the newsroom</label>
      <textarea id="wall-note-text" maxlength="500" aria-describedby="wall-note-help" autofocus>${esc(p.ep_note || '')}</textarea>
      <div class="note-help"><span id="wall-note-help">Visible to the group. Leave blank to remove the note.</span><span data-note-count></span></div>
      <div class="msg err" data-note-error role="alert" hidden></div>
    </div>
    <div class="foot"><button type="button" data-note-cancel>Cancel</button><button type="submit" class="primary">Save note</button></div>
  </form>`;
  // Keep the dialog inside the fullscreen element and outside the live content
  // that polling replaces, so fullscreen, focus and drafts all survive refreshes.
  w.noteDialog = dialog;
  w.el.appendChild(dialog);
  const input = dialog.querySelector('textarea');
  const save = dialog.querySelector('[type="submit"]');
  const error = dialog.querySelector('[data-note-error]');
  let saving = false;
  const count = () => { dialog.querySelector('[data-note-count]').textContent = `${input.value.length}/500`; };
  const close = () => {
    if (saving) return;
    dialog.close(); dialog.remove();
    if (w.noteDialog === dialog) w.noteDialog = null;
    if (wall === w) [...w.el.querySelectorAll('[data-action="wall-note"]')].find(b => b.dataset.id === pitchId)?.focus();
  };
  dialog.querySelectorAll('[data-note-cancel]').forEach(b => b.addEventListener('click', close));
  dialog.addEventListener('cancel', e => { e.preventDefault(); close(); });
  dialog.addEventListener('keydown', e => { e.stopPropagation(); });
  input.addEventListener('input', count);
  dialog.querySelector('form').addEventListener('submit', async e => {
    e.preventDefault(); e.stopPropagation();
    if (saving || wall !== w) return;
    saving = true; error.hidden = true;
    dialog.querySelectorAll('button').forEach(b => { b.disabled = true; });
    input.readOnly = true; save.textContent = 'Saving…';
    try {
      await rpc('tutor_set_pitch_note', { p_pitch_id: pitchId, p_note: input.value });
      if (wall !== w || w.noteDialog !== dialog) return;
      saving = false; close();
      await pollWall();
    } catch (e) {
      if (wall !== w || w.noteDialog !== dialog) return;
      error.textContent = e.message || 'Could not save your note. Please try again.';
      error.hidden = false;
    } finally {
      saving = false;
      dialog.querySelectorAll('button').forEach(b => { b.disabled = false; });
      input.readOnly = false; save.textContent = 'Save note';
    }
  });
  count(); dialog.showModal(); input.focus();
}

// ── Review and EP feedback ─────────────────────────────────────────────
// One newsroom's running order and scripts, read top to bottom, with feedback
// on the whole bulletin and on each story. Students see it all as "EP".

let review = null;

async function openReview(id) {
  if (!room(id) || review) return;
  const el = document.createElement('div');
  el.className = 'review';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-label', `Review ${room(id).name}`);
  el.innerHTML = '<div class="wall-bar" data-review-bar></div><div class="review-scroll"><div class="review-page" data-review-page></div></div>';
  document.body.appendChild(el);
  review = { id, el, data: null, error: null, selection: null };
  renderReview();
  await loadReview();
}

function closeReview() {
  if (!review) return;
  review.dialog?.remove();
  review.el.remove();
  review = null;
  loadRooms();
}

async function loadReview() {
  const r = review;
  if (!r) return;
  const seq = r.seq = (r.seq || 0) + 1;
  let data = null, error = null;
  try { data = (await rpc('tutor_conference', { p_newsroom_ids: [r.id], p_scripts: true }))?.[0] || null; }
  catch (e) { error = e.message; }
  if (review !== r || seq !== r.seq) return;
  if (error) r.error = error;
  else if (!data) r.error = 'This newsroom is no longer available to you.';
  else { r.error = null; r.data = data; }
  renderReview();
}

function renderFeedbackItems(items) {
  return items.length ? `<div class="fb-list">${items.map((f) => `<div class="fb">
      <div class="by">EP<span class="spacer"></span>
        <button class="small" data-action="review-edit" data-id="${esc(f.id)}">Edit</button>
        <button class="small danger" data-action="review-delete" data-id="${esc(f.id)}">Delete</button></div>
      ${f.quote ? `<blockquote>${esc(f.quote)}</blockquote>` : ''}
      <div class="text">${esc(f.body)}</div></div>`).join('')}</div>` : '';
}

function renderReview() {
  const r = review;
  if (!r) return;
  const n = r.data;
  r.el.querySelector('[data-review-bar]').innerHTML = `<h1>Review: ${esc(n?.name || room(r.id)?.name || '')}</h1>
    <span class="muted">${r.error ? `<span style="color:var(--err)">${esc(r.error)}</span>` : n ? `${n.feedback.length} comment${n.feedback.length === 1 ? '' : 's'} · students see these as EP feedback` : 'Loading…'}</span>
    <span class="spacer"></span>
    <button data-action="review-refresh">Refresh</button>
    <button class="primary" data-action="review-close">Close (Esc)</button>`;
  const page = r.el.querySelector('[data-review-page]');
  if (!n) { page.innerHTML = r.error ? '' : '<p class="muted">Loading…</p>'; return; }
  const scroll = r.el.querySelector('.review-scroll').scrollTop;
  const byId = Object.fromEntries(n.stories.map((s) => [s.id, s]));
  const fbFor = (storyId) => n.feedback.filter((f) => f.story_id === storyId);
  let below = false, num = 0, trt = 0;
  const shown = new Set();
  const items = (Array.isArray(n.order) ? n.order : []).map((id) => {
    if (id === 'marker-line') { below = true; return '<div class="review-eop">End of programme</div>'; }
    const s = byId[id];
    if (!s) return '';
    if (s.type === 'segment') { if (!below) trt += s.duration || 0; return `<div class="review-seg">${esc(s.slug)}${s.duration ? ` · ${dur(s.duration)}` : ''}</div>`; }
    if (!below && !s.is_floated) trt += s.duration || 0;
    shown.add(s.id);
    const who = [s.reporter, s.presenter && `presenter ${s.presenter}`].filter(Boolean).join(' · ');
    return `<article class="review-story ${below || s.is_floated ? 'dim' : ''}" data-story="${esc(s.id)}">
      <div class="top"><span class="num">${below ? '' : ++num}</span><span class="slug">${esc(s.slug || 'Untitled')}</span>
        <span class="meta">${[s.format, dur(s.duration), who, s.is_floated && 'floated', below && 'below the line'].filter(Boolean).map(esc).join(' · ')}</span></div>
      ${s.script ? `<pre class="review-script" data-script="${esc(s.id)}">${esc(s.script)}</pre>` : '<p class="muted" style="margin:0">No script.</p>'}
      ${renderFeedbackItems(fbFor(s.id))}
      <div><button class="small" data-action="review-add" data-id="${esc(s.id)}">Add feedback</button></div>
    </article>`;
  }).join('');
  // Feedback on stories that have since left the running order.
  const removed = n.feedback.filter((f) => f.story_id && !shown.has(f.story_id));
  const target = n.target_duration != null ? ` · target ${dur(n.target_duration)}` : '';
  page.innerHTML = `
    <p class="muted" style="margin:0">${n.producer_name ? `Producer: ${esc(n.producer_name)} · ` : ''}TRT ${dur(trt)}${target}. Select words in a script before choosing <strong>Add feedback</strong> to quote them.</p>
    <section class="review-story"><div class="top"><span class="slug">Overall feedback</span><span class="meta">on the bulletin as a whole</span></div>
      ${renderFeedbackItems(fbFor(null))}
      <div><button class="small primary" data-action="review-add" data-id="">Add overall feedback</button></div></section>
    <h2>Running order</h2>
    ${items || '<p class="muted">No stories yet.</p>'}
    ${removed.length ? `<h2>Removed stories</h2><section class="review-story"><p class="muted" style="margin:0">Feedback on stories no longer in the running order.</p>
      ${removed.map((f) => `<div><div class="slug" style="margin-bottom:4px">${esc(f.story_slug || 'Untitled')}</div>${renderFeedbackItems([f])}</div>`).join('')}</section>` : ''}`;
  r.el.querySelector('.review-scroll').scrollTop = scroll;
}

// Returning to the tab picks up students' latest edits.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && review && !review.dialog) loadReview();
});

// Remember text selected inside one story's script, for quoting.
document.addEventListener('selectionchange', () => {
  if (!review || review.dialog) return;
  const sel = document.getSelection();
  const box = (node) => (node?.nodeType === 1 ? node : node?.parentElement)?.closest?.('[data-script]');
  const a = box(sel?.anchorNode), b = box(sel?.focusNode);
  review.selection = sel && !sel.isCollapsed && a && a === b && review.el.contains(a)
    ? { storyId: a.dataset.script, text: sel.toString().trim() } : null;
});
// Keep that selection when the Add feedback button is pressed.
document.addEventListener('mousedown', (e) => { if (review && e.target.closest?.('[data-action="review-add"]')) e.preventDefault(); });

function feedbackDialog({ storyId = null, item = null }) {
  const r = review;
  if (!r?.data || r.dialog) return;
  const story = storyId ? r.data.stories.find((s) => s.id === storyId) : null;
  const slug = story?.slug || item?.story_slug || '';
  const quote = item ? item.quote || '' : (r.selection?.storyId === storyId && storyId ? r.selection.text : '');
  const dialog = document.createElement('dialog');
  dialog.className = 'wall-note-dialog fb-dialog';
  dialog.setAttribute('aria-labelledby', 'fb-title');
  dialog.innerHTML = `<form>
    <div class="head"><h3 id="fb-title">${item ? 'Edit feedback' : storyId ? 'Add feedback' : 'Add overall feedback'}</h3><button type="button" class="small" data-fb-cancel aria-label="Close">✕</button></div>
    <div class="body">
      <p class="note-story">${storyId ? esc(slug || 'Untitled') : 'The bulletin as a whole'}</p>
      ${storyId ? `<div><label for="fb-quote">Quoted from the script (optional)</label>
        <textarea id="fb-quote" rows="2" maxlength="500">${esc(quote)}</textarea></div>` : ''}
      <div><label for="fb-body">Feedback</label>
        <textarea id="fb-body" rows="6" maxlength="2000" aria-describedby="fb-help">${esc(item?.body || '')}</textarea></div>
      <div class="note-help"><span id="fb-help">The whole newsroom sees this as EP feedback, and it's included in reports.</span><span data-fb-count></span></div>
      <div class="msg err" data-fb-error role="alert" hidden></div>
    </div>
    <div class="foot"><button type="button" data-fb-cancel>Cancel</button><button type="submit" class="primary">${item ? 'Save changes' : 'Post feedback'}</button></div>
  </form>`;
  r.dialog = dialog;
  document.body.appendChild(dialog);
  const body = dialog.querySelector('#fb-body'), quoteEl = dialog.querySelector('#fb-quote');
  const error = dialog.querySelector('[data-fb-error]'), submit = dialog.querySelector('[type="submit"]');
  let saving = false;
  const count = () => { dialog.querySelector('[data-fb-count]').textContent = `${body.value.length}/2000`; };
  const close = () => {
    if (saving) return;
    dialog.close(); dialog.remove();
    if (r.dialog === dialog) r.dialog = null;
  };
  dialog.querySelectorAll('[data-fb-cancel]').forEach((b) => b.addEventListener('click', close));
  dialog.addEventListener('cancel', (e) => { e.preventDefault(); close(); });
  dialog.addEventListener('keydown', (e) => e.stopPropagation());
  body.addEventListener('input', count);
  dialog.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (saving || review !== r) return;
    if (!body.value.trim()) { error.textContent = 'Write some feedback first.'; error.hidden = false; body.focus(); return; }
    saving = true; error.hidden = true;
    dialog.querySelectorAll('button, textarea').forEach((x) => { x.disabled = true; });
    submit.textContent = 'Saving…';
    try {
      await rpc('tutor_save_feedback', { p_feedback_id: item?.id || null, p_newsroom_id: r.id, p_story_id: storyId,
        p_quote: quoteEl ? quoteEl.value : null, p_body: body.value });
      saving = false; close();
      await loadReview();
    } catch (err) {
      saving = false;
      if (r.dialog !== dialog) return;
      error.textContent = err.message || 'Could not save your feedback. Please try again.';
      error.hidden = false;
      dialog.querySelectorAll('button, textarea').forEach((x) => { x.disabled = false; });
      submit.textContent = item ? 'Save changes' : 'Post feedback';
    }
  });
  count(); dialog.showModal(); body.focus();
}

async function deleteFeedback(id) {
  const r = review;
  if (!r?.data?.feedback.some((f) => f.id === id)) return;
  if (!confirm('Delete this feedback? Students will no longer see it, and it will drop out of reports.')) return;
  try { await rpc('tutor_delete_feedback', { p_feedback_id: id }); }
  catch (e) { if (review === r) { r.error = e.message; renderReview(); } return; }
  await loadReview();
}

// ── Report ─────────────────────────────────────────────────────────────
// A single self-contained web page: no login, no database, prints cleanly.

const CHECKED = { 'needs-checking': 'Needs checking', 'checked-ok': 'Checked OK', 'checked-needs-work': 'Needs work' };
const dur = (s) => { s = Math.max(0, Number(s) || 0); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const fullWhen = (t) => t ? new Date(t).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const shortTime = (t) => t ? new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';

// EP feedback grouped for the report: the bulletin as a whole, then each story
// in running-order order, then stories that have since been removed.
function feedbackGroups(n) {
  const fb = Array.isArray(n.feedback) ? n.feedback : [];
  if (!fb.length) return [];
  const byId = Object.fromEntries(n.stories.map((s) => [s.id, s]));
  const order = (Array.isArray(n.order) ? n.order : []).filter((id) => byId[id] && byId[id].type !== 'segment');
  const ids = [...new Set([...order, ...fb.map((f) => f.story_id).filter(Boolean)])];
  return [{ title: 'The bulletin as a whole', items: fb.filter((f) => !f.story_id) },
    ...ids.map((id) => ({ title: byId[id] ? byId[id].slug || 'Untitled' : `${fb.find((f) => f.story_id === id).story_slug || 'Untitled'} (removed from the running order)`,
      items: fb.filter((f) => f.story_id === id) }))].filter((g) => g.items.length);
}

function reportSection(n, withScripts) {
  const byId = Object.fromEntries(n.stories.map((s) => [s.id, s]));
  const order = Array.isArray(n.order) ? n.order : [];
  // Running order, as the desk shows it.
  let below = false, num = 0, trt = 0;
  const roRows = order.map((id) => {
    if (id === 'marker-line') { below = true; return `<tr class="eop"><td colspan="7">End of programme</td></tr>`; }
    const s = byId[id]; if (!s) return '';
    if (s.type === 'segment') {
      if (!below) trt += s.duration || 0;
      return `<tr class="seg"><td colspan="7">${esc(s.slug)}${s.duration ? ` · ${dur(s.duration)}` : ''}</td></tr>`;
    }
    if (!below && !s.is_floated) trt += s.duration || 0;
    const cuez = s.cuez_item_uid ? (s.rev > (s.cuez_sent_rev ?? 0) ? `Item ${esc(s.cuez_item_number || '?')}, changed since` : `Item ${esc(s.cuez_item_number || '?')}`)
      : s.cuez_pending_uid ? 'Unconfirmed' : 'Not sent';
    const tags = [s.is_floated ? 'floated' : '', below ? 'below the line' : ''].filter(Boolean).join(', ');
    return `<tr class="${below || s.is_floated ? 'dim' : ''}">
      <td class="num">${below ? '' : ++num}</td>
      <td><strong>${esc(s.slug)}</strong>${tags ? ` <span class="tag">${tags}</span>` : ''}${s.brief ? `<div class="sub">Pitch: ${esc(s.brief)}${s.pitched_by ? ` (${esc(s.pitched_by)})` : ''}</div>` : ''}</td>
      <td>${esc(s.format)}</td>
      <td>${esc(s.reporter)}${s.reporter && s.presenter ? '<br>' : ''}<span class="sub">${esc(s.presenter)}</span></td>
      <td class="num">${dur(s.duration)}</td>
      <td>${CHECKED[s.completed] || '—'}</td>
      <td>${cuez}</td></tr>`;
  }).join('');
  const target = n.target_duration != null ? ` against a target of ${dur(n.target_duration)} (${trt - n.target_duration >= 0 ? '+' : '−'}${dur(Math.abs(trt - n.target_duration))})` : '';

  const outcome = (p) => {
    if (p.status === 'picked') {
      const s = byId[p.story_id];
      return s ? `<span class="ok">Picked</span> <span class="sub">${shortTime(p.decided_at)}</span>` : `<span class="ok">Picked</span>, later dropped from the running order`;
    }
    if (p.status === 'spiked') return `<span class="no">Spiked</span>${p.spike_reason ? `: ${esc(p.spike_reason)}` : ''} <span class="sub">${shortTime(p.decided_at)}</span>`;
    return '<span class="sub">Not decided</span>';
  };
  const pitched = n.pitches.length, picked = n.pitches.filter((p) => p.status === 'picked').length, spiked = n.pitches.filter((p) => p.status === 'spiked').length;
  const confRows = n.pitches.map((p, i) => `<tr>
      <td class="num">${i + 1}</td>
      <td><strong>${esc(p.slug)}</strong>${p.status === 'picked' && byId[p.story_id]?.format ? ` <span class="tag">${esc(byId[p.story_id].format)}</span>` : ''}${p.angle ? `<div>${esc(p.angle)}</div>` : ''}</td>
      <td>${esc(p.pitched_by)}</td>
      <td>${outcome(p)}</td>
      <td>${p.ep_note ? esc(p.ep_note) : ''}</td></tr>`).join('');

  const scripts = withScripts ? order.map((id) => byId[id]).filter((s) => s && s.type !== 'segment' && s.script)
    .map((s) => `<div class="script"><h4>${esc(s.slug)}</h4><pre>${esc(s.script)}</pre></div>`).join('') : '';
  const feedback = feedbackGroups(n).map((g) => `<div class="fb"><h4>${esc(g.title)}</h4>${g.items.map((f) =>
    `${f.quote ? `<blockquote>${esc(f.quote)}</blockquote>` : ''}<p>${esc(f.body)}</p>`).join('')}</div>`).join('');

  return `<section class="newsroom" id="nr-${esc(n.id)}">
    <h2>${esc(n.name)}</h2>
    <p class="meta">${n.conference_started_at ? `Conference ${fullWhen(n.conference_started_at)}` : 'No conference held'}
      · Producer: ${n.producer_name ? esc(n.producer_name) : 'none claimed'}
      ${n.cuez_part_title ? ` · Cuez: ${esc(n.cuez_episode_title || '')} › ${esc(n.cuez_part_title)}` : ''}</p>
    <h3>News conference <span class="sub">${pitched} pitched · ${picked} picked · ${spiked} spiked</span></h3>
    ${pitched ? `<table><thead><tr><th class="num">#</th><th>Pitch</th><th>Pitched by</th><th>Outcome</th><th>EP note</th></tr></thead><tbody>${confRows}</tbody></table>` : '<p class="sub">No pitches recorded.</p>'}
    <h3>Running order <span class="sub">TRT ${dur(trt)}${target}</span></h3>
    ${roRows ? `<table><thead><tr><th class="num">#</th><th>Slug</th><th>Format</th><th>Reporter / presenter</th><th class="num">Dur</th><th>Checked</th><th>Cuez</th></tr></thead><tbody>${roRows}</tbody></table>` : '<p class="sub">No stories.</p>'}
    ${feedback ? `<h3>EP feedback</h3>${feedback}` : ''}
    ${scripts ? `<h3>Scripts</h3>${scripts}` : ''}
  </section>`;
}

function buildReport(data, withScripts) {
  const generated = new Date();
  const title = data.length === 1 ? `${data[0].name}: conference and running order` : 'Conference and running orders';
  const contents = data.length > 1 ? `<nav><strong>Newsrooms</strong><ol>${data.map((n) =>
    `<li><a href="#nr-${esc(n.id)}">${esc(n.name)}</a> <span class="sub">${n.pitches.length} pitched · ${n.pitches.filter((p) => p.status === 'picked').length} picked${n.producer_name ? ` · producer ${esc(n.producer_name)}` : ''}</span></li>`).join('')}</ol></nav>` : '';
  return `<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(title)}</title>
<style>
  :root { --ink:#1b1f27; --muted:#667085; --line:#dfe3ea; --head:#f4f6f9; --ok:#18794e; --no:#9a3412; --eop:#b42318; --seg:#4338ca; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .page { max-width: 980px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  h2 { font-size: 22px; margin: 0 0 4px; padding-top: 8px; }
  h3 { font-size: 15px; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .06em; }
  h3 .sub { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 6px; }
  h4 { margin: 14px 0 4px; font-size: 14px; }
  .meta, .sub { color: var(--muted); font-size: 13px; }
  nav { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin: 18px 0 8px; }
  nav ol { margin: 6px 0 0; padding-left: 20px; }
  .newsroom { border-top: 2px solid var(--ink); margin-top: 32px; padding-top: 8px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--head); padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num, th.num { text-align: right; width: 1%; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 4px; white-space: nowrap; }
  .ok { color: var(--ok); font-weight: 600; }
  .no { color: var(--no); font-weight: 600; }
  tr.eop td { background: var(--eop); color: #fff; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; }
  tr.seg td { color: var(--seg); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; background: #eef0ff; }
  tr.dim td { color: var(--muted); }
  .fb { border-left: 3px solid #b45309; padding: 2px 0 2px 12px; margin: 10px 0 14px; }
  .fb h4 { margin: 0 0 6px; }
  .fb blockquote { margin: 6px 0 2px; color: var(--muted); font-style: italic; white-space: pre-wrap; }
  .fb blockquote::before { content: "“"; } .fb blockquote::after { content: "”"; }
  .fb p { margin: 0 0 8px; white-space: pre-wrap; }
  .script pre { white-space: pre-wrap; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--head); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 0; }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
  @media (max-width: 640px) { table { font-size: 13px; } td, th { padding: 6px 5px; } }
  @media print {
    .page { max-width: none; padding: 0; }
    .newsroom { break-before: page; border-top: 0; margin-top: 0; }
    .newsroom:first-of-type { break-before: auto; }
    nav { break-after: page; }
    tr, .script, .fb { break-inside: avoid; }
    tr.eop td, tr.seg td, th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style></head>
<body><div class="page">
  <h1>${esc(title)}</h1>
  <p class="meta">Snapshot generated ${fullWhen(generated)}. Running orders may have changed since.</p>
  ${contents}
  ${data.map((n) => reportSection(n, withScripts)).join('').replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, '</table></div>')}
  <footer>Generated by Moira:Desk</footer>
</div></body></html>`;
}

let lastReport = null;
async function generateReport() {
  const ids = tickedIds();
  if (!ids.length) return;
  const withScripts = !!document.getElementById('report-scripts')?.checked;
  const data = await rpc('tutor_conference', { p_newsroom_ids: ids, p_scripts: withScripts });
  const html = buildReport(data, withScripts);
  const d = new Date(), pad = (x) => String(x).padStart(2, '0');
  const stamp = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`; // local time
  const who = data.length === 1 ? data[0].name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') : 'conference';
  if (lastReport) URL.revokeObjectURL(lastReport.url);
  lastReport = { url: URL.createObjectURL(new Blob([html], { type: 'text/html' })), name: `moira-desk-${who}-${stamp}.html` };
  const totals = data.map((n) => `<li><strong>${esc(n.name)}</strong>: ${n.pitches.length} pitched, ${n.pitches.filter((p) => p.status === 'picked').length} picked, ${n.stories.filter((s) => s.type !== 'segment').length} stories${n.feedback?.length ? `, ${n.feedback.length} EP comment${n.feedback.length === 1 ? '' : 's'}` : ''}</li>`).join('');
  openDialog('Report ready', `<ul style="margin:0;padding-left:20px">${totals}</ul>
    <p class="muted" style="margin:0">One self-contained web page${withScripts ? ', with scripts' : ''}: share it by email, Moodle or Teams, or print it to PDF. It's a snapshot of right now.</p>`,
    `<button data-action="open-report">Open in a new tab</button>
     <a class="btn primary" href="${lastReport.url}" download="${esc(lastReport.name)}">Download</a>`);
}


// Clear sensitive views and invalidate pending requests whenever the session ends.
function clearSession() {
  sessionEpoch++;
  if (wall) { clearInterval(wall.timer); wall.el.remove(); wall = null; }
  if (review) { review.dialog?.remove(); review.el.remove(); review = null; }
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  closeDialog();
  if (lastReport) URL.revokeObjectURL(lastReport.url);
  lastReport = null;
  state.user = null; state.rooms = []; state.selected.clear(); state.message = null; state.loading = false;
  render();
}
async function loadRooms() {
  if (!state.user) return;
  const epoch = sessionEpoch;
  state.loading = true; render();
  try {
    const rooms = await rpc('tutor_newsrooms') || [];
    if (epoch !== sessionEpoch) return;
    state.rooms = rooms;
    state.selected = new Set([...state.selected].filter(id => room(id)));
  } catch (e) {
    if (epoch !== sessionEpoch) return;
    state.rooms = []; state.selected.clear(); state.message = { text: e.message, tone: 'err' };
  }
  state.loading = false; render();
}
async function afterSignIn(user) {
  const epoch = sessionEpoch;
  try {
    const [admin, tutor] = await Promise.all([rpc('is_admin'), rpc('is_tutor')]);
    if (epoch !== sessionEpoch) return;
    if (!admin && !tutor) throw new Error('This account has no tutor access. Ask your administrator to enable it.');
    state.user = user; state.loginError = null;
    await loadRooms();
  } catch (e) {
    if (epoch !== sessionEpoch) return;
    state.loginError = e.message;
    await sb.auth.signOut({ scope: 'local' });
    clearSession();
  }
}

function getCaptchaToken() {
  if (!TURNSTILE_SITE_KEY) return Promise.resolve(undefined);
  if (location.protocol === 'file:') {
    return Promise.reject(new Error('The human check needs this page served from localhost, not opened as a file. See the README.'));
  }
  return new Promise((resolve, reject) => {
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999';
    document.body.appendChild(box);
    const done = (fn, v) => { box.remove(); fn(v); };
    const draw = () => window.turnstile.render(box, {
      sitekey: TURNSTILE_SITE_KEY, appearance: 'interaction-only',
      callback: t => done(resolve, t),
      'error-callback': () => done(reject, new Error('The human check failed. Check this hostname is allowed for the Turnstile widget.')),
      'timeout-callback': () => done(reject, new Error('The human check timed out. Try again.')),
    });
    if (window.turnstile) return draw();
    const sc = document.createElement('script');
    sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    sc.async = true; sc.onload = draw;
    sc.onerror = () => done(reject, new Error('Could not load the human check (Cloudflare Turnstile).'));
    document.head.appendChild(sc);
  });
}

document.addEventListener('submit', async e => {
  if (e.target.matches('[data-form="alert"]')) {
    e.preventDefault();
    const form = e.target, submit = e.submitter;
    if (form.dataset.busy) return;
    form.dataset.busy = 'true'; if (submit) submit.disabled = true;
    try { await sendBroadcastAlert(); }
    catch (error) {
      if (dlg.open) {
        dlg.querySelector('.alert-error')?.remove();
        dlg.querySelector('.body').insertAdjacentHTML('beforeend', `<div class="msg err alert-error" role="alert">${esc(error.message)}</div>`);
      } else flash(error.message, 'err');
    } finally {
      delete form.dataset.busy;
      if (submit?.isConnected) submit.disabled = false;
    }
    return;
  }
  if (!e.target.matches('[data-form="login"]')) return;
  e.preventDefault();
  if (state.loginBusy) return;
  state.loginEmail = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  state.loginBusy = true; state.loginError = null; render();
  try {
    const captchaToken = await getCaptchaToken();
    const { data, error } = await sb.auth.signInWithPassword({ email: state.loginEmail, password,
      ...(captchaToken ? { options: { captchaToken } } : {}) });
    if (error) throw error;
    await afterSignIn(data.user);
  } catch (e) { state.loginError = e.message; }
  finally { state.loginBusy = false; render(); }
});
document.addEventListener('click', async e => {
  const btn = e.target.closest('[data-action]');
  if (!btn || btn.disabled || !state.user) return;
  const action = btn.dataset.action, id = btn.dataset.id;
  btn.disabled = true;
  try {
    if (action === 'alert') alertDialog();
    else if (action === 'close-dialog') closeDialog();
    else if (action === 'refresh') { closeDialog(); state.message = null; await loadRooms(); }
    else if (action === 'sign-out') {
      const { error } = await sb.auth.signOut({ scope: 'local' });
      if (error) throw error;
      clearSession();
    }
    else if (action === 'wall') { if (!wall) await openWall(); }
    else if (action === 'wall-close') closeWall();
    else if (action === 'wall-note') await wallNote(id);
    else if (action === 'wall-zoom' && wall) {
      wall.zoom = Math.min(2.2, Math.max(0.7, Math.round((wall.zoom + Number(btn.dataset.val) * 0.15) * 100) / 100));
      wall.el.style.setProperty('--zoom', wall.zoom);
      try { sessionStorage.setItem('moiradesk-tutor-wall-zoom', String(wall.zoom)); } catch {}
    }
    else if (action === 'report') await generateReport();
    else if (action === 'open-report' && lastReport) window.open(lastReport.url, '_blank', 'noopener');
    else if (action === 'show-code') await showJoinCode(id);
    else if (action === 'review') await openReview(id);
    else if (action === 'review-close') closeReview();
    else if (action === 'review-refresh') await loadReview();
    else if (action === 'review-add') feedbackDialog({ storyId: id || null });
    else if (action === 'review-edit') { const item = review?.data?.feedback.find((f) => f.id === id); if (item) feedbackDialog({ storyId: item.story_id, item }); }
    else if (action === 'review-delete') await deleteFeedback(id);
    else if (action === 'copy-code') { await navigator.clipboard.writeText(document.getElementById('code-text').textContent); btn.textContent = 'Copied'; }
  } catch (e) {
    if (wall) { wall.error = e.message; renderWall(); }
    else if (review) { review.error = e.message; renderReview(); }
    else if (dlg.open) { closeDialog(); flash(e.message, 'err'); }
    else flash(e.message, 'err');
  } finally { btn.disabled = false; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && wall && !dlg.open) closeWall();
  else if (e.key === 'Escape' && review && !review.dialog && !dlg.open) closeReview();
});
dlg.addEventListener('close', () => { dlg.innerHTML = ''; });
document.addEventListener('change', e => {
  if (e.target.classList?.contains('sel-room')) {
    e.target.checked ? state.selected.add(e.target.dataset.id) : state.selected.delete(e.target.dataset.id);
    render();
  } else if (e.target.id === 'sel-all') {
    state.selected = e.target.checked ? new Set(state.rooms.map(r => r.newsroom_id)) : new Set(); render();
  } else if (e.target.id === 'report-scripts') state.reportScripts = e.target.checked;
});
if (sb) sb.auth.onAuthStateChange((event, session) => { if (event === 'SIGNED_OUT') clearSession(); });
(async () => {
  if (!configured) { render(); return; }
  try {
    const { data: { session }, error } = await sb.auth.getSession();
    if (error) throw error;
    if (session?.user) await afterSignIn(session.user);
    else render();
  } catch (e) { state.loginError = e.message; render(); }
})();

</script>
</body>
</html>
